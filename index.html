<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Circle D Flow — Lisbon's culture-tech RPG. Explore Vision, Bazaar, Sound & Taste worlds at Secret Garden LX.">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Circle D Flow | The Singularity</title>
    <meta name="google" content="notranslate">
    <script>
        const _twWarn = console.warn;
        console.warn = function (...args) {
            if (args[0] && String(args[0]).includes('cdn.tailwindcss.com')) return;
            _twWarn.apply(console, args);
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cinzel: ['Cinzel', 'serif'] }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/quest-triad.css?v=1.1">
    <style>
        :root {
            --haki-gold: #d4af37;
            --obsidian: #050505;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }

        .cinzel { font-family: 'Cinzel', serif; }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--obsidian);
            color: #fff;
            font-family: 'Space Mono', monospace;
            overflow-x: hidden;
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
        }

        .notranslate {
            translate: no;
        }

        /* 3D Canvas Background */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            z-index: 1;
        }

        /* Title Reveal */
        #title-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            opacity: 0;
            text-align: center;
            pointer-events: none;
        }

        #title-overlay h1 {
            font-family: 'Cinzel', serif;
            font-size: 5vw;
            letter-spacing: 0.2em;
            color: var(--haki-gold);
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.8);
            margin: 0;
        }

        /* Focus World Overlay */
        #world-info-overlay {
            position: fixed;
            bottom: calc(10% + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            border-radius: 10px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            max-width: min(520px, calc(100vw - 24px));
            width: calc(100% - 24px);
            box-sizing: border-box;
            cursor: pointer;
        }

        #world-title {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: var(--haki-gold);
            margin: 0 0 10px 0;
            letter-spacing: 5px;
        }

        #world-slogan {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            color: #ccc;
            margin: 0 0 15px 0;
        }

        .dive-hint {
            font-size: 0.7rem;
            color: #888;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulse-op 2s infinite;
        }

        @keyframes pulse-op {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; color: var(--haki-gold); }
        }

        /* Narrative Storytelling */
        #narrative-overlay {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1005;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            width: 80%;
            transition: opacity 1s ease;
        }

        #narrative-text {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: #fff;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            line-height: 1.6;
        }

        /* UI Overlays (Nav & Languages) */
        .top-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 40px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1002; /* Raised above flowee-intro (1000) so language switcher is clickable */
        }

        .logo-small {
            height: 40px;
            filter: drop-shadow(0 0 10px var(--haki-gold));
        }

        .lang-selector {
            display: flex;
            gap: 15px;
            background: rgba(0,0,0,0.4);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(5px);
        }

        .lang-selector span {
            cursor: pointer;
            font-size: 0.8rem;
            opacity: 0.5;
            transition: all 0.3s ease;
            display: inline-block;
            padding: 5px;
        }

        .lang-selector span:hover, .lang-selector span.active {
            opacity: 1;
            transform: scale(1.2);
            filter: drop-shadow(0 0 5px var(--haki-gold));
        }

        /* Scroll Helper */
        .scroll-down {
            position: fixed;
            bottom: 30px;
            right: 40px;
            z-index: 50;
            color: var(--haki-gold);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 3px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            opacity: 0.6;
            animation: scrolldown 2s infinite;
        }

        @keyframes scrolldown {
            0% { transform: translateY(0); }
            50% { transform: translateY(10px); }
            100% { transform: translateY(0); }
        }

        /* --- CINEMATIC LOGIN MODAL --- */
        #auth-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(15px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .auth-container {
            width: min(400px, calc(100vw - 32px));
            max-height: calc(100dvh - 32px);
            overflow-y: auto;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid var(--haki-gold);
            padding: clamp(24px, 5vw, 40px);
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.2);
            text-align: center;
            position: relative;
            box-sizing: border-box;
        }

        .auth-container h2 {
            font-family: 'Cinzel', serif;
            color: var(--haki-gold);
            letter-spacing: 5px;
            margin-bottom: 30px;
        }

        .auth-input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .auth-input-group label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
            margin-bottom: 8px;
        }

        .auth-input-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 12px;
            color: #fff;
            font-family: 'Space Mono', monospace;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        .auth-input-group input:focus {
            border-color: var(--haki-gold);
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            background: var(--haki-gold);
            color: #000;
            border: none;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .auth-btn:hover {
            background: #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        #auth-status {
            margin-top: 20px;
            font-size: 0.8rem;
            min-height: 1.2rem;
        }

        .close-auth {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #888;
            cursor: pointer;
            font-size: 1.5rem;
        }
        
        /* Flowee Intro Overlay */
        #flowee-intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            min-height: 100vh;
            z-index: 1000;
            background: var(--obsidian);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
            pointer-events: none; /* Let clicks pass to 3D canvas */
            overflow-y: auto;
        }

        #flowee-intro-text {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: #fff;
            text-align: center;
            max-width: 800px;
            min-height: 120px;
            letter-spacing: 4px;
            text-shadow: 0 0 25px rgba(139,92,246,0.6);
            line-height: 1.8;
            background: radial-gradient(circle at center, rgba(0,0,0,0.6) 0%, transparent 80%);
            padding: 40px;
            border-radius: 50%;
            pointer-events: none;
            transition: all 1s ease;
        }

        #hold-hint {
            position: fixed;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: var(--haki-gold);
            text-transform: uppercase;
            opacity: 0;
            z-index: 1001;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(212,175,55,0.5);
            animation: pulse-op 2s infinite;
        }

        #btn-skip {
            position: fixed;
            bottom: calc(16px + var(--safe-bottom));
            right: 16px;
            z-index: 1001;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.35);
            color: #fff;
            padding: 12px 20px;
            min-height: 44px;
            min-width: 44px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s;
            pointer-events: auto;
            touch-action: manipulation;
        }

        #btn-skip:hover {
            background: rgba(255,255,255,0.2);
            border-color: var(--haki-gold);
            color: var(--haki-gold);
        }

        /* Luvo Cathedral UI */
        #luvo-decision-ui {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            display: flex;
            gap: 40px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .luvo-path-btn {
            background: rgba(10, 10, 15, 0.7);
            border: 1px solid currentColor;
            padding: 30px 50px;
            border-radius: 10px;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            letter-spacing: 4px;
            color: #fff;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .luvo-path-btn.blue {
            color: #aaddff;
            box-shadow: 0 0 20px rgba(170, 221, 255, 0.2);
        }

        .luvo-path-btn.blue:hover {
            box-shadow: 0 0 40px rgba(170, 221, 255, 0.6);
            transform: scale(1.05);
            background: rgba(170, 221, 255, 0.1);
        }

        .luvo-path-btn.violet {
            color: #9a4dff;
            box-shadow: 0 0 20px rgba(154, 77, 255, 0.2);
        }

        .luvo-path-btn.violet:hover {
            box-shadow: 0 0 40px rgba(154, 77, 255, 0.6);
            transform: scale(1.05);
            background: rgba(154, 77, 255, 0.1);
        }

        .luvo-path-desc {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 10px;
            letter-spacing: 2px;
            color: #fff;
        }

        /* 3D Door Labels */
        .door-label {
            pointer-events: none;
            color: #fff;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0,0,0,1);
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.2);
            white-space: nowrap;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            #flowee-intro-text { font-size: 0.95rem; padding: 16px; letter-spacing: 2px; min-height: 80px; }
            #title-overlay h1 { font-size: clamp(1.75rem, 9vw, 3rem) !important; }
            #title-overlay p { font-size: 0.75rem !important; letter-spacing: 6px !important; }
            #world-title { font-size: 1.2rem; letter-spacing: 3px; }
            #world-slogan { font-size: 0.8rem; }
            #narrative-text { font-size: 1.05rem; letter-spacing: 2px; }
            #narrative-overlay { width: 92%; top: 38%; }
            .scroll-down { display: none; }
            .luvo-path-btn { padding: 20px 24px; font-size: 0.95rem; min-height: 44px; }
            #luvo-decision-ui { flex-direction: column; gap: 16px; width: calc(100% - 32px); }
            .landing-logo-text { display: none; }
            #world-info-overlay { padding: 16px 18px; bottom: calc(72px + var(--safe-bottom)); }
            .auth-input-group input { font-size: 16px; /* prevents iOS zoom */ }
        }

        @media (max-width: 380px) {
            #burger-btn { width: 44px; height: 44px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .scroll-down, #hold-hint { animation: none; }
        }

        .lang-dropdown.open { display: block !important; }
        .group:hover .lang-dropdown { display: block !important; }
        @media (hover: none) {
            .group:hover .lang-dropdown { display: none !important; }
            .lang-dropdown.open { display: block !important; }
        }
    </style>
</head>
<body class="notranslate">

    <!-- Standardized Header: Burger, Logo, Language -->
    <div class="fixed top-4 left-4 sm:top-6 sm:left-6 z-[1002]" style="padding-top: var(--safe-top);">
        <button id="burger-btn" type="button" aria-label="Open menu" class="w-11 h-11 sm:w-10 sm:h-10 flex flex-col justify-center items-center gap-1.5 bg-black/80 border border-[#d4af37]/50 rounded cursor-pointer touch-manipulation">
            <span class="w-6 h-0.5 bg-[#d4af37] transition-all duration-300"></span>
            <span class="w-6 h-0.5 bg-[#d4af37] transition-all duration-300"></span>
            <span class="w-6 h-0.5 bg-[#d4af37] transition-all duration-300"></span>
        </button>
    </div>

    <!-- Center Logo -->
    <div class="fixed top-4 sm:top-6 left-1/2 -translate-x-1/2 z-[1002] cursor-pointer touch-manipulation" style="padding-top: var(--safe-top);" onclick="window.location.reload();">
        <div class="flex items-center gap-2 sm:gap-3">
            <img src="Assets/images/cqr-logo-gold.png" alt="Circle D Flow" class="h-9 sm:h-10 drop-shadow-[0_0_10px_#d4af37] no-overflow-check" onerror="this.style.display='none'">
            <span class="landing-logo-text cinzel text-lg sm:text-xl tracking-widest text-[#d4af37] font-bold drop-shadow-[0_0_10px_rgba(212,175,55,0.4)]">CDF</span>
        </div>
    </div>

    <!-- Language Selector -->
    <div class="fixed top-4 right-4 sm:top-6 sm:right-6 z-[1002] font-mono text-sm" style="padding-top: var(--safe-top);">
        <button id="lang-toggle" type="button" aria-expanded="false" aria-haspopup="true" class="bg-[#111]/90 border border-[#d4af37]/50 text-[#d4af37] px-3 py-2 min-h-[44px] rounded hover:bg-white/10 transition flex items-center gap-1 touch-manipulation">
            <span id="current-lang-display">EN</span>
            <span class="text-[10px]">▼</span>
        </button>
        <div id="lang-dropdown" class="lang-dropdown hidden absolute right-0 mt-2 w-28 bg-black/95 border border-[#d4af37]/30 rounded overflow-hidden shadow-xl">
            <button type="button" onclick="setLanguage('en')" class="w-full text-gray-400 hover:text-[#d4af37] py-3 min-h-[44px] hover:bg-white/5 transition block touch-manipulation">EN</button>
            <button type="button" onclick="setLanguage('de')" class="w-full text-gray-400 hover:text-[#d4af37] py-3 min-h-[44px] hover:bg-white/5 transition block touch-manipulation">DE</button>
            <button type="button" onclick="setLanguage('fr')" class="w-full text-gray-400 hover:text-[#d4af37] py-3 min-h-[44px] hover:bg-white/5 transition block touch-manipulation">FR</button>
            <button type="button" onclick="setLanguage('pt')" class="w-full text-gray-400 hover:text-[#d4af37] py-3 min-h-[44px] hover:bg-white/5 transition block touch-manipulation">PT</button>
        </div>
    </div>

    <!-- Mobile Menu Overlay -->
    <div id="mobile-menu" class="fixed inset-0 bg-black/95 z-[10050] opacity-0 pointer-events-none transition-opacity duration-300 flex flex-col items-center justify-center" style="padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);">
        <nav class="flex flex-col gap-6 text-center px-6">
            <a href="pages/bantaba.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition py-2 min-h-[44px] flex items-center justify-center">Bantaba</a>
            <a href="pages/about.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition py-2 min-h-[44px] flex items-center justify-center">About Us</a>
            <a href="pages/portfolio_anime_reality.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition py-2 min-h-[44px] flex items-center justify-center">Portfolio</a>
            <a href="pages/partners.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition py-2 min-h-[44px] flex items-center justify-center">Alliance</a>
            <a href="pages/akwaba_kitchen.html" class="cinzel text-xl text-[#d4af37]/90 hover:text-[#d4af37] transition py-2 min-h-[44px] flex items-center justify-center border border-[#d4af37]/30 rounded-full mt-2">Taste · AkwabaLX</a>
        </nav>
    </div>

    <!-- Flowee Director Intro -->
    <div id="flowee-intro" style="background: transparent; z-index: 1000;"> <!-- Let Canvas handle background -->
        <div id="flowee-intro-text"></div>
    </div>
    <button id="btn-skip" data-i18n="skip_intro" onclick="if(window.OrbitEngine) window.OrbitEngine.skipIntro();">SKIP INTRO</button>

    <!-- The 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Cinematic Title -->
    <div id="title-overlay" style="opacity: 0; pointer-events: none; transition: opacity 2s ease;">
        <p style="letter-spacing: 12px; font-family:'Montserrat', sans-serif; opacity: 0.7; margin-bottom: 0px; font-size: 1rem; text-transform: uppercase;">Welcome to</p>
        <h1 style="margin-top: 10px; font-size: 6vw;">CIRCLE D FLOW</h1>
    </div>

    <!-- Narrative Overlay -->
    <div id="narrative-overlay">
        <h2 id="narrative-text"></h2>
    </div>

    <!-- Dynamic Focus Overlay for Worlds -->
    <div id="world-info-overlay" onclick="if(window.OrbitEngine && !window.OrbitEngine.isTransitioning) { const leafId = document.getElementById('world-title').getAttribute('data-i18n').replace('world_', '').replace('_tit', ''); window.OrbitEngine.handleOverlayClick(leafId); }">
        <h2 id="world-title" data-i18n="world_visionary_tit">...</h2>
        <p id="world-slogan" data-i18n="world_visionary_desc">...</p>
        <div class="dive-hint" data-i18n="dive_hint" data-i18n-mobile="dive_hint_mobile" style="cursor: pointer; min-height: 44px; display: flex; align-items: center; justify-content: center;">[ CLICK TO EXPLORE ]</div>
    </div>

    <div class="scroll-down" data-i18n="scroll_hint">SCROLL TO NAVIGATE</div>

    <!-- LUVO Inner Cathedral Decision (REPLACED BY 3D DOORS) -->

    <!-- CINEMATIC LOGIN MODAL -->
    <div id="auth-modal">
        <div class="auth-container">
            <span class="close-auth material-symbols-outlined" onclick="window.Gatekeeper.closeLoginModal()">close</span>
            <h2 data-i18n="login_title">THE RETURN</h2>
            
            <div class="auth-input-group">
                <label data-i18n="label_email">Identity (Email)</label>
                <input type="email" id="login-email" placeholder="explorer@flow.com">
            </div>
            
            <div class="auth-input-group">
                <label data-i18n="label_password">Cipher (Password)</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>
            
            <button class="auth-btn" data-i18n="btn_login" onclick="handleLogin()">CONFIRM IDENTITY</button>
            <div id="auth-status"></div>
            
            <div style="margin-top: 15px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <hr style="flex: 1; border-color: rgba(212,175,55,0.2);">
                <span style="color: #666; font-size: 0.7rem; letter-spacing: 1px;">OR</span>
                <hr style="flex: 1; border-color: rgba(212,175,55,0.2);">
            </div>
            <button onclick="if(window.handleOAuthLogin) window.handleOAuthLogin('google')" style="width: 100%; padding: 12px; background: white; color: #333; border: 1px solid #ccc; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width: 18px; height: 18px;">
                CONTINUE WITH GOOGLE
            </button>
            <button onclick="if(window.handleOAuthLogin) window.handleOAuthLogin('discord')" style="width: 100%; padding: 12px; background: #5865F2; color: white; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;">
                CONTINUE WITH DISCORD
            </button>
            
            <div style="margin-top: 20px; font-size: 0.7rem; color: #666; letter-spacing: 1px;">
                LOST YOUR CIPHER? <a href="#" onclick="handlePasswordReset(); return false;" style="color: var(--haki-gold);">RESET SIGNAL</a>
            </div>
        </div>

        function setLanguage(lang) {
            localStorage.setItem('cqr_lang', lang);
            const display = document.getElementById('current-lang-display');
            if (display) display.textContent = lang.toUpperCase();
            const dropdown = document.getElementById('lang-dropdown');
            const toggle = document.getElementById('lang-toggle');
            if (dropdown) dropdown.classList.remove('open');
            if (toggle) toggle.setAttribute('aria-expanded', 'false');

            const isMobile = window.matchMedia('(max-width: 768px)').matches;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                const mobileKey = el.getAttribute('data-i18n-mobile');
                const useKey = (isMobile && mobileKey && window.i18n[lang]?.[mobileKey]) ? mobileKey : key;
                if (window.i18n[lang] && window.i18n[lang][useKey]) {
                    el.innerHTML = window.i18n[lang][useKey];
                }
            });
        }

        // Expose globally for OrbitEngine updates
        window.refreshLanguages = () => {
             const lang = localStorage.getItem('cqr_lang') || 'en';
             setLanguage(lang);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('cqr_lang') || 'en';
            setLanguage(savedLang);

            const langToggle = document.getElementById('lang-toggle');
            const langDropdown = document.getElementById('lang-dropdown');
            if (langToggle && langDropdown) {
                langToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const open = langDropdown.classList.toggle('open');
                    langDropdown.classList.toggle('hidden', !open);
                    langToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                });
                document.addEventListener('click', () => {
                    langDropdown.classList.remove('open');
                    langDropdown.classList.add('hidden');
                    langToggle.setAttribute('aria-expanded', 'false');
                });
            }

            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches && window.OrbitEngine?.skipIntro) {
                setTimeout(() => window.OrbitEngine.skipIntro(), 800);
            }
        });
        window.addEventListener('resize', () => {
            if (window.refreshLanguages) window.refreshLanguages();
        });
    </script>
    <script>
        // Burger Menu Logic
        document.addEventListener('DOMContentLoaded', () => {
            const burgerBtn = document.getElementById('burger-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            if (burgerBtn && mobileMenu) {
                const spans = burgerBtn.querySelectorAll('span');
                let menuOpen = false;
                burgerBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    menuOpen = !menuOpen;
                    if(menuOpen) {
                        mobileMenu.classList.remove('opacity-0', 'pointer-events-none');
                        mobileMenu.classList.add('opacity-100', 'pointer-events-auto');
                        spans[0].style.transform = 'rotate(45deg) translate(5px, 5px)';
                        spans[1].style.opacity = '0';
                        spans[2].style.transform = 'rotate(-45deg) translate(5px, -5px)';
                    } else {
                        mobileMenu.classList.remove('opacity-100', 'pointer-events-auto');
                        mobileMenu.classList.add('opacity-0', 'pointer-events-none');
                        spans[0].style.transform = 'none';
                        spans[1].style.opacity = '1';
                        spans[2].style.transform = 'none';
                    }
                });
                mobileMenu.querySelectorAll('a').forEach((link) => {
                    link.addEventListener('click', () => {
                        menuOpen = false;
                        mobileMenu.classList.remove('opacity-100', 'pointer-events-auto');
                        mobileMenu.classList.add('opacity-0', 'pointer-events-none');
                        spans[0].style.transform = 'none';
                        spans[1].style.opacity = '1';
                        spans[2].style.transform = 'none';
                    });
                });
            }
        });
    </script>
