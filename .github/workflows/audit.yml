name: "EXT_INSPECTOR: Code Quality"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  inspector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Allowlist only active membership surfaces (legacy pages/ has many HTML5 issues).
      - name: Prepare membership HTML allowlist
        run: |
          set -euo pipefail
          mkdir -p _lint_membership
          for f in \
            pages/membership_plans.html \
            pages/member_card.html \
            pages/membership.html \
            pages/admin_membership.html
          do
            if [ -f "$f" ]; then
              cp "$f" "_lint_membership/$(basename "$f")"
              echo "linting $f"
            fi
          done
          ls -la _lint_membership

      - name: HTML Lint (membership surfaces)
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: _lint_membership

      - name: JS Syntax Check
        run: |
          set -e
          for f in \
            script.js \
            js/membership_plans.js \
            js/member_card.js \
            js/agents/flowee.js \
            js/agents/admin_flowee_guide.js
          do
            if [ -f "$f" ]; then
              echo "check $f"
              node --check "$f"
            fi
          done
