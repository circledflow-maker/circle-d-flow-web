name: "EXT_WATCHDOG: Uptime Monitor"

on:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Check Status
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" https://circledflow.netlify.app)
          if [ "$STATUS" -eq 200 ]; then
            echo "STATUS: 200 OK"
          else
            echo "::error::SITE DOWN! Status: $STATUS"
            exit 1
          fi
