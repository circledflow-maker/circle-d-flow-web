    <h1 class="text-3xl font-bold mb-4 text-purple-500">System Reset</h1>
    <p class="mb-8 text-gray-400">This will clear your local "User State" and restart the Phoenix Tour.</p>
    
    <button onclick="resetAndRedirect()" class="px-8 py-4 bg-purple-600 hover:bg-purple-500 rounded-full font-bold transition-all shadow-lg hover:shadow-purple-500/50">
        RESET & RESTART
    </button>
    <p id="status" class="mt-4 text-sm text-gray-500 opacity-0 transition-opacity">Resetting...</p>

    <script>
        function resetAndRedirect() {
            const status = document.getElementById('status');
            status.style.opacity = '1';
            
            // Clear all relevant keys
            localStorage.removeItem('circle_user_state');
            localStorage.removeItem('hasSeenWelcome');
            localStorage.removeItem('user_lang');
            
            setTimeout(() => {
                // Redirect to Root Index
                window.location.href = '../Index.html';
            }, 1000);
        }
    </script>
    <div id="flowee-agent" class="fixed bottom-8 left-8 z-50 flex flex-col items-center group cursor-pointer"></div>
