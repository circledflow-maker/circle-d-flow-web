<body class="bg-[#0F0A13] text-white min-h-screen relative overflow-x-hidden">

    <main class="pt-24 pb-20 px-6 max-w-4xl mx-auto flex items-center justify-center min-h-[90vh]">
        <!-- Parchment Container -->
        <div class="relative w-full p-8 md:p-16 text-[#3E2723]">
            
            <!-- Paper Background (CSS Generated for now) -->
            <div class="absolute inset-0 bg-[#D4C6A9] transform rotate-1 rounded-sm shadow-[0_0_50px_rgba(0,0,0,0.5)] z-0" style="background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png'); box-shadow: inset 0 0 100px rgba(62,39,35,0.4);"></div>
            <div class="absolute inset-0 bg-[#D4C6A9] transform -rotate-1 rounded-sm shadow-xl z-0 opacity-80 mix-blend-multiply"></div>
            
            <!-- Content -->
            <div class="relative z-10">
                <div class="text-center mb-10">
                    <span class="font-mono font-bold uppercase tracking-[0.3em] text-[#5D4037] opacity-80 text-sm">Sacred Vow</span>
                    <h1 class="text-5xl md:text-6xl font-display font-bold mb-4 text-[#3E2723] drop-shadow-sm">Decree of the Flow</h1>
                    <div class="w-32 h-1 bg-[#3E2723] mx-auto rounded-full opacity-30 my-4"></div>
                    <p class="font-hand italic text-[#5D4037] text-lg">"As the River shapes the Earth, so does your Will shape the Kingdom."</p>
                </div>

                <form id="create-quest-form" class="space-y-8">
                    <div class="relative">
                        <label class="block font-display font-bold text-lg text-[#3E2723] mb-2 pl-2">The Calling (Title)</label>
                        <input type="text" name="title" required
                            class="w-full bg-[#3E2723]/10 border-b-2 border-[#3E2723]/30 px-4 py-3 text-[#3E2723] font-mono text-xl placeholder-[#3E2723]/40 focus:border-[#3E2723] focus:outline-none focus:bg-[#3E2723]/5 transition-all rounded-t-lg"
                            placeholder="e.g. Awakening the Dragon's Pulse">
                    </div>

                    <div class="relative">
                        <label class="block font-display font-bold text-lg text-[#3E2723] mb-2 pl-2">Prophecy & Path</label>
                        <textarea name="description" rows="4" required
                            class="w-full bg-[#3E2723]/10 border-2 border-[#3E2723]/20 rounded-lg px-6 py-4 text-[#3E2723] font-mono text-lg leading-relaxed placeholder-[#3E2723]/40 focus:border-[#3E2723]/50 focus:outline-none transition-all resize-none"
                            placeholder="What must be done to align with the Flow?"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <label class="block font-display font-bold text-lg text-[#3E2723] mb-2 pl-2">Karma Reward</label>
                            <div class="relative">
                                <select name="xpReward"
                                    class="w-full bg-[#3E2723] text-[#D4C6A9] font-bold border-2 border-[#3E2723] rounded-lg px-6 py-4 appearance-none focus:outline-none shadow-lg cursor-pointer hover:bg-[#5D4037] transition-colors font-mono">
                                    <option value="15">Spark (15 Flow)</option>
                                    <option value="50">Ripple (50 Flow)</option>
                                    <option value="100">Wave (100 Flow)</option>
                                    <option value="200">Torrent (200 Flow)</option>
                                    <option value="500">Tsunami (500 Flow)</option>
                                </select>
                                <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-[#D4C6A9] pointer-events-none">arrow_drop_down</span>
                            </div>
                        </div>
                        <div>
                            <label class="block font-display font-bold text-lg text-[#3E2723] mb-2 pl-2">Nature of Quest</label>
                            <div class="relative">
                                <select name="type"
                                    class="w-full bg-[#3E2723] text-[#D4C6A9] font-bold border-2 border-[#3E2723] rounded-lg px-6 py-4 appearance-none focus:outline-none shadow-lg cursor-pointer hover:bg-[#5D4037] transition-colors font-mono">
                                    <option value="Harmonize">Harmonize (Social)</option>
                                    <option value="Discovery">Discovery (Scout)</option>
                                    <option value="Creation">Creation (Art/Music)</option>
                                    <option value="Balance">Balance (Wellness)</option>
                                </select>
                                <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-[#D4C6A9] pointer-events-none">category</span>
                            </div>
                        </div>
                    </div>

                    <div class="pt-8 flex justify-center">
                        <button type="submit"
                            class="relative px-12 py-5 bg-[#3E2723] text-[#D4C6A9] font-display font-bold text-xl uppercase tracking-widest rounded shadow-[0_5px_15px_rgba(62,39,35,0.4)] hover:bg-[#5D4037] hover:-translate-y-1 hover:shadow-[0_10px_20px_rgba(62,39,35,0.5)] transition-all flex items-center gap-3 group">
                            <span class="material-symbols-outlined text-2xl group-hover:rotate-12 transition-transform h-8 w-8">auto_fix</span>
                            <span>Manifest Intent</span>
                            
                            <!-- Wax Seal Visual -->
                            <div class="absolute -right-6 -bottom-6 w-16 h-16 bg-[#8B4513] rounded-full flex items-center justify-center shadow-inner border-4 border-[#3E2723] group-hover:scale-110 transition-transform">
                                <span class="font-cinzel text-xs text-[#D4C6A9] opacity-80">道</span>
                            </div>
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- Corner Decorations -->
            <div class="absolute top-0 left-0 w-24 h-24 border-t-4 border-l-4 border-[#3E2723] opacity-20 rounded-tl-3xl m-4 pointer-events-none"></div>
            <div class="absolute top-0 right-0 w-24 h-24 border-t-4 border-r-4 border-[#3E2723] opacity-20 rounded-tr-3xl m-4 pointer-events-none"></div>
            <div class="absolute bottom-0 left-0 w-24 h-24 border-b-4 border-l-4 border-[#3E2723] opacity-20 rounded-bl-3xl m-4 pointer-events-none"></div>
            <div class="absolute bottom-0 right-0 w-24 h-24 border-b-4 border-r-4 border-[#3E2723] opacity-20 rounded-br-3xl m-4 pointer-events-none"></div>

        </div>
    </main>

    <script src="../js/gamification.js"></script>
    <script src="../js/quest-manager.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const G = window.Gamification;
            const Q = window.QuestManager;

            // Level Check REMOVED for Tutorial Flexibility
            // const level = G ? G.getLevel() : 0;
            
            const form = document.getElementById('create-quest-form');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const formData = new FormData(form);

                Q.pushQuest(
                    formData.get('type'),
                    formData.get('title'),
                    formData.get('description'),
                    parseInt(formData.get('xpReward'))
                );

                // Award XP to creator for engagement
                if (G) G.addXP(20, 'Created Quest');

                // Dispatch Event for Flowee to handle (Congratulation + Redirect)
                const event = new CustomEvent('cdf-quest-created', {
                    detail: { title: formData.get('title') }
                });
                window.dispatchEvent(event);

                // Fallback safety if Flowee doesn't catch it
                setTimeout(() => {
                    if(!window.floweeRedirected) {
                         window.location.href = 'marketplace.html?tutorial=true';
                    }
                }, 6000);
            });
        });
    </script>
