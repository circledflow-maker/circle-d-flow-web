<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Museum | Circle D Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0F0A13; color: white; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .text-electric { color: #9A4DFF; }
    </style>
</head>
<body class="bg-[#0F0A13] text-white min-h-screen selection:bg-purple-500 selection:text-white pb-20">

    <!-- Back to Hub -->
    <a href="dashboard.html" class="fixed top-8 left-8 z-50 bg-black/50 backdrop-blur-md border border-white/10 p-3 rounded-full hover:bg-white hover:text-black transition-all flex items-center gap-2 group">
        <span class="material-symbols-outlined">arrow_back</span>
        <span class="text-xs font-bold uppercase tracking-widest hidden group-hover:block">Return to Command</span>
    </a>

    <main class="max-w-6xl mx-auto px-6 py-24">
        <!-- Header -->
        <div class="text-center mb-16 relative">
            <h1 class="text-5xl md:text-7xl font-serif italic font-bold text-transparent bg-clip-text bg-gradient-to-br from-electric to-blue-400 mb-4">The Museum</h1>
            <p class="text-white/60 text-lg uppercase tracking-wider">Witness the History. Master Gyo.</p>
             <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-purple-900/10 blur-[100px] -z-10 rounded-full"></div>
        </div>

        <!-- Exhibit Grid -->
        <div class="grid md:grid-cols-3 gap-8">
            
            <!-- Exhibit 1 -->
            <div class="group relative aspect-[3/4] bg-white/5 rounded-2xl overflow-hidden border border-white/10 hover:border-electric/50 transition-all cursor-pointer">
                <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80"></div>
                <!-- Placeholder Image -->
                <div class="w-full h-full bg-gray-800 group-hover:scale-105 transition-transform duration-700"></div>
                
                <div class="absolute bottom-0 left-0 p-6">
                    <span class="text-electric text-xs font-bold uppercase tracking-widest mb-1 block">Origin Story</span>
                    <h3 class="text-2xl font-serif font-bold text-white mb-2">The First Circle</h3>
                    <p class="text-white/60 text-sm opacity-0 group-hover:opacity-100 transition-opacity transform translate-y-2 group-hover:translate-y-0 duration-300">
                        How the protocol began in the underground of Lisbon.
                    </p>
                </div>
            </div>

             <!-- Exhibit 2 -->
            <div class="group relative aspect-[3/4] bg-white/5 rounded-2xl overflow-hidden border border-white/10 hover:border-blue-400/50 transition-all cursor-pointer">
                <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80"></div>
                <div class="w-full h-full bg-gray-700 group-hover:scale-105 transition-transform duration-700"></div>
                
                <div class="absolute bottom-0 left-0 p-6">
                    <span class="text-blue-400 text-xs font-bold uppercase tracking-widest mb-1 block">Artifact</span>
                    <h3 class="text-2xl font-serif font-bold text-white mb-2">The Golden Vinyl</h3>
                    <p class="text-white/60 text-sm opacity-0 group-hover:opacity-100 transition-opacity transform translate-y-2 group-hover:translate-y-0 duration-300">
                        A legendary relic from the Outbreak Era.
                    </p>
                </div>
            </div>

             <!-- Exhibit 3 (Locked) -->
            <div class="relative aspect-[3/4] bg-black/50 rounded-2xl overflow-hidden border border-white/5 flex flex-col items-center justify-center text-center p-6">
                <!-- Static Noise Overlay -->
                <div class="absolute inset-0 opacity-10" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=\'0 0 200 200\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noiseFilter\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.65\' numOctaves=\'3\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noiseFilter)\' opacity=\'0.4\'/%3E%3C/svg%3E');"></div>
                
                <span class="material-symbols-outlined text-4xl text-white/20 mb-4">lock</span>
                <h3 class="text-xl font-bold text-white/30 uppercase tracking-widest">Restricted Archive</h3>
                <p class="text-xs text-white/20 mt-2">Level 10 Clearance Required</p>
            </div>

        </div>
    </main>
    
    <script src="../js/agents/cortex.js"></script>
    <script src="../js/agents/bridge_pusher.js"></script>

    <script src="../js/agents/flowee.js" defer></script>
    <div id="flowee-agent" class="fixed bottom-8 left-8 z-50 flex flex-col items-center group cursor-pointer"></div>
    <script src="../js/agents/helper.js" defer></script>

    <!-- DYNAMIC MUSEUM LOGIC -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
             const ledger = JSON.parse(localStorage.getItem('cdf_ledger') || '[]');
             // Filter high value items (> 100)
             const masterpieces = ledger.filter(tx => tx.price && parseInt(tx.price) > 100)
                                        .sort((a,b) => parseInt(b.price) - parseInt(a.price))
                                        .slice(0, 3);
             
             if(masterpieces.length > 0) {
                 const container = document.querySelector('.grid');
                 masterpieces.forEach(item => {
                     const div = document.createElement('div');
                     div.className = "group relative aspect-[3/4] bg-white/5 rounded-2xl overflow-hidden border border-white/10 hover:border-mystic-gold/50 transition-all cursor-pointer";
                     div.innerHTML = `
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80"></div>
                        <div class="w-full h-full bg-gray-900 group-hover:scale-105 transition-transform duration-700 flex items-center justify-center">
                            <span class="material-symbols-outlined text-6xl text-white/10 group-hover:text-mystic-gold transition-colors">diamond</span>
                        </div>
                        <div class="absolute bottom-0 left-0 p-6">
                            <span class="text-mystic-gold text-xs font-bold uppercase tracking-widest mb-1 block">Community Treasure</span>
                            <h3 class="text-2xl font-serif font-bold text-white mb-2">${item.item}</h3>
                            <p class="text-white/60 text-sm opacity-0 group-hover:opacity-100 transition-opacity transform translate-y-2 group-hover:translate-y-0 duration-300">
                                Acquired by ${item.buyer} for ${item.price}
                            </p>
                        </div>
                     `;
                     container.appendChild(div);
                 });
             }
        });
    </script>
</body>
</html>
