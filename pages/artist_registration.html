<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Artist Registration | Circle D Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="../js/api_config.js"></script>
    <script src="../js/agents/supabase_client.js?v=4.1"></script>
    <style>
        body { background-color: #09090b; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 relative">
    <!-- Starfield BG -->
    <div id="starfield" class="fixed inset-0 z-[-1] opacity-50"></div>

    <div class="bg-[#111] text-white p-6 rounded-2xl border border-[#d4af37]/30 w-full max-w-md relative shadow-[0_0_30px_rgba(212,175,55,0.15)] z-10">
        <div class="text-center mb-6">
            <h1 class="font-serif text-3xl text-[#d4af37] mb-2 uppercase tracking-widest">Artist Onboarding</h1>
            <p class="text-xs text-white/50 uppercase tracking-widest">Register for Event Access</p>
        </div>

        <div id="artist-signup-flow" class="w-full">
            <div id="artist-type-selection" class="flex flex-col gap-4 my-6">
                <p class="text-center text-white/50 text-[10px] uppercase tracking-widest">Select Artist Category:</p>
                <button onclick="selectArtistType('performance')" class="bg-[#d4af37] text-black p-3 rounded font-bold uppercase tracking-widest text-xs hover:bg-[#d4af37]/80 transition shadow-[0_0_15px_rgba(212,175,55,0.3)]">Performance Artist</button>
                <button onclick="selectArtistType('service')" class="bg-[#00ffcc]/10 text-[#00ffcc] p-3 rounded font-bold uppercase tracking-widest text-xs hover:bg-[#00ffcc]/20 transition border border-[#00ffcc]/30 shadow-[0_0_15px_rgba(0,255,204,0.1)]">Service Artist</button>
            </div>

            <div id="artist-form-container" class="hidden space-y-4 text-sm mt-4 px-1">
                <input type="text" id="artist-form-name" placeholder="Name / Stage Name" class="w-full bg-black border border-white/20 rounded p-3 text-white outline-none focus:border-[#d4af37]">
                <input type="email" id="artist-form-email" placeholder="Email" class="w-full bg-black border border-white/20 rounded p-3 text-white outline-none focus:border-[#d4af37]">
                <input type="text" id="artist-form-phone" placeholder="Phone" class="w-full bg-black border border-white/20 rounded p-3 text-white outline-none focus:border-[#d4af37]">
                <input type="text" id="artist-form-ig" placeholder="Instagram (optional)" class="w-full bg-black border border-white/20 rounded p-3 text-white outline-none focus:border-[#d4af37]">

                <div id="perf-fields" class="hidden space-y-4">
                    <select id="artist-form-category" class="w-full bg-black border border-white/20 rounded p-3 text-white outline-none focus:border-[#d4af37]">
                        <option value="" disabled selected>Select Category</option>
                        <option value="movement">Movement / Dance</option>
                        <option value="audiovisual">Audiovisual / Music</option>
                        <option value="visual">Visual Art</option>
                    </select>
                    <textarea id="artist-form-tech" placeholder="Technical Needs (Mic, Space, etc.)" class="w-full bg-black border border-white/20 rounded p-3 text-white outline-none focus:border-[#d4af37] resize-none" rows="3"></textarea>
                </div>

                <div id="service-fields" class="hidden space-y-3">
                    <p class="text-[10px] uppercase tracking-widest text-[#d4af37] font-bold">Inventory / Products</p>
                    <div id="product-list" class="space-y-2">
                        <div class="flex gap-2 product-row">
                            <input type="text" placeholder="Product Name" class="bg-black border border-white/20 rounded p-2 text-white outline-none focus:border-[#d4af37] flex-1 text-xs prod-name">
                            <input type="number" placeholder="Qty" value="1" class="bg-black border border-white/20 rounded p-2 text-white outline-none focus:border-[#d4af37] w-14 text-xs prod-qty">
                            <input type="number" step="0.01" placeholder="Price" class="bg-black border border-white/20 rounded p-2 text-white outline-none focus:border-[#d4af37] w-20 text-xs prod-price">
                        </div>
                    </div>
                    <button onclick="addProductRow()" class="text-[10px] text-[#00ffcc] uppercase tracking-widest hover:underline">+ Add Product</button>
                </div>

                <label class="flex items-center gap-2 text-[10px] text-white/50 py-2 cursor-pointer uppercase tracking-widest">
                    <input type="checkbox" id="artist-form-photo-release" class="accent-[#d4af37]">
                    Accept Photo & Video Release for Content
                </label>

                <div class="flex gap-2 mt-4">
                    <button onclick="goBackToSelection()" class="w-1/3 bg-white/5 border border-white/10 text-white font-bold uppercase tracking-widest py-3 rounded-lg hover:bg-white/10 transition text-xs">Back</button>
                    <button onclick="submitArtistIngest()" id="btn-submit-ingest" class="w-2/3 bg-[#d4af37] text-black font-bold uppercase tracking-widest py-3 rounded-lg hover:bg-[#d4af37]/80 transition flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(212,175,55,0.4)]">
                        Register
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Setup Starfield
        const canvas = document.createElement('canvas');
        document.getElementById('starfield').appendChild(canvas);
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const stars = Array.from({length: 100}).map(() => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2,
            speed: Math.random() * 0.5 + 0.1
        }));
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                ctx.fill();
                s.y += s.speed;
                if(s.y > canvas.height) s.y = 0;
            });
            requestAnimationFrame(draw);
        }
        draw();

        // Retrieve event ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('eventId');

        if(!eventId) {
            alert("No Event ID found in the URL. Please scan the QR code from the Door Manager.");
        }

        let currentArtistType = null;

        function selectArtistType(type) {
            currentArtistType = type;
            document.getElementById('artist-type-selection').classList.add('hidden');
            document.getElementById('artist-form-container').classList.remove('hidden');
            
            if(type === 'performance') {
                document.getElementById('perf-fields').classList.remove('hidden');
                document.getElementById('service-fields').classList.add('hidden');
            } else {
                document.getElementById('service-fields').classList.remove('hidden');
                document.getElementById('perf-fields').classList.add('hidden');
            }
        }

        function goBackToSelection() {
            document.getElementById('artist-form-container').classList.add('hidden');
            document.getElementById('artist-type-selection').classList.remove('hidden');
        }

        function addProductRow() {
            const list = document.getElementById('product-list');
            const row = document.createElement('div');
            row.className = 'flex gap-2 product-row mt-2';
            row.innerHTML = `
                <input type="text" placeholder="Product Name" class="bg-black border border-white/20 rounded p-2 text-white outline-none focus:border-[#d4af37] flex-1 text-xs prod-name">
                <input type="number" placeholder="Qty" value="1" class="bg-black border border-white/20 rounded p-2 text-white outline-none focus:border-[#d4af37] w-14 text-xs prod-qty">
                <input type="number" step="0.01" placeholder="Price" class="bg-black border border-white/20 rounded p-2 text-white outline-none focus:border-[#d4af37] w-20 text-xs prod-price">
            `;
            list.appendChild(row);
        }

        async function submitArtistIngest() {
            const name = document.getElementById('artist-form-name').value.trim();
            const email = document.getElementById('artist-form-email').value.trim();
            const phone = document.getElementById('artist-form-phone').value.trim();
            const ig = document.getElementById('artist-form-ig').value.trim();
            const photoRelease = document.getElementById('artist-form-photo-release').checked;
            
            if(!name || !email) return alert("Name and Email are required!");
            if(!eventId) return alert("Missing Event ID. Registration aborted.");
            if(!window.supabaseClient) return alert("Database connection loading... Please try again.");

            const btn = document.getElementById('btn-submit-ingest');
            const origHTML = btn.innerHTML;
            btn.innerHTML = 'Registering...';
            btn.disabled = true;

            const permanentQrCode = `KY-FLOW-${Date.now()}`;

            try {
                const { data: artist, error: artistErr } = await window.supabaseClient
                    .from('master_artists')
                    .insert([{
                        name: name,
                        email: email,
                        phone: phone,
                        instagram: ig,
                        artist_type: currentArtistType,
                        permanent_qr_code: permanentQrCode,
                        photo_release_granted: photoRelease
                    }])
                    .select()
                    .single();

                if(artistErr) {
                    if(artistErr.code === '23505') { // unique violation
                        throw new Error("Email is already registered! Please inform the door manager.");
                    }
                    throw artistErr;
                }

                if(currentArtistType === 'performance') {
                    const cat = document.getElementById('artist-form-category').value;
                    const tech = document.getElementById('artist-form-tech').value;
                    await window.supabaseClient.from('performance_details').insert([{
                        artist_id: artist.id,
                        performance_category: cat,
                        technical_needs: tech,
                        event_id: eventId
                    }]);
                } else {
                    const rows = document.querySelectorAll('.product-row');
                    const inventories = [];
                    rows.forEach(r => {
                        const pName = r.querySelector('.prod-name').value;
                        const pQty = parseInt(r.querySelector('.prod-qty').value) || 0;
                        const pPrice = parseFloat(r.querySelector('.prod-price').value) || 0;
                        if(pName) {
                            inventories.push({ artist_id: artist.id, event_id: eventId, product_name: pName, quantity: pQty, price: pPrice });
                        }
                    });
                    if(inventories.length > 0) await window.supabaseClient.from('service_inventories').insert(inventories);
                }

                await window.supabaseClient.from('event_checkins').insert([{
                    event_id: eventId,
                    artist_id: artist.id,
                    ticket_type: 'Free_Artist'
                }]);

                const container = document.getElementById('artist-signup-flow');
                container.innerHTML = `
                    <div class="text-center mt-6">
                        <span class="material-symbols-outlined text-5xl text-green-500 mb-2 drop-shadow-[0_0_10px_rgba(34,197,94,0.5)]">check_circle</span>
                        <h3 class="font-serif text-xl text-[#d4af37] uppercase tracking-widest mb-2">Registration Complete</h3>
                        <p class="text-sm text-white/70 mb-4">Please present this QR code to the door manager.</p>
                        <div id="new-artist-qr" class="bg-white p-4 inline-block rounded-xl shadow-[0_0_20px_rgba(255,255,255,0.2)]"></div>
                        <p class="text-[10px] text-white/50 mt-4 break-all opacity-50">${permanentQrCode}</p>
                        <p class="text-xs text-[#00ffcc] mt-4 font-bold uppercase tracking-widest">Screenshot and save this code <br/>for future events!</p>
                    </div>
                `;
                
                const qrDataUrl = await QRCode.toDataURL(permanentQrCode, { width: 250, margin: 1, color: { dark: '#000000ff', light: '#ffffffff' } });
                document.getElementById('new-artist-qr').innerHTML = `<img src="${qrDataUrl}" alt="Your Artist QR Code" />`;

            } catch(e) {
                console.error("Ingest error", e);
                alert("Error registering: " + e.message);
                btn.innerHTML = origHTML;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
