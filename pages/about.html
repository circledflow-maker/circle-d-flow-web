<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>About Us - Circle D Flow</title>
    
    <!-- Fonts & Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <style>
        :root {
            --haki-gold: #d4af37;
            --dark-void: #0a0a0a;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--dark-void);
            color: white;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, .cinzel { font-family: 'Cinzel', serif; }
        .gold-glow { text-shadow: 0 0 15px rgba(212,175,55,0.6); }

        /* Ambient Dust */
        .dust-particles {
            position: absolute;
            width: 100%; height: 100%;
            background-image: radial-gradient(circle, rgba(212,175,55,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.3;
            animation: drift 20s linear infinite;
            z-index: 0;
            pointer-events: none;
            top: 0; left: 0;
            position: fixed;
        }
        @keyframes drift {
            from { background-position: 0 0; }
            to { background-position: 100px 100px; }
        }

        /* Burger Menu Styles */
        #burger-btn span {
            transform-origin: center;
        }
    </style>
</head>
<body class="notranslate">

    <!-- Mobile Header & Burger Menu -->
    <div class="fixed top-6 left-6 z-[100]">
        <button id="burger-btn" class="w-10 h-10 flex flex-col justify-center items-center gap-1.5 bg-black border border-[#d4af37]/50 rounded cursor-pointer z-[101]">
            <span class="w-6 h-0.5 bg-[#d4af37] transition-all duration-300"></span>
            <span class="w-6 h-0.5 bg-[#d4af37] transition-all duration-300"></span>
            <span class="w-6 h-0.5 bg-[#d4af37] transition-all duration-300"></span>
        </button>
    </div>

    <!-- Fullscreen Mobile Menu Overlay -->
    <div id="mobile-menu" class="fixed inset-0 bg-black/95 z-[90] opacity-0 pointer-events-none transition-opacity duration-300 flex flex-col items-center justify-center">
        <nav class="flex flex-col gap-6 text-center">
            <a href="../index.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition">Zum Orbit</a>
            <a href="bantaba.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition">Nach Bantaba</a>
            <a href="about.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition">About Us</a>
            <a href="portfolio_anime_reality.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition">Portfolio</a>
            <a href="heart.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition">Heart</a>
            <a href="luvo.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition">Luvo</a>
        </nav>
    </div>


    <div class="dust-particles"></div>

    <!-- Language Selector -->
    <div class="absolute top-6 right-6 z-[100]">
        <select onchange="changeLanguage(this.value)" id="lang-select" class="bg-black border border-[#d4af37]/50 text-[#d4af37] px-3 py-1 text-sm cinzel focus:outline-none focus:border-[#d4af37] cursor-pointer">
            <option value="de">DE</option>
            <option value="en">EN</option>
            <option value="fr">FR</option>
            <option value="pt">PT</option>
        </select>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const currentLang = localStorage.getItem('cqr_lang') || 'de';
            const select = document.getElementById('lang-select');
            if (select) select.value = currentLang;
        });
    </script>
        
        <button class="mt-12 bg-transparent border border-[#d4af37] text-[#d4af37] px-8 py-3 font-mono hover:bg-[#d4af37] hover:text-black transition-all duration-300" onclick="window.location.href='bantaba.html'" data-i18n="btn_back">
            ← Zurück zum Eingang
        </button>
    </div>

    <!-- Scripts -->
    <script src="../js/translations.js"></script>
    <script>
        // Burger Menu Logic
        const burgerBtn = document.getElementById('burger-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const spans = burgerBtn.querySelectorAll('span');
        let menuOpen = false;

        burgerBtn.addEventListener('click', () => {
            menuOpen = !menuOpen;
            if(menuOpen) {
                mobileMenu.classList.remove('opacity-0', 'pointer-events-none');
                spans[0].style.transform = 'translateY(8px) rotate(45deg)';
                spans[1].style.opacity = '0';
                spans[2].style.transform = 'translateY(-8px) rotate(-45deg)';
            } else {
                mobileMenu.classList.add('opacity-0', 'pointer-events-none');
                spans[0].style.transform = 'none';
                spans[1].style.opacity = '1';
                spans[2].style.transform = 'none';
            }
        });

        // Initialize Translations
        applyTranslations();
    </script>
</body>
</html>
