<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D Bibliothec | Circle D Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        body {
            background-color: #050303;
            color: #d4af37;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            perspective: 2000px;
        }
        
        /* HOGWARTS ATMOSPHERE */
        .library-bg {
            position: fixed; inset: 0; z-index: -1;
            background: linear-gradient(to bottom, rgba(5,3,3,0.8), rgba(5,3,3,0.95)), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7260b66?q=80&w=2790&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        /* FLOATING BOOKS */
        .floating-book {
            position: absolute;
            width: 60px; height: 80px;
            background: #2a2a2a;
            border-left: 4px solid #d4af37;
            border-radius: 2px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.5s;
            transform-style: preserve-3d;
        }
        .floating-book:hover {
            transform: scale(1.2) rotateY(-20deg);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            z-index: 100;
        }
        .floating-book::before {
            content: ''; position: absolute; top: 10px; left: 10px; right: 5px; height: 2px; background: rgba(255,255,255,0.1);
        }
        
        /* MAGIC DUST */
        .particle {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.3;
            pointer-events: none;
            animation: floatUp 10s linear infinite;
        }
        @keyframes floatUp {
            from { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.5; }
            to { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        /* BOOK OPEN ANIMATION OVERLAY */
        #book-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 1s;
        }
        #book-overlay.active { opacity: 1; pointer-events: all; }
        
        .magic-book {
            width: 300px; height: 400px;
            background: #d4af37;
            position: relative;
            transform-style: preserve-3d;
            animation: bookOpen 2s forwards;
            display: none;
        }
        #book-overlay.active .magic-book { display: block; }
        
        @keyframes bookOpen {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(-180deg) scale(1.5); }
        }

        /* GLOSSARY STYLES (Moved from Agent for reliability) */
        #glossary-book {
            position: fixed; inset: 0; z-index: 2500;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none; opacity: 0; transition: opacity 0.5s;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
        }
        #glossary-book.active { opacity: 1; pointer-events: all; }
        
        .glossary-content {
            width: 800px; height: 600px;
            background: #fdfbf7;
            background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png');
            border-radius: 10px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.2), 0 0 50px rgba(212,175,55,0.3);
            display: flex;
            perspective: 1000px;
            transform: scale(0.8); transition: transform 0.5s;
        }
        #glossary-book.active .glossary-content { transform: scale(1); }
        
        .glossary-page {
            flex: 1; padding: 40px; overflow-y: auto;
            border-right: 1px solid rgba(0,0,0,0.1);
        }
        .glossary-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px; border-bottom: 1px dashed rgba(0,0,0,0.1);
            cursor: pointer; transition: background 0.2s;
            font-family: 'Cinzel', serif; color: #2c1810;
        }
        .glossary-item:hover { background: rgba(212,175,55,0.1); padding-left: 15px; }
        .type-icon { opacity: 0.5; font-size: 0.8em; }
    </style>
</head>
<body class="h-screen w-screen">

    <div class="library-bg"></div>
    <div id="particle-container"></div>

    <!-- NAV -->
    <nav class="fixed top-0 left-0 w-full p-6 z-50 flex justify-between">
        <a href="palast_library.html" class="text-white/50 hover:text-white flex items-center gap-2">
            <span class="material-symbols-outlined">arrow_back</span>
            <span class="font-cinzel text-xs uppercase tracking-widest">Leave Bibliothec</span>
        </a>
    </nav>

    <!-- CONTENT -->
    <main class="relative w-full h-full flex flex-col items-center justify-center pointer-events-none">
        <h1 class="text-6xl md:text-8xl font-cinzel text-[#d4af37] drop-shadow-[0_0_15px_rgba(212,175,55,0.5)] mb-4 animate-pulse">D Bibliothec</h1>
        <p class="text-white/60 font-serif italic text-xl">"The books choose their readers..."</p>
        
        <div class="mt-8 pointer-events-auto bg-black/50 p-4 border border-[#d4af37]/30 rounded backdrop-blur">
            <span class="text-[#d4af37] text-xs uppercase tracking-widest block mb-2 text-center">Interactive Archive</span>
            <p class="text-sm text-white/80">Hover over the floating tomes. Find the <span class="text-[#d4af37] font-bold">Chronicle of Flow</span>.</p>
        </div>
    </main>

    <!-- SEARCH BAR -->
    <div class="fixed bottom-10 left-1/2 transform -translate-x-1/2 w-full max-w-md z-50 pointer-events-auto">
        <div class="relative group">
            <input type="text" id="library-search" 
                class="w-full bg-black/80 border-2 border-[#d4af37]/50 text-[#d4af37] px-6 py-4 rounded-full font-cinzel text-lg focus:outline-none focus:border-[#d4af37] focus:shadow-[0_0_30px_rgba(212,175,55,0.3)] transition-all placeholder-[#d4af37]/30 text-center"
                placeholder="Touch to Open Index..."
                onfocus="if(window.LibraryAgent) window.LibraryAgent.openGlossary()"
                onkeyup="handleSearch(this.value)">
            <span class="material-symbols-outlined absolute right-6 top-1/2 transform -translate-y-1/2 text-[#d4af37] opacity-50">search</span>
        </div>
    </div>

    <!-- GLOSSARY BOOK (New) -->
    <div id="glossary-book">
        <div class="glossary-content">
            <div class="glossary-page">
                <h2 class="text-3xl font-cinzel text-[#2c1810] mb-4 border-b border-[#2c1810]/20 pb-2">The Index</h2>
                <div id="glossary-list" class="space-y-2">
                    <!-- Injected by Agent -->
                </div>
            </div>
            <div class="glossary-page bg-[#fdfbf7]/50 flex items-center justify-center">
                <div class="text-center opacity-50">
                    <span class="material-symbols-outlined text-6xl mb-4">auto_stories</span>
                    <p class="font-serif italic">"Select a Key to reveal the Truth."</p>
                    <button id="close-index-btn" class="mt-8 px-4 py-2 border border-[#2c1810]/20 rounded hover:bg-[#2c1810] hover:text-white transition-colors cursor-pointer relative z-50">Close Index</button>
                </div>
            </div>
        </div>
    </div>

    <!-- BOOK SHELF CONTAINER -->
    <div id="books-container" class="absolute inset-0 pointer-events-none"></div>

    <!-- PERGAMENT READER (Overlay) -->
    <div id="pergament-reader" class="fixed inset-0 z-[3000] flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-500 backdrop-blur-sm bg-black/60">
        <div class="relative w-[90vw] max-w-3xl h-[80vh] bg-[#fdfbf7] text-[#2c1810] shadow-[0_0_100px_rgba(0,0,0,0.8)] transform scale-90 transition-transform duration-500 overflow-hidden rounded-lg pointer-events-auto book-open-anim">
            
            <!-- Texture Overlay -->
            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/aged-paper.png')] pointer-events-none opacity-50"></div>
            
            <!-- Close Btn -->
            <button id="close-reader-btn" class="absolute top-4 right-4 z-50 w-10 h-10 border-2 border-[#2c1810]/20 rounded-full flex items-center justify-center hover:bg-[#2c1810] hover:text-[#fdfbf7] transition-all cursor-pointer bg-[#fdfbf7]">
                <span class="material-symbols-outlined">close</span>
            </button>

            <!-- Content Area -->
            <div id="reader-content" class="relative z-10 p-12 h-full overflow-y-auto custom-scrollbar font-serif leading-relaxed text-lg">
                <!-- Injected By Agent -->
            </div>

        </div>
    </div>
    
    <style>
        /* Reader Styles */
        #pergament-reader.active { opacity: 1; pointer-events: all; }
        #pergament-reader.active > div { transform: scale(1); }
        
        .pergament-header { border-bottom: 2px solid rgba(44, 24, 16, 0.1); padding-bottom: 20px; margin-bottom: 30px; text-align: center; }
        .pergament-header h1 { font-family: 'Cinzel', serif; font-size: 3rem; margin: 10px 0; color: #2c1810; }
        .category-tag { font-family: 'Mono', monospace; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: #8b5e3c; }
        
        .pergament-body h2 { font-size: 1.8rem; margin-top: 2rem; margin-bottom: 1rem; color: #5c3a21; font-family: 'Cinzel', serif; }
        .pergament-body p { margin-bottom: 1.5rem; }
        .pergament-footer { margin-top: 50px; text-align: center; font-size: 0.8rem; opacity: 0.6; font-family: monospace; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 20px; }
    </style>

    <!-- SCRIPT -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
             spawnParticles();
             // Delay spawn to ensure Agent is loaded matches
             setTimeout(spawnBooks, 500);

             // Auto-Reveal Index (Glossary) - 4 Seconds Delay
             setTimeout(() => {
                 let attempts = 0;
                 const waitForAgent = setInterval(() => {
                     attempts++;
                     if(window.LibraryAgent) {
                         console.log("Library Agent Found! Opening Glossary...");
                         
                         // Visual Feedback
                         if(window.Pusher) window.Pusher.showToast("D Bibliothec Online", "The Index Openeth...", "success");
                         
                         window.LibraryAgent.openGlossary();
                         
                         // Fix Close Button Bindings (Both Index and Reader)
                         const closeIndexBtn = document.getElementById('close-index-btn');
                         if(closeIndexBtn) {
                             closeIndexBtn.onclick = () => window.LibraryAgent.closeGlossary();
                             closeIndexBtn.ontouchstart = () => window.LibraryAgent.closeGlossary();
                         }

                         const closeReaderBtn = document.getElementById('close-reader-btn');
                         if(closeReaderBtn) {
                             closeReaderBtn.onclick = () => window.LibraryAgent.closeReader();
                             closeReaderBtn.ontouchstart = () => window.LibraryAgent.closeReader();
                         }

                         // ESC Key Listener
                         document.addEventListener('keydown', (e) => {
                             if(e.key === "Escape") {
                                 console.log("ESC Pressed - Closing Books.");
                                 window.LibraryAgent.closeGlossary();
                                 window.LibraryAgent.closeReader();
                             }
                         });
                         
                         clearInterval(waitForAgent);
                     } else {
                         console.warn(`Waiting for Library Agent... (${attempts})`);
                         if(attempts > 10) {
                             console.error("Library Agent Timeout.");
                             clearInterval(waitForAgent);
                         }
                     }
                 }, 500);
             }, 4000);
        });

        function spawnParticles() {
            const container = document.getElementById('particle-container');
            for(let i=0; i<50; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.width = Math.random() * 4 + 'px';
                p.style.height = p.style.width;
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 5 + 's';
                p.style.animationDuration = (10 + Math.random() * 20) + 's';
                container.appendChild(p);
            }
        }

        function spawnBooks() {
            const container = document.getElementById('books-container');
            container.innerHTML = ''; // Clear existing
            
            // Get Knowledge from Agent or fallback
            const library = window.LibraryAgent ? window.LibraryAgent.knowledgeBase : [];
            const displayCount = Math.max(library.length, 15); // At least 15 books floating

            for(let i=0; i<displayCount; i++) {
                const b = document.createElement('div');
                b.className = 'floating-book pointer-events-auto transition-all duration-500';
                
                // Bind Data if available
                const data = library[i % library.length] || null;
                if(data) {
                    b.dataset.id = data.id;
                    b.dataset.keywords = data.keywords.join(',');
                    b.title = data.title;
                }

                // Random Pos
                const x = (Math.random() * 80) + 10;
                const y = (Math.random() * 60) + 20;
                const z = (Math.random() * 500) - 250;
                const rot = (Math.random() * 40) - 20;

                b.style.left = x + '%';
                b.style.top = y + '%';
                b.style.transform = `translateZ(${z}px) rotateY(${rot}deg)`;
                
                // Color variation
                const hue = Math.floor(Math.random() * 40) + 30; // Golds/Browns
                b.style.backgroundColor = `hsl(${hue}, 40%, 20%)`;

                b.onclick = () => {
                    if(data && window.LibraryAgent) window.LibraryAgent.openBook(data.id);
                    else alert("This tome is sealed.");
                }
                
                // Float Animation
                b.animate([
                    { transform: `translateZ(${z}px) rotateY(${rot}deg) translateY(0px)` },
                    { transform: `translateZ(${z}px) rotateY(${rot}deg) translateY(-20px)` },
                    { transform: `translateZ(${z}px) rotateY(${rot}deg) translateY(0px)` }
                ], {
                    duration: 3000 + Math.random() * 2000,
                    iterations: Infinity,
                    easing: 'ease-in-out'
                });

                container.appendChild(b);
            }
        }

        function handleSearch(query) {
            if(!window.LibraryAgent) return;
            const matches = window.LibraryAgent.search(query);
            const matchIds = matches.map(m => m.id);
            
            document.querySelectorAll('.floating-book').forEach(b => {
                if(matchIds.includes(b.dataset.id)) {
                    b.style.boxShadow = "0 0 50px #d4af37";
                    b.style.border = "2px solid #d4af37";
                    b.style.zIndex = "100";
                } else {
                    b.style.boxShadow = "none";
                    b.style.border = "none";
                    b.style.zIndex = "auto";
                    b.style.opacity = query ? "0.2" : "1";
                }
            });
            
            // Auto open if only 1 exact match (optional, maybe too intrusive)
        }
    </script>
    
    <!-- AGENTS -->
    <script src="../js/agents/flowee.js"></script>
    <script src="../js/agents/helper.js"></script>
    <script src="../js/agents/pusher.js"></script>
    <script src="../js/agents/library_agent.js"></script>
</body>
</html>
