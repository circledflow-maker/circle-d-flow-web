<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle D Flow - The Zone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const TOTAL_SECONDS = 25 * 60; // 25 minutes
        let remainingSeconds = TOTAL_SECONDS;
        let endTime = null;
        let timerInterval = null;
        
        // Support ?id=... and ?node=...
        const urlParams = new URLSearchParams(window.location.search);
        let areaId = urlParams.get('id') || urlParams.get('node');
        
        let areaData = null;
        let sessionUser = null;
        let inZone = false;
        
        let jamVideos = [];
        let currentVideoIdx = 0;
        let isFirstBlood = false;

        async function init() {
            if (!window.supabaseClient) {
                setTimeout(init, 500);
                return;
            }
            
            const session = await window.supabaseClient.auth.getSession();
            if(session && session.data && session.data.session) {
                sessionUser = session.data.session.user;
            }
            
            if(!areaId) {
                alert("Invalid Area ID.");
                return;
            }

            try {
                const { data, error } = await window.supabaseClient.from('flow_areas').select('*').eq('id', areaId).single();
                if(error) throw error;
                areaData = data;
                document.getElementById('area-name-display').innerText = areaData.name || "Flow Area";
                
                if (data.media_urls && Array.isArray(data.media_urls) && data.media_urls.length > 0) {
                    jamVideos = data.media_urls.map(url => ({
                        url: url,
                        speech: null,
                        author: areaData.creator_name || 'Architect'
                    }));
                }
            } catch(e) {
                console.error(e);
                alert("Flow Area not found.");
                return;
            }

            // Setup Realtime for Ghost Sparks & Chronicles
            window.supabaseClient
                .channel(`public:area:${areaId}`)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'chronicles', filter: `area_id=eq.${areaId}` }, payload => {
                    loadComments();
                })
                .on('broadcast', { event: 'ghost_spark' }, payload => {
                    showGhostSparkUI(payload.payload.emoji);
                })
                .subscribe();

            await loadComments();

            // Geolocation and Anti-Spoofing
            if(navigator.geolocation && areaData.latitude && areaData.longitude) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    handleGPSUpdate(pos.coords.latitude, pos.coords.longitude);
                }, (err) => {
                    console.warn("GPS error:", err);
                    document.getElementById('gps-status').innerText = "GPS: Signal Lost";
                    setupViewBasedOnAuth();
                });
            } else {
                setupViewBasedOnAuth();
            }
            
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('swipe-view').classList.remove('hidden');
        }

        function handleGPSUpdate(lat, lon) {
            // Anti-spoof check
            const lastGps = JSON.parse(localStorage.getItem('cdf_last_gps') || 'null');
            const now = Date.now();
            let isSpoof = false;

            if (lastGps) {
                const distToLast = getDistance(lat, lon, lastGps.lat, lastGps.lon);
                const timeDiffHours = (now - lastGps.time) / (1000 * 60 * 60);
                if (timeDiffHours > 0) {
                    const speedKmh = (distToLast / 1000) / timeDiffHours;
                    if (speedKmh > 1000) { // Impossible speed > 1000 km/h
                        isSpoof = true;
                        console.warn("Spoofing detected: Unrealistic speed jumps.");
                    }
                }
            }
            localStorage.setItem('cdf_last_gps', JSON.stringify({lat, lon, time: now}));

            const dist = getDistance(lat, lon, areaData.latitude, areaData.longitude);
            const gpsStatus = document.getElementById('gps-status');
            
            if(dist <= 150 && !isSpoof) { 
                inZone = true;
                gpsStatus.innerText = "GPS: On-Site Verified";
                gpsStatus.className = "text-xs mb-3 p-1 inline-block rounded font-bold uppercase tracking-widest bg-green-500/20 text-green-500 border border-green-500/50 text-center";
                document.getElementById('forge-lock-overlay').classList.add('hidden');
            } else {
                inZone = false;
                gpsStatus.innerText = `GPS: Off-Site (${Math.round(dist)}m)`;
                document.getElementById('forge-lock-overlay').classList.remove('hidden');
                
                if(isSpoof && sessionUser) {
                    document.getElementById('auth-flowee-text').innerText = "Deine Frequenz flackert. Das System kann deine reale Präsenz nicht verifizieren. Bewege dich normal durch die Matrix.";
                }
            }

            setupViewBasedOnAuth();
        }

        function setupViewBasedOnAuth() {
            if (sessionUser) {
                document.getElementById('guest-card-2').classList.add('hidden');
                document.getElementById('guest-card-3').classList.add('hidden');
                document.getElementById('guest-flowee').classList.add('hidden');
                
                document.getElementById('auth-card-2').classList.remove('hidden');
                document.getElementById('auth-card-3').classList.remove('hidden');
                document.getElementById('auth-flowee').classList.remove('hidden');
                
                if (inZone) {
                    document.getElementById('btn-timer-start').classList.remove('hidden');
                }
            } else {
                document.getElementById('auth-card-2').classList.add('hidden');
                document.getElementById('auth-card-3').classList.add('hidden');
                document.getElementById('auth-flowee').classList.add('hidden');
                
                document.getElementById('guest-card-2').classList.remove('hidden');
                document.getElementById('guest-card-3').classList.remove('hidden');
                document.getElementById('guest-flowee').classList.remove('hidden');
            }
        }

        function loadVideoMedia(url, speechText = null, author = "Unknown") {
            if(!url) return;
            const vidPlayer = document.getElementById('jam-player-vid');
            const iframePlayer = document.getElementById('jam-player-iframe');
            const imgPlayer = document.getElementById('jam-player-img');
            const loader = document.getElementById('vid-loader');
            const speechBubble = document.getElementById('speech-bubble-overlay');
            
            loader.style.display = 'block';
            vidPlayer.classList.add('hidden');
            iframePlayer.classList.add('hidden');
            imgPlayer.classList.add('hidden');
            vidPlayer.pause();
            iframePlayer.src = '';
            imgPlayer.src = '';
            
            document.getElementById('chronicle-author').innerText = `By ${author}`;
            
            if (speechText) {
                speechBubble.innerText = speechText;
                speechBubble.classList.remove('hidden');
            } else {
                speechBubble.classList.add('hidden');
            }
            
            if (url.includes('drive.google.com')) {
                const previewUrl = url.replace(/\/view.*$/, '/preview');
                iframePlayer.src = previewUrl;
                iframePlayer.classList.remove('hidden');
            } else if (url.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
                imgPlayer.src = url;
                imgPlayer.classList.remove('hidden');
            } else {
                vidPlayer.src = url;
                vidPlayer.classList.remove('hidden');
                vidPlayer.play().catch(e => console.log('Autoplay prevented:', e));
            }
        }

        function playNextVideo(dir) {
            if(!jamVideos || jamVideos.length === 0) return;
            currentVideoIdx = (currentVideoIdx + dir + jamVideos.length) % jamVideos.length;
            const media = jamVideos[currentVideoIdx];
            loadVideoMedia(media.url, media.speech, media.author);
        }

        async function loadComments() {
            try {
                const { data, error } = await window.supabaseClient.from('chronicles').select('*').eq('area_id', areaId).order('created_at', {ascending: false});
                
                if(error || !data || data.length === 0) {
                    isFirstBlood = true;
                    // Try showing base videos if available
                    if (jamVideos.length > 0) {
                        document.getElementById('no-media-fallback').classList.add('hidden');
                        loadVideoMedia(jamVideos[0].url, jamVideos[0].speech, jamVideos[0].author);
                    }
                    return;
                }
                
                isFirstBlood = false;
                
                // Map chronicles to media array
                const userMedia = data.filter(c => c.media_url).map(c => ({
                    url: c.media_url,
                    speech: c.content,
                    author: c.user_name
                }));
                
                let baseVideos = [];
                if (areaData && areaData.media_urls) {
                    baseVideos = areaData.media_urls.map(url => ({
                        url: url,
                        speech: null,
                        author: areaData.creator_name || 'Architect'
                    }));
                }
                
                jamVideos = [...userMedia, ...baseVideos];
                
                if (jamVideos.length > 0) {
                    document.getElementById('no-media-fallback').classList.add('hidden');
                    loadVideoMedia(jamVideos[0].url, jamVideos[0].speech, jamVideos[0].author);
                }
            } catch(e) { console.error(e); }
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180; const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180; const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function switchToTimer() {
            document.getElementById('swipe-view').classList.add('hidden');
            document.getElementById('timer-view').classList.remove('hidden');
            startTimer();
        }

        function startTimer() {
            if(timerInterval) return;
            endTime = Date.now() + (TOTAL_SECONDS * 1000);
            updateDisplay();
            timerInterval = setInterval(() => {
                remainingSeconds = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
                updateDisplay();
                if(remainingSeconds <= 0) {
                    completeFlow();
                }
            }, 1000);
        }
        
        function updateDisplay() {
            const m = Math.floor(remainingSeconds / 60);
            const s = remainingSeconds % 60;
            document.getElementById('timer-display').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        // --- GHOST SPARK LOGIC (Guest) ---
        function dropGhostSpark(emoji) {
            showGhostSparkUI(emoji);
            
            if(window.supabaseClient) {
                window.supabaseClient.channel(`public:area:${areaId}`).send({
                    type: 'broadcast',
                    event: 'ghost_spark',
                    payload: { emoji: emoji }
                }).catch(e => console.log('Broadcast error:', e));
            }
        }

        function showGhostSparkUI(emoji) {
            const playerContainer = document.getElementById('manga-player-container');
            const spark = document.createElement('div');
            spark.className = 'ghost-spark';
            spark.innerText = emoji;
            playerContainer.appendChild(spark);
            setTimeout(() => spark.remove(), 2000);
        }

        // --- MANGA CHRONICLE FORGE LOGIC (Auth) ---
        function previewForgeMedia(event) {
            const file = event.target.files[0];
            if(!file) return;
            
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.getElementById('forge-preview');
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                    document.getElementById('forge-placeholder').classList.add('hidden');
                    document.getElementById('forge-watermark').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        async function manifestPanel() {
            const fileInput = document.getElementById('forge-media');
            const speechInput = document.getElementById('forge-speech');
            const file = fileInput.files[0];
            const text = speechInput.value.trim();
            
            if(!file) return alert("You must upload an image to forge a panel.");
            if(file.size > 5 * 1024 * 1024) return alert("File is too large. Maximum size is 5MB.");

            document.getElementById('swipe-view').scrollBy({left: window.innerWidth, behavior: 'smooth'});
            document.getElementById('auth-card-3').querySelector('#manifest-loader').classList.remove('hidden');
            document.getElementById('auth-card-3').querySelector('#manifest-success').classList.add('hidden');

            try {
                const ext = file.name.split('.').pop();
                const sanitizedName = file.name.replace(/\s+/g, '_').replace(/[^a-zA-Z0-9.\-_]/g, '');
                const fileName = `${Date.now()}_${sanitizedName}`;
                
                const { data: uploadData, error: uploadError } = await window.supabaseClient
                    .storage
                    .from('flow_media')
                    .upload(`chronicles/${fileName}`, file, { cacheControl: '3600', upsert: false });
                    
                if (uploadError) throw uploadError;
                
                const { data: publicData } = window.supabaseClient.storage.from('flow_media').getPublicUrl(`chronicles/${fileName}`);
                const uploadedUrl = publicData.publicUrl;

                const userName = localStorage.getItem('cdf_user_username') || "Architect";
                const { error } = await window.supabaseClient.from('chronicles').insert([{
                    area_id: areaId,
                    user_id: sessionUser.id,
                    user_name: userName,
                    content: text,
                    media_url: uploadedUrl
                }]);
                if (error) throw error;
                
                const rpReward = isFirstBlood ? 100 : 30;
                document.getElementById('rp-amount').innerText = rpReward;
                if(isFirstBlood) document.getElementById('rp-desc').innerText = "FIRST BLOOD BONUS! Pionier der Matrix.";
                
                const { data: profile } = await window.supabaseClient.from('profiles').select('exp, karma').eq('id', sessionUser.id).single();
                if(profile) {
                    await window.supabaseClient.from('profiles').update({ 
                        exp: profile.exp + rpReward,
                    }).eq('id', sessionUser.id);
                }

                document.getElementById('manifest-loader').classList.add('hidden');
                document.getElementById('manifest-success').classList.remove('hidden');
                
                fileInput.value = '';
                speechInput.value = '';
                document.getElementById('forge-preview').classList.add('hidden');
                document.getElementById('forge-placeholder').classList.remove('hidden');
                
            } catch(e) {
                console.error("Failed to post", e);
                alert("Failed to post chronicle. " + e.message);
                document.getElementById('swipe-view').scrollBy({left: -window.innerWidth, behavior: 'smooth'});
            }
        }
        
        async function completeFlow() {
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('timer-view').classList.add('hidden');
            document.getElementById('success-view').classList.remove('hidden');
            
            if(!inZone) {
                document.getElementById('reward-text').innerText = "Flow complete, but you were outside the zone. No points awarded.";
                return;
            }

            document.getElementById('reward-text').innerText = "You have earned 100 XP and 10 Karma.";

            localStorage.setItem('flowee_reward_pending', '100');
            localStorage.setItem('flowee_reward_emblem', 'true');
            
            try {
                await window.supabaseClient.rpc('increment_scan_count', { area_id: areaId });
                if(sessionUser) {
                    const { data: profile } = await window.supabaseClient.from('profiles').select('exp, karma').eq('id', sessionUser.id).single();
                    if(profile) {
                        await window.supabaseClient.from('profiles').update({ exp: profile.exp + 100, karma: profile.karma + 10 }).eq('id', sessionUser.id);
                    }
                }
            } catch(e) { console.error("Reward error", e); }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
