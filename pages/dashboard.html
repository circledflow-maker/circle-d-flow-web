<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captain's Quarters | Circle D Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root {
            --haki-gold: #d4af37;
            --benin-bronze: #cd7f32;
            --obsidian: #0a0a0a;
        }
        body {
            background-color: var(--obsidian);
            color: #e0e0e0;
            font-family: 'Space Mono', monospace;
            background-image: url('../assets/images/map_texture_dark.png');
            background-blend-mode: overlay;
        }
        .font-cinzel { font-family: 'Cinzel', serif; }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--haki-gold); border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #b08d2b; }

        @keyframes bounce-in {
            0% { opacity: 0; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-bounce-in { animation: bounce-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body class="pt-24 min-h-screen overflow-x-hidden">

    <main class="relative z-10 w-full flex flex-col items-center">
        
        <!-- SECTION 1: THE FLOW COMPASS (Mandala Navigation) -->
        <section class="w-full min-h-[80vh] py-12 flex items-center justify-center relative perspective-1000 overflow-visible">
            
            <div class="mandala-container">
                <!-- AGENT INJECTS ORRERY HERE -->
            </div>

        </section>

    </main>

    <!-- AGENT MESH -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/agents/supabase_client.js?v=3.1" defer></script>
    <script src="../js/agents/agent.js?v=3.1" defer></script>
    <script src="../js/agents/visual_eye.js?v=3.1" defer></script>
    <script src="../js/agents/helper.js?v=3.1" defer></script>
    <script src="../js/agents/bridge_pusher.js?v=3.1" defer></script>
    <script src="../js/agents/global_ticker.js?v=3.1" defer></script>
    <script src="../js/agents/network_hub.js?v=3.1" defer></script>
    <script src="../js/agents/flow_compass.js?v=3.1" defer></script> <!-- CRITICAL: Injects Planets -->
    <script src="../js/agents/imperial_hud.js?v=3.1" defer></script>
    <script src="../js/agents/sound_engineer.js?v=3.1" defer></script> <!-- ADDED: Fix missing sound triggers -->
    <script src="../js/agents/quest_engine.js?v=3.1" defer></script>
    <script src="../js/agents/flowee.js?v=3.1" defer></script>
    <script src="../js/agents/pusher.js?v=3.1" defer></script>
    
    <!-- NEW AGENTS -->
    <script src="../js/agents/brain.js" defer></script>
    <script src="../js/agents/master-brain.js" defer></script>
    <script src="../js/agents/sentinel.js" defer></script>
    <script src="../js/agents/captains_log.js" defer></script>
    <script src="../js/agents/onboarding.js" defer></script>

</body>
</html>
