<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild Hut | Grand Bazaar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../css/styles.css">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config/supabase_config.js"></script>

    <style>
        body {
            background-color: #120818;
            color: #FDFBF7;
            overflow-x: hidden;
            background: #000 url('../benin_bg.png') no-repeat center center fixed;
            background-size: cover;
        }

        /* Dark overlay for inside the hut */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center top, rgba(90, 42, 132, 0.4) 0%, rgba(18, 8, 24, 0.95) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .hut-container {
            position: relative;
            z-index: 10;
            padding-top: 80px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .vendor-counter {
            background: linear-gradient(180deg, rgba(30,15,12,0.9) 0%, rgba(10,5,4,0.95) 100%);
            border-top: 4px solid #FFAE42;
            border-radius: 12px 12px 0 0;
            width: 90%;
            max-width: 1000px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
            margin-top: auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }

        .avatar-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,174,66,0.2);
        }

        .vendor-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #FFAE42;
            object-fit: cover;
            background: #333;
        }

        .item-card {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,174,66,0.3);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .item-card:hover {
            transform: translateY(-5px);
            border-color: #FFAE42;
            box-shadow: 0 5px 15px rgba(255,174,66,0.2);
        }

        .item-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-bottom: 1px solid rgba(255,174,66,0.3);
        }

        @media (max-width: 768px) {
            .avatar-container {
                flex-direction: column;
                text-align: center;
            }
            .vendor-counter {
                width: 100%;
                border-radius: 20px 20px 0 0;
            }
        }
    </style>
</head>
<body>

    <!-- NAV -->
    <header class="fixed top-0 w-full z-[100] h-16 flex items-center justify-between px-4 bg-black/90 border-b border-[#FFAE42]/20 backdrop-blur-md">
        <div class="flex items-center gap-2">
            <a href="marketplace.html" class="flex items-center gap-1 text-white/70 hover:text-[#FFAE42] transition-colors">
                <span class="material-symbols-outlined text-lg">arrow_back</span>
                <span class="text-[9px] font-bold uppercase tracking-tighter">Bazaar</span>
            </a>
        </div>
        <div class="absolute left-1/2 -translate-x-1/2 items-center justify-center pointer-events-none">
            <h1 id="guild-title" class="font-cinzel font-bold text-sm lg:text-lg tracking-[0.2em] lg:tracking-[0.4em] text-[#FFAE42] m-0 text-center whitespace-nowrap uppercase">Guild Hut</h1>
        </div>
    </header>

    <div class="hut-container">
        
        <!-- Vendor Counter Area -->
        <div class="vendor-counter">
            
            <div class="avatar-container">
                <img id="vendor-img" src="../Assets/images/logo.png" class="vendor-avatar" alt="Vendor" />
                <div class="flex-1">
                    <h2 id="vendor-name" class="text-xl font-cinzel text-[#FFAE42] mb-1">Guild Master</h2>
                    <p id="vendor-greeting" class="text-sm text-white/80 italic font-serif leading-relaxed">"Welcome, traveler. Step up to the counter and behold our finest wares."</p>
                </div>
            </div>

            <!-- Items Grid -->
            <h3 class="text-xs font-bold uppercase tracking-widest text-[#5A2A84] mb-4">Available Items</h3>
            
            <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <div class="col-span-full text-center text-white/50 text-sm py-10">
                    Inspecting wares...
                </div>
            </div>

        </div>

    </div>

    <script>
        // Guild Configuration
        const guilds = {
            'arts': { title: 'Guild of Arts', name: 'Master Artisan', img: 'https://api.dicebear.com/7.x/bottts/svg?seed=arts&backgroundColor=FFAE42', greeting: '"Welcome, seeker of beauty. The Guild of Arts offers creations that transcend the physical realm."' },
            'skills': { title: 'Guild of Skills', name: 'The Strategist', img: 'https://api.dicebear.com/7.x/bottts/svg?seed=skills&backgroundColor=5A2A84', greeting: '"Knowledge is the ultimate currency. Examine our codices and modules."' },
            'sounds': { title: 'Guild of Sounds', name: 'Beatweaver', img: 'https://api.dicebear.com/7.x/bottts/svg?seed=sounds&backgroundColor=000000', greeting: '"Feel the rhythm of the Bazaar. Our auditory artifacts will elevate your frequency."' },
            'healing': { title: 'Guild of Healing', name: 'The Alchemist', img: 'https://api.dicebear.com/7.x/bottts/svg?seed=healing&backgroundColor=228B22', greeting: '"Restore your spirit and vessel. Choose wisely from our remedies."' },
            'products': { title: 'Guild of Products', name: 'The Merchant', img: 'https://api.dicebear.com/7.x/bottts/svg?seed=products&backgroundColor=8B4513', greeting: '"Physical wares for a digital empire. Top tier quality guaranteed."' },
            'services': { title: 'Guild of Services', name: 'The Operator', img: 'https://api.dicebear.com/7.x/bottts/svg?seed=services&backgroundColor=4682B4', greeting: '"Time and labor exchanged for value. How may we serve your operation?"' }
        };

        // Get guild from URL
        const urlParams = new URLSearchParams(window.location.search);
        let currentGuild = urlParams.get('guild') || 'products';
        if (!guilds[currentGuild]) currentGuild = 'products'; // Fallback
        
        const gData = guilds[currentGuild];

        document.addEventListener('DOMContentLoaded', async () => {
            // Set UI
            document.getElementById('guild-title').textContent = gData.title;
            document.getElementById('vendor-name').textContent = gData.name;
            document.getElementById('vendor-greeting').textContent = gData.greeting;
            document.getElementById('vendor-img').src = gData.img;

            await loadGuildItems();
        });

        async function loadGuildItems() {
            if (!window.supabaseClient) {
                document.getElementById('items-grid').innerHTML = '<div class="col-span-full text-center text-red-500 py-10">System Error: Supabase client not initialized.</div>';
                return;
            }

            try {
                // Fetch items for this specific guild category
                const { data, error } = await window.supabaseClient
                    .from('market_items_with_vendor')
                    .select('*')
                    .eq('category', currentGuild)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const grid = document.getElementById('items-grid');
                grid.innerHTML = '';

                if (!data || data.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center text-white/50 text-sm py-10">No items available in the ${gData.title} at this time.</div>`;
                    return;
                }

                data.forEach(item => {
                    // Availability Logic
                    const isAvailable = (item.stock_count > 0 || item.stock_count === null);
                    const availabilityBadge = isAvailable 
                        ? `<span class="bg-green-500/20 text-green-400 text-[10px] px-2 py-0.5 rounded border border-green-500/50">Available${item.stock_count ? ' (' + item.stock_count + ')' : ''}</span>`
                        : `<span class="bg-red-500/20 text-red-400 text-[10px] px-2 py-0.5 rounded border border-red-500/50">Out of Stock</span>`;

                    let priceHtml = '';
                    if (item.price_fc) priceHtml += `<span class="text-[#FFAE42] text-xs font-bold">${item.price_fc} FC</span>`;
                    if (item.price_fc && item.price_eur) priceHtml += `<span class="text-white/30 text-xs mx-1">|</span>`;
                    if (item.price_eur) priceHtml += `<span class="text-white text-xs font-bold">${item.price_eur} €</span>`;

                    const itemHtml = `
                        <div class="item-card relative ${!isAvailable ? 'opacity-60 grayscale' : ''}">
                            <img src="${item.media_url || '../Assets/images/logo.png'}" class="item-image" alt="${item.title}" onerror="this.src='../Assets/images/logo.png'">
                            <div class="p-4 flex flex-col flex-1">
                                <div class="flex justify-between items-start mb-2">
                                    <h4 class="font-cinzel text-[#FFAE42] text-sm font-bold line-clamp-1">${item.title}</h4>
                                </div>
                                <p class="text-[10px] text-white/70 line-clamp-2 mb-3 flex-1">${item.description || 'No description provided.'}</p>
                                
                                <div class="flex items-center gap-2 mb-3">
                                    ${availabilityBadge}
                                </div>

                                <div class="flex items-center justify-between mt-auto">
                                    <div class="flex flex-col">
                                        <span class="text-[8px] text-[#5A2A84] font-bold uppercase mb-0.5">Vendor</span>
                                        <div class="flex items-center gap-1 text-white/90 text-xs">
                                            <span class="material-symbols-outlined text-[10px]">person</span>
                                            ${item.vendor_username || 'Unknown'}
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        ${priceHtml}
                                    </div>
                                </div>
                                ${isAvailable ? `
                                <button onclick="alert('Trade function coming soon!')" class="w-full mt-3 bg-[#FFAE42]/10 border border-[#FFAE42] text-[#FFAE42] py-1.5 rounded text-xs font-bold uppercase hover:bg-[#FFAE42] hover:text-black transition-colors">
                                    Trade
                                </button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                    grid.insertAdjacentHTML('beforeend', itemHtml);
                });

            } catch (err) {
                console.error("Error loading guild items:", err);
                document.getElementById('items-grid').innerHTML = `<div class="col-span-full text-center text-red-500 py-10">Error loading items: ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
