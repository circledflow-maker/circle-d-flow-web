<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Synchronization Matrix | Circle D Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600&family=Space+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css">
    
    <!-- Supabase integration -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/api_config.js"></script>
    <script>
        window.supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);
    </script>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        tao: {
                            earth: '#2E3B32',     
                            wood: '#5C4033',      
                            fire: '#D47E3D',      
                            water: '#2C4957',     
                            metal: '#B0C4DE',     
                            void: '#050505'       
                        }
                    },
                    fontFamily: {
                        "display": ["Cinzel", "serif"],
                        "body": ["Plus Jakarta Sans", "sans-serif"],
                        "mono": ["Space Mono", "monospace"]
                    }
                }
            }
        }
    </script>
    <style>
        body { opacity: 0; animation: fadeIn 1.2s ease-in-out forwards; background-color: var(--color-tao-void); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .nature-border {
            border: 1px solid rgba(138, 154, 91, 0.2);
            background: linear-gradient(135deg, rgba(82, 110, 72, 0.05) 0%, rgba(11, 15, 13, 0.8) 100%);
            backdrop-filter: blur(15px);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day-cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            padding: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .day-cell:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.4);
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .day-cell.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.15);
            box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.2);
        }

        .has-event {
            position: relative;
        }
        .has-event::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background-color: #d4af37;
            border-radius: 50%;
            box-shadow: 0 0 5px #d4af37;
        }
        
        .sync-pulse {
            animation: syncPulse 2s infinite alternate;
        }
        @keyframes syncPulse {
            0% { box-shadow: 0 0 10px rgba(59,130,246,0.2); border-color: rgba(59,130,246,0.3); }
            100% { box-shadow: 0 0 25px rgba(59,130,246,0.6); border-color: rgba(59,130,246,0.8); }
        }
    </style>
</head>
<body class="bg-tao-void text-white min-h-screen font-body overflow-x-hidden relative">

    <!-- Atmospheric Background -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-1/4 right-0 w-[40vw] h-[40vw] bg-blue-900/10 rounded-full blur-[100px] transform translate-x-1/4"></div>
        <div class="absolute bottom-0 left-0 w-[50vw] h-[50vw] bg-tao-earth/10 rounded-full blur-[120px] transform -translate-x-1/4 translate-y-1/4"></div>
    </div>

    <!-- RETURN BUTTON -->
    <button onclick="window.history.back()" class="absolute top-6 left-6 z-50 flex items-center gap-2 text-white/50 hover:text-white transition-colors bg-black/40 px-4 py-2 rounded-full border border-white/10 hover:border-white/30 text-sm font-mono tracking-wide">
        <span class="material-symbols-outlined text-sm">arrow_back</span> Return
    </button>

    <!-- MAIN CONTENT -->
    <main class="relative z-10 pt-24 pb-20 px-4 max-w-5xl mx-auto flex flex-col gap-10">
        
        <!-- HEADER -->
        <div class="text-center relative">
            <h1 class="text-3xl md:text-5xl font-display font-medium text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-white to-tao-earth mb-3 tracking-wide">
                SYNCHRONIZATION MATRIX
            </h1>
            <p class="text-white/50 font-body text-sm md:text-base tracking-widest max-w-xl mx-auto italic">
                "Time is not measured by clocks, but by moments of Flow."
            </p>
        </div>

        <!-- CALENDAR DASHBOARD -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- LEFT PANEL: INTEGRATION & EVENTS -->
            <div class="lg:col-span-1 flex flex-col gap-6">
                <!-- Sync Card -->
                <div class="nature-border rounded-2xl p-6 text-center">
                    <div class="w-16 h-16 mx-auto rounded-full bg-blue-500/10 border border-blue-500/30 flex items-center justify-center mb-4 sync-pulse">
                        <span class="material-symbols-outlined text-3xl text-blue-400">sync</span>
                    </div>
                    <h3 class="text-lg font-display text-white mb-2">Google Calendar</h3>
                    <p class="text-xs text-white/50 mb-6">Connect your personal timeline with the Circle D Flow network.</p>
                    <button onclick="syncCalendar()" class="w-full bg-blue-600/20 hover:bg-blue-600/40 border border-blue-500/50 text-blue-400 py-3 rounded-lg font-bold tracking-[0.2em] uppercase transition-all shadow-[0_0_15px_rgba(59,130,246,0.2)]">
                        Initialize Sync
                    </button>
                    <p id="sync-status" class="text-[10px] text-white/30 mt-3 font-mono hidden">Authenticating via OAuth...</p>
                </div>

                <!-- Upcoming Flow Events -->
                <div class="nature-border rounded-xl p-5">
                    <h3 class="text-sm font-bold text-[#d4af37] mb-4 flex items-center gap-2">
                        <span class="material-symbols-outlined text-[16px]">upcoming</span> Upcoming Flow
                    </h3>
                    
                    <div id="calendar-sidebar-events" class="flex flex-col gap-3">
                        <div class="text-xs text-white/40 italic">Loading events from matrix...</div>
                    </div>
                </div>
            </div>

            <!-- RIGHT PANEL: CALENDAR GRID -->
            <div class="lg:col-span-2 nature-border rounded-3xl p-8 relative overflow-hidden flex flex-col">
                <div class="flex justify-between items-center mb-8">
                    <h2 id="calendar-month-title" class="text-xl font-display text-white tracking-wide">JUNE 2026</h2>
                    <div class="flex gap-2">
                        <button onclick="changeMonth(-1)" class="w-8 h-8 rounded bg-white/5 hover:bg-white/10 flex items-center justify-center border border-white/10 transition-colors">
                            <span class="material-symbols-outlined text-sm">chevron_left</span>
                        </button>
                        <button onclick="changeMonth(1)" class="w-8 h-8 rounded bg-white/5 hover:bg-white/10 flex items-center justify-center border border-white/10 transition-colors">
                            <span class="material-symbols-outlined text-sm">chevron_right</span>
                        </button>
                    </div>
                </div>

                <!-- Grid Header -->
                <div class="grid grid-cols-7 gap-2 mb-2">
                    <div class="text-center text-[10px] text-white/40 font-mono uppercase">Mon</div>
                    <div class="text-center text-[10px] text-white/40 font-mono uppercase">Tue</div>
                    <div class="text-center text-[10px] text-white/40 font-mono uppercase">Wed</div>
                    <div class="text-center text-[10px] text-white/40 font-mono uppercase">Thu</div>
                    <div class="text-center text-[10px] text-white/40 font-mono uppercase">Fri</div>
                    <div class="text-center text-[10px] text-white/40 font-mono uppercase">Sat</div>
                    <div class="text-center text-[10px] text-white/40 font-mono uppercase">Sun</div>
                </div>                <!-- Calendar Grid -->
                <div id="dynamic-calendar-grid" class="calendar-grid flex-1">
                    <!-- JS will populate this -->
                </div>
            </div>
            
        </div>
    </main>

    <script>
        let currentMonthDate = new Date(2026, 5, 1); // Starts at June 2026
        const c4cEventDate = new Date(2026, 5, 27); // June 27, 2026
        
        function changeMonth(delta) {
            currentMonthDate.setMonth(currentMonthDate.getMonth() + delta);
            renderCalendar();
        }

        let calendarEvents = [];

        async function fetchEvents() {
            try {
                const { data, error } = await window.supabaseClient.from('quests').select('*').order('created_at', { ascending: false });
                if (!error && data) {
                    calendarEvents = data;
                }
            } catch (err) {
                console.error("Failed to load events", err);
            }
            renderCalendar();
            renderSidebarEvents();
        }

        function renderSidebarEvents() {
            const sidebar = document.getElementById('calendar-sidebar-events');
            if (calendarEvents.length === 0) {
                sidebar.innerHTML = '<div class="text-xs text-white/40 italic">No events found in the matrix.</div>';
                return;
            }
            
            sidebar.innerHTML = '';
            calendarEvents.slice(0, 3).forEach(event => { // Show up to 3 upcoming
                // Parsing logic (event.event_date is a string like "2026-06-27" from input[type="date"] usually)
                let dText = 'TBA';
                if (event.event_date && event.event_date !== 'TBA') {
                    try {
                        const d = new Date(event.event_date);
                        if (!isNaN(d.getTime())) {
                            dText = `${d.getDate().toString().padStart(2, '0')}.${(d.getMonth() + 1).toString().padStart(2, '0')}`;
                        }
                    } catch(e){}
                }
                
                sidebar.innerHTML += `
                    <div class="bg-black/40 border border-white/5 rounded p-3 cursor-pointer hover:border-white/20 transition-all" onclick="localStorage.setItem('currentEventId', '${event.id}'); window.location.href='event_sanctuary.html'">
                        <div class="flex justify-between items-start">
                            <h4 class="text-xs font-bold text-white">${event.title || 'Unknown Quest'}</h4>
                            <span class="text-[9px] text-[#d4af37] font-mono border border-[#d4af37]/30 px-1 rounded">${dText}</span>
                        </div>
                        <p class="text-[10px] text-white/40 mt-1">${event.address || 'Unknown Location'}</p>
                    </div>
                `;
            });
        }

        function renderCalendar() {
            const grid = document.getElementById('dynamic-calendar-grid');
            const title = document.getElementById('calendar-month-title');
            grid.innerHTML = '';
            
            // Format title
            const titleFormatter = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' });
            title.innerText = titleFormatter.format(currentMonthDate).toUpperCase();
            
            const year = currentMonthDate.getFullYear();
            const month = currentMonthDate.getMonth();
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // Adjust for Monday start (0=Sun -> 6=Sat)
            let startOffset = firstDay - 1;
            if (startOffset === -1) startOffset = 6;
            
            // Blank days
            for(let i = 0; i < startOffset; i++) {
                grid.innerHTML += `<div class="day-cell opacity-0 pointer-events-none"></div>`;
            }
            
            const dateFormatter = new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

            // Days
            for(let day = 1; day <= daysInMonth; day++) {
                // Find if any event falls on this date
                let activeEvent = null;
                
                for (let evt of calendarEvents) {
                    if (evt.event_date && evt.event_date !== 'TBA') {
                        try {
                            const d = new Date(evt.event_date);
                            if (d.getFullYear() === year && d.getMonth() === month && d.getDate() === day) {
                                activeEvent = evt;
                                break;
                            }
                        } catch(e) {}
                    }
                }
                
                if (activeEvent) {
                    const formattedDate = dateFormatter.format(new Date(year, month, day));
                    grid.innerHTML += `<div class="day-cell active has-event cursor-pointer" title="${activeEvent.title} - ${formattedDate}" onclick="localStorage.setItem('currentEventId', '${activeEvent.id}'); window.location.href='event_sanctuary.html'"><span class="text-xs text-white font-bold">${day}</span></div>`;
                } else {
                    grid.innerHTML += `<div class="day-cell"><span class="text-xs text-white/60">${day}</span></div>`;
                }
            }
        }

        // Initialize Calendar
        document.addEventListener('DOMContentLoaded', () => {
            fetchEvents();
        });

        function syncCalendar() {
            const statusEl = document.getElementById('sync-status');
            statusEl.classList.remove('hidden');
            statusEl.innerText = "Authenticating via OAuth...";
            
            setTimeout(() => {
                statusEl.innerText = "Syncing Events...";
                
                setTimeout(() => {
                    statusEl.innerText = "Calendar Synchronized Successfully!";
                    statusEl.classList.add('text-green-400');
                    statusEl.classList.remove('text-white/30');
                    
                    if(window.FloweeAgent) {
                        window.FloweeAgent.speak("Time parameters aligned. Google Calendar synced.");
                    }
                }, 1500);
            }, 1000);
        }
    </script>
    <script src="../js/agents/flowee.js"></script>
</body>
</html>
