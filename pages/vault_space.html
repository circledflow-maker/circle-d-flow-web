<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Space | The Resonance Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=Homemade+Apple&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { background-color: #0b0c10; color: #c5c6c7; font-family: 'Space Mono', monospace; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-hand { font-family: 'Homemade Apple', cursive; }
        
        /* Map Container */
        .map-parchment {
            background-color: #d2b48c;
            background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png');
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        .map-grid {
            background-image: linear-gradient(#4a3b2a 1px, transparent 1px), linear-gradient(90deg, #4a3b2a 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
        }
        
        /* Pins */
        .pin { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; }
        .pin:hover { transform: scale(1.2) translateY(-10px); z-index: 50; }
        .pin-popover { opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .pin:hover .pin-popover { opacity: 1; pointer-events: auto; }

        /* Pulse Animation */
        .pulse-ring {
            position: absolute;
            width: 100px; height: 100px;
            border: 2px solid #ffd700;
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { width: 0; height: 0; opacity: 1; }
            100% { width: 150px; height: 150px; opacity: 0; }
        }
    </style>
</head>
<body class="overflow-x-hidden min-h-screen bg-[url('../Assets/images/ocean_bg.jpg')] bg-cover bg-fixed">
    <div class="fixed inset-0 bg-black/60 z-0"></div>

    <div class="relative z-10 container mx-auto px-4 py-12">
        <!-- Breadcrumb Navigation -->
        <div class="absolute top-4 left-4 flex items-center gap-2 text-[10px] font-mono text-black/50 uppercase tracking-widest z-50">
            <a href="../pages/dashboard.html" class="hover:text-amber-800 transition-colors flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">anchor</span> Port
            </a>
            <span class="text-black/30">/</span>
            <span class="text-amber-800 font-bold">Resonance Map</span>
        </div>

        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-cinzel text-orange-500 tracking-widest drop-shadow-[0_0_10px_rgba(249,115,22,0.6)]">Kingdom of Hearts</h1>
                <p class="text-sm text-white/60 font-hand">"A diary of resonance. Where the Flow touches the soul."</p>
            </div>
            <div class="flex gap-4">
                <button class="px-6 py-2 border border-orange-500/50 rounded-full text-orange-500 hover:bg-orange-500 hover:text-black transition-colors uppercase text-xs font-bold tracking-widest flex items-center gap-2 shadow-[0_0_15px_rgba(249,115,22,0.3)]" onclick="window.Vault.dropPulse()">
                    <span class="material-symbols-outlined text-lg">edit_note</span> Write Entry
                </button>
            </div>
        </header>

        <!-- The Map -->
        <div class="w-full h-[600px] rounded-xl border-4 border-[#8B4513] map-parchment relative shadow-2xl">
            <div class="absolute inset-0 map-grid pointer-events-none"></div>
            
            <!-- Water Body (Tejo) -->
            <div class="absolute bottom-0 left-0 w-full h-32 bg-blue-900/20 blur-xl"></div>

            <!-- PIN 1: Secret Garden LX -->
            <div class="absolute top-[40%] left-[30%] pin group" onclick="window.location.href='kiss-your-heart.html'">
                <div class="text-4xl filter drop-shadow-lg">🏝️</div>
                <div class="pulse-ring"></div>
                <!-- Popover -->
                <div class="pin-popover absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-48 bg-black/90 border border-amber-500/50 rounded-lg p-3 text-center z-50">
                    <h3 class="text-amber-500 font-bold text-sm">Secret Garden LX</h3>
                    <p class="text-[10px] text-white/70 mt-1">"The Oasis of Mirrors"</p>
                    <div class="mt-2 text-[10px] text-green-400 font-bold">LIVE: Jam Session</div>
                </div>
            </div>

            <!-- PIN 2: Casa Mocambo -->
            <div class="absolute top-[55%] left-[60%] pin group">
                 <div class="text-4xl filter drop-shadow-lg">🥘</div>
                 <!-- Popover -->
                 <div class="pin-popover absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-48 bg-black/90 border border-bronze-400/50 rounded-lg p-3 text-center z-50">
                    <h3 class="text-bronze-400 font-bold text-sm">Casa Mocambo</h3>
                    <p class="text-[10px] text-white/70 mt-1">"African Queen's Kitchen"</p>
                    <button class="mt-2 text-[10px] bg-white/10 hover:bg-white/20 w-full py-1 rounded">View Menu</button>
                </div>
            </div>

            <!-- PIN 3: Chapitô -->
            <div class="absolute top-[25%] left-[50%] pin group">
                <div class="text-4xl filter drop-shadow-lg">🎪</div>
                <!-- Popover -->
                <div class="pin-popover absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-48 bg-black/90 border border-purple-400/50 rounded-lg p-3 text-center z-50">
                   <h3 class="text-purple-400 font-bold text-sm">Chapitô</h3>
                   <p class="text-[10px] text-white/70 mt-1">"The Circus Fortress"</p>
               </div>
           </div>

           <!-- Compass -->
           <div class="absolute bottom-8 right-8 w-24 h-24 border-2 border-black/20 rounded-full flex items-center justify-center pointer-events-none">
               <div class="w-20 h-20 border border-black/10 rounded-full flex items-center justify-center">
                   <span class="font-cinzel text-black/30 text-xs">N</span>
               </div>
               <div class="absolute w-1 h-10 bg-red-800/50 top-2 left-1/2 -translate-x-1/2 origin-bottom transform rotate-45"></div>
           </div>

        </div>

    </div>

    <!-- Inject Placeholder -->
