<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vision Studio | Circle D Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Cinzel:wght@700&family=Andika&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../css/quest-triad.css">
    <link rel="stylesheet" href="../css/mobile-sphere-nav.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/agents/supabase_client.js?v=4.1"></script>
    <script src="../js/data/adinkra_catalog.js?v=1.0"></script>
    <script src="../js/agents/flowee.js?v=3.5"></script>
    <script src="../js/agents/flowee_voice.js?v=1.1"></script>
    <script src="../js/agents/flowee_reward.js?v=1.0"></script>
    <script src="../js/agents/vision_mission_engine.js?v=1.0"></script>
    <script src="../js/agents/quest_engine.js?v=4.6"></script>
    <script src="../js/agents/flowee_vision_tour.js?v=1.0" defer></script>
    <script src="../js/agents/mobile_sphere_nav.js?v=1.0" defer></script>
    <style>
        body { background:#0a0610; color:#fdfbf7; font-family:'Plus Jakarta Sans',sans-serif; padding-bottom:100px; }
        .cinzel { font-family:'Cinzel',serif; }
        .adinkra { font-family:'Andika',sans-serif; }
        .gallery-item { aspect-ratio:1; object-fit:cover; border-radius:8px; border:1px solid rgba(212,175,55,0.2); }
    </style>
</head>
<body class="quest-triad-page">
    <header class="sticky top-0 z-50 bg-black/85 backdrop-blur border-b border-purple-500/30 px-4 py-3 flex items-center justify-between">
        <a href="dashboard.html" class="text-purple-300 text-xs">← Orbit</a>
        <h1 class="cinzel text-purple-300 text-sm tracking-widest">VISION STUDIO</h1>
        <a href="goal_purpose.html" class="text-[10px] text-gold/70">Purpose</a>
    </header>

    <section class="px-4 py-5 border-b border-white/10">
        <div class="flex items-start gap-3">
            <span class="adinkra text-3xl text-[#d4af37]" id="mission-rune">◈</span>
            <div>
                <p class="text-[10px] uppercase tracking-widest text-purple-400 mb-1">Today's Mission</p>
                <h2 class="cinzel text-lg text-white" id="mission-title">Loading…</h2>
                <p class="text-xs text-white/60 mt-2" id="mission-prompt"></p>
                <p class="text-[10px] text-[#d4af37] mt-2" id="mission-reward"></p>
            </div>
        </div>
    </section>

    <section class="px-4 py-4">
        <label class="block w-full border-2 border-dashed border-purple-500/40 rounded-xl p-8 text-center cursor-pointer hover:bg-purple-500/10 transition">
            <span class="material-symbols-outlined text-4xl text-purple-400">add_a_photo</span>
            <p class="text-xs mt-2 text-white/60">Upload photo or video</p>
            <input type="file" id="vision-upload" accept="image/*,video/*" class="hidden">
        </label>
        <input type="text" id="upload-title" placeholder="Title (optional)" class="w-full mt-3 bg-black/50 border border-white/10 rounded px-3 py-2 text-sm">
    </section>

    <section class="px-4 py-4">
        <h3 class="cinzel text-[#d4af37] text-xs tracking-widest mb-3">YOUR ARCHIVE</h3>
        <div id="vision-gallery" class="grid grid-cols-3 gap-2"></div>
    </section>

    <section class="px-4 py-4 border-t border-white/10">
        <h3 class="cinzel text-xs text-white/50 mb-2">COMING SOON</h3>
        <p class="text-[10px] text-white/40">Photo & video contests · best-of-Lisbon submissions · minigame: tag content to Atlas pins.</p>
        <a href="quest_map.html" class="inline-block mt-3 text-[10px] text-cyan-400 border border-cyan-500/40 px-3 py-1.5 rounded-full">Tag on Atlas →</a>
    </section>

    <div id="flowee-agent"></div>
    <nav class="animus-global-nav">
        <button onclick="location.href='quest_map.html'" class="nav-btn"><span class="icon">📍</span><span class="nav-label">MAP</span></button>
        <button onclick="location.href='quest_board.html'" class="nav-btn"><span class="icon">📖</span><span class="nav-label">QUESTS</span></button>
        <button onclick="location.href='hall_of_legends.html'" class="nav-btn"><span class="icon">🏛️</span><span class="nav-label">RANK</span></button>
        <button onclick="window.Flowee?.toggleChat()" class="nav-btn"><span class="icon">💬</span><span class="nav-label">FLOWEE</span></button>
        <button onclick="location.href='dashboard.html'" class="nav-btn exit"><span class="icon">⚡</span><span class="nav-label">ORBIT</span></button>
    </nav>
    <script src="../js/agents/quest_triad.js?v=2.1" defer></script>
    <script>
        async function renderMission() {
            const m = window.VisionMissionEngine.dailyMission();
            document.getElementById('mission-title').textContent = m.title;
            document.getElementById('mission-prompt').textContent = m.prompt;
            document.getElementById('mission-reward').textContent = `+${m.xp} XP · Rune: ${m.rune}`;
            const glyph = window.renderAdinkraGlyph?.(m.rune, 'bronze');
            const el = document.getElementById('mission-rune');
            if (glyph && el) el.innerHTML = glyph;
            else if (el) el.textContent = m.glyph || '◈';
        }
        async function renderGallery() {
            const items = await window.VisionMissionEngine.loadUploads();
            const g = document.getElementById('vision-gallery');
            g.innerHTML = items.length ? '' : '<p class="col-span-3 text-xs text-white/40">No uploads yet — start with today\'s mission.</p>';
            items.forEach((item) => {
                const el = item.type === 'video'
                    ? `<video src="${item.url}" class="gallery-item w-full" muted playsinline></video>`
                    : `<img src="${item.url || item.media_url}" alt="${item.title}" class="gallery-item w-full" loading="lazy">`;
                g.innerHTML += `<div class="relative">${el}</div>`;
            });
        }
        document.getElementById('vision-upload').onchange = async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const title = document.getElementById('upload-title').value;
            await window.VisionMissionEngine.saveUpload(file, title);
            await window.VisionMissionEngine.completeDaily();
            await renderGallery();
            if (window.Flowee) window.Flowee.talk(true, 'Frame secured! Your studio archive grows. Tag it on the Atlas for bonus runes.', 'celebrate');
        };
        document.addEventListener('DOMContentLoaded', async () => {
            await renderMission();
            await renderGallery();
            if (window.Flowee) window.Flowee.renderVessel();
        });
    </script>
</body>
</html>
