    <style>
        body { background-color: #050505; color: white; overflow: hidden; }
        #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .glass-terminal {
            background: rgba(13, 13, 15, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 50px rgba(154, 77, 255, 0.1);
        }
        .prisma-card {
            transform-style: preserve-3d;
            transition: transform 0.6s;

        .prisma-card:hover {
            transform: translateY(-10px) rotateX(10deg);

        /* Scanline effect */
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(154, 77, 255, 0.1) 50%, rgba(0,0,0,0) 100%);

            position: absolute;
            bottom: 100%;
            animation: scanline 10s linear infinite;

<!-- THE PATH: SHADOW TO LIGHT INITIATION RITUAL -->
<body class="h-[100dvh] w-screen flex items-center justify-center relative overflow-hidden bg-black text-white">



    
    <!-- 1. CINEMATIC OVERLAY (Only keeps phase-finish) -->
    <div id="cinematic-overlay" class="absolute inset-0 z-50 flex items-center justify-center pointer-events-none">
        <!-- Phase 5: Conclusion & Redirect -->
        <div id="phase-finish" class="hidden text-center">
             <div class="animate-ping w-24 h-24 bg-mystic-gold rounded-full mx-auto mb-8 blur-xl opacity-50"></div>
             <h2 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-mystic-gold uppercase tracking-[0.5em] mb-4">AWAKENED</h2>
             <p id="assigned-class" class="text-2xl font-serif italic text-white/80 mb-10">...</p>
        </div>
    </div>

    <!-- 2. FLIGHT COMPANION (Pirate Phoenix Flowee) -->
    <div id="flowee-companion" class="fixed bottom-4 right-4 z-[100] transition-all duration-1000 scale-0 flex flex-col md:flex-row items-end justify-end pointer-events-auto w-[calc(100vw-2rem)] md:w-auto">
        <div id="flowee-bubble" class="mb-2 md:mb-4 md:mr-4 w-full max-w-sm bg-black/80 backdrop-blur-xl border border-white/20 text-white p-6 rounded-3xl rounded-br-none shadow-[0_0_30px_rgba(154,77,255,0.2)] text-sm opacity-0 scale-0 transition-all origin-bottom-right flex flex-col gap-4">
            <div id="flowee-text" class="text-lg font-serif italic text-white/90 leading-relaxed">Howdy, Traveler! Ready to find your soul's rhythm?</div>
            <div id="flowee-inputs" class="flex flex-col gap-3 w-full"></div>
        </div>
        <div id="flowee-img" class="w-20 h-20 md:w-32 md:h-32 shrink-0 animate-float" style="cursor: pointer;">
            <svg viewBox="0 0 100 100" width="100%" height="100%" style="filter: drop-shadow(0 0 15px rgba(0, 255, 204, 0.8)); overflow: visible;">
                <!-- Left Wing -->
                <path d="M40,50 C10,20 -10,60 15,75 C25,80 40,65 40,50 Z" fill="#00ffcc" opacity="0.8">
                    <animateTransform attributeName="transform" type="rotate" values="0 40 50; -20 40 50; 0 40 50" dur="0.8s" repeatCount="indefinite"/>
                </path>
                <!-- Right Wing -->
                <path d="M60,50 C90,20 110,60 85,75 C75,80 60,65 60,50 Z" fill="#00ffcc" opacity="0.8">
                    <animateTransform attributeName="transform" type="rotate" values="0 60 50; 20 60 50; 0 60 50" dur="0.8s" repeatCount="indefinite"/>
                </path>
                <!-- Center Body -->
                <circle cx="50" cy="50" r="16" fill="#00ffcc">
                    <animate attributeName="r" values="16;18;16" dur="2s" repeatCount="indefinite"/>
                </circle>
            </svg>
        </div>
    </div>

    <!-- 3. AUDIO CONTEXT (Initiation Beats) -->
    <div id="audio-hint" class="absolute inset-0 z-[110] flex flex-col items-center justify-center text-center w-full px-6 bg-black/80 cursor-pointer" onclick="window.Initiation.startRitual()">
        <span class="material-symbols-outlined text-6xl text-mystic-gold mb-4 animate-bounce">water_drop</span>
        <div class="text-2xl font-serif text-white/90 uppercase tracking-widest">BEGIN THE RITUAL</div>
    </div>

    <!-- Initiation Logic & Engine -->
    <script type="module">
        import InitiationOrbit from '../js/initiation_orbit.js';
        
        class InitiationRitual {
            constructor() {
                this.engine = new InitiationOrbit();
                this.phase = 0;
                this.questions = [
                    {
                        q: "A melody drifts through the roots. What does your soul do first?",
                        options: [
                            { t: "Analyze the sacred structure.", type: 'SAGE', symbol: 'SANKOFA' },
                            { t: "Verse a rhyme to the beat.", type: 'HARMONIZER', symbol: 'AKOMA' },
                            { t: "Spin into a handstand.", type: 'KINESTHETIC', symbol: 'SESA' }
                        ]
                    },
                    {
                        q: "Yggdrasil offers you a tool. Which do you grasp?",
                        options: [
                            { t: "The Sound Alchemist's Deck.", type: 'CREATOR', symbol: 'ANANSE' },
                            { t: "The Voyager's TukTuk Key.", type: 'PATHFINDER', symbol: 'AKOKO' },
                            { t: "The Community Drum.", type: 'HARMONIZER', symbol: 'AKOMA' }
                        ]
                    },
                    {
                        q: "Your Orbit is empty. How do you fill the void?",
                        options: [
                            { t: "Weave harmomy with others.", type: 'PATHFINDER', symbol: 'AKOKO' },
                            { t: "Show the world my movement.", type: 'KINESTHETIC', symbol: 'SESA' },
                            { t: "Build a base of knowledge.", type: 'SAGE', symbol: 'SANKOFA' }
                        ]
                    }
                ];
                this.score = { CREATOR:0, KINESTHETIC:0, PATHFINDER:0, HARMONIZER:0, SAGE:0 };
            }

            startRitual() {
                // If global Flowee initialized, hide it to prevent conflict with Pirate Phoenix
                if (window.Flowee && window.Flowee.container) {
                    window.Flowee.container.style.display = 'none';
                }
                
                document.getElementById('audio-hint').classList.add('hidden');
                
                // Show local Flowee
                const f = document.getElementById('flowee-companion');
                f.classList.remove('scale-0');
                f.classList.add('scale-100');
                
                this.nextPhase();
            }

            showTalk(msg, inputsHtml) {
                const bubble = document.getElementById('flowee-bubble');
                const text = document.getElementById('flowee-text');
                const inputs = document.getElementById('flowee-inputs');
                
                // Hide temporarily to animate
                bubble.classList.remove('opacity-1', 'scale-100');
                bubble.classList.add('opacity-0', 'scale-0');
                
                setTimeout(() => {
                    text.innerHTML = msg;
                    inputs.innerHTML = inputsHtml || '';
                    bubble.classList.remove('opacity-0', 'scale-0');
                    bubble.classList.add('opacity-1', 'scale-100');
                }, 400);
            }

            nextPhase() {
                this.phase++;

                if(this.phase === 1) {
                    this.engine.state = 'ALTAR';
                    
                    if(window.supabaseClient) {
                        window.supabaseClient.auth.getSession().then(({ data: { session } }) => {
                            if (session) {
                                this.savedEmail = session.user.email;
                                this.showTalk(
                                    "Your frequency is already linked to the Matrix. Shall we proceed to naming?",
                                    `<button onclick="window.Initiation.nextPhase()" class="w-full py-4 bg-mystic-gold text-black font-bold uppercase tracking-widest hover:scale-105 transition-transform rounded-xl mt-2">Next</button>`
                                );
                            } else {
                                this.showTalk(
                                    "Ah... a new frequency knocks at the gates of eternity. Who seeks entry?",
                                    `
                                    <input type="email" id="identity-email" class="w-full bg-black/50 border border-white/20 rounded-xl p-4 text-white focus:border-mystic-gold outline-none font-mono text-base" placeholder="your@email.com">
                                    <input type="password" id="reg-password" class="w-full bg-black/50 border border-white/20 rounded-xl p-4 text-white focus:border-mystic-gold outline-none font-mono text-base" placeholder="Password">
                                    <button onclick="window.Initiation.nextPhase()" class="w-full py-4 bg-mystic-gold text-black font-bold uppercase tracking-widest hover:scale-105 transition-transform rounded-xl mt-2">Next</button>
                                    <div class="flex gap-4 justify-center mt-2">
                                      <button onclick="window.handleOAuthLogin('google')" class="flex-1 p-3 bg-white/10 rounded-xl hover:bg-white/20 text-center uppercase text-xs font-bold text-white/70">Google</button>
                                      <button onclick="window.handleOAuthLogin('apple')" class="flex-1 p-3 bg-white/10 rounded-xl hover:bg-white/20 text-center uppercase text-xs font-bold text-white/70">Apple</button>
                                    </div>
                                    `
                                );
                            }
                        });
                    } else {
                        // Fallback
                        this.showTalk(
                            "Ah... a new frequency knocks at the gates of eternity. Who seeks entry?",
                            `
                            <input type="email" id="identity-email" class="w-full bg-black/50 border border-white/20 rounded-xl p-4 text-white focus:border-mystic-gold outline-none font-mono text-base" placeholder="your@email.com">
                            <input type="password" id="reg-password" class="w-full bg-black/50 border border-white/20 rounded-xl p-4 text-white focus:border-mystic-gold outline-none font-mono text-base" placeholder="Password">
                            <button onclick="window.Initiation.nextPhase()" class="w-full py-4 bg-mystic-gold text-black font-bold uppercase tracking-widest hover:scale-105 transition-transform rounded-xl mt-2">Next</button>
                            `
                        );
                    }
                } else if(this.phase === 2) {
                    // Validate Phase 1
                    const email = document.getElementById('identity-email')?.value;
                    const pw = document.getElementById('reg-password')?.value;
                    if(email) this.savedEmail = email;
                    if(pw) this.savedPw = pw;
                    
                    this.engine.state = 'TABLET';
                    this.showTalk(
                        "Every soul navigating this space needs a name. What shall we call you in the Ledger?",
                        `
                        <input type="text" id="reg-username" oninput="document.getElementById('btn-confirm-name').classList.remove('hidden')" class="w-full bg-black/50 border border-white/40 rounded-xl p-4 text-center text-xl text-white focus:border-mystic-gold outline-none tracking-[0.1em] font-mono" placeholder="@your_handle">
                        <button id="btn-confirm-name" onclick="window.Initiation.nextPhase()" class="hidden w-full py-4 bg-mystic-gold text-black font-bold uppercase tracking-widest hover:scale-105 transition-transform rounded-xl mt-2">Confirm</button>
                        `
                    );
                } else if(this.phase === 3) {
                    const un = document.getElementById('reg-username')?.value;
                    if(un) this.savedUsername = un;
                    
                    this.engine.state = 'MESSAGE';
                    this.showTalk(
                        "We move to a shared rhythm. Respect, Balance, Community. Do you accept the frequency of this circle?",
                        `
                        <button onclick="window.Initiation.nextPhase()" class="w-full py-4 bg-electric/20 border border-electric text-white font-bold uppercase tracking-widest hover:bg-electric transition-all rounded-xl shadow-[0_0_15px_rgba(154,77,255,0.4)]">I Accept the Flow</button>
                        `
                    );
                } else if(this.phase === 4) {
                    this.engine.state = 'QUIZ';
                    this.renderQuiz(0);
                }
            }

            renderQuiz(idx) {
                if(idx >= this.questions.length) {
                    this.finishRitual();
                    return;
                }
                const q = this.questions[idx];
                
                let pillsHtml = q.options.map(opt => `
                    <button onclick="window.Initiation.answerQuiz('${opt.type}', ${idx})" class="w-full text-left px-6 py-4 bg-mystic-gold/10 border border-mystic-gold/30 rounded-full hover:bg-mystic-gold hover:text-black hover:border-mystic-gold transition-all text-white/90 text-sm font-bold shadow-[0_0_10px_rgba(212,175,55,0.1)]">
                        ${opt.t}
                    </button>
                `).join('');
                
                this.showTalk(q.q, pillsHtml);
            }
            
            answerQuiz(type, idx) {
                this.score[type]++;
                this.renderQuiz(idx + 1);
            }

            async finishRitual() {
                const winner = Object.keys(this.score).reduce((a, b) => this.score[a] > this.score[b] ? a : b);
                this.assignedClass = winner;
                
                // Hide Flowee completely
                const f = document.getElementById('flowee-companion');
                f.classList.remove('scale-100');
                f.classList.add('scale-0');
                
                // Show 3D Result
                const symbolMap = { 'CREATOR': 'ANANSE', 'SAGE': 'SANKOFA', 'KINESTHETIC': 'SESA', 'PATHFINDER': 'AKOKO', 'HARMONIZER': 'AKOMA' };
                this.assignedSymbol = symbolMap[winner] || 'SANKOFA';
                this.engine.showSymbolResult(this.assignedSymbol);
                this.engine.state = 'DOOR';

                // Display AWAKENED UI
                document.getElementById('phase-finish').classList.remove('hidden');
                document.getElementById('assigned-class').innerText = `YOU ARE A ${winner}`;
                
                // Perform Supabase SignUp or Update silently
                if(window.supabaseClient) {
                    console.log("Registering user in Supabase...");
                    const { data: { session } } = await window.supabaseClient.auth.getSession();
                    if (session) {
                        await window.supabaseClient.auth.updateUser({
                            data: { username: this.savedUsername || 'Wanderer', flow_class: winner }
                        });
                    } else {
                        await window.supabaseClient.auth.signUp({
                            email: this.savedEmail || 'wanderer@flow.com',
                            password: this.savedPw || 'CircleFlow2026!',
                            options: { data: { username: this.savedUsername || 'Wanderer', flow_class: winner } }
                        });
                    }
                }
                
                // Save to local
                const user = {
                    username: this.savedUsername || 'Wanderer',
                    email: this.savedEmail || 'wanderer@flow.com',
                    class: winner,
                    joined: new Date().toISOString(),
                    adinkra_symbol: this.assignedSymbol
                };
                localStorage.setItem('cqr_user', JSON.stringify(user));
                localStorage.setItem('cqr_auth_state', 'logged_in');

                // Wait 5.5s, then show Password Prompt
                setTimeout(() => {
                    document.getElementById('phase-finish').classList.add('hidden');
                    f.classList.remove('scale-0');
                    f.classList.add('scale-100');
                    this.showTalk(
                        "One last thing to open the gate... What is the secret keyword?",
                        `
                        <input type="text" id="secret-keyword" class="w-full bg-black/50 border border-white/40 rounded-xl p-4 text-center text-xl text-white focus:border-mystic-gold outline-none tracking-[0.1em] font-mono" placeholder="Keyword">
                        <button onclick="window.Initiation.checkKeyword()" class="w-full py-4 bg-mystic-gold text-black font-bold uppercase tracking-widest hover:scale-105 transition-transform rounded-xl mt-4 shadow-[0_0_20px_rgba(212,175,55,0.4)]">Enter Dashboard</button>
                        `
                    );
                }, 5500);
            }
            
            checkKeyword() {
                const val = document.getElementById('secret-keyword')?.value;
                if(val === 'MyFlow!') {
                    this.showTalk("Welcome home...", "");
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    const text = document.getElementById('flowee-text');
                    text.innerHTML = "<span class='text-red-400'>Incorrect frequency. Try again.</span>";
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.Initiation = new InitiationRitual();
        });
    </script>
