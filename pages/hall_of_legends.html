<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CQR | THE BROTHERHOOD</title>
    <link rel="stylesheet" href="../css/styles.css"> 
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/agents/agent.js?v=3.2"></script>
    <script src="../js/agents/helper.js?v=3.2"></script>
    <script src="../js/agents/pusher.js?v=3.2"></script>
    <script src="../js/agents/sound_engineer.js?v=3.2"></script>
    <script src="../js/agents/brain.js?v=3.2"></script>
    <script src="../js/agents/flowee.js?v=3.2"></script>
    <script src="../js/agents/supabase_client.js?v=3.2"></script>
    <script src="../js/agents/quest_engine.js?v=3.3"></script>
</head>
<body class="animus-ui min-h-screen bg-black text-white font-mono">
    
    <!-- Background Grid -->
    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.1; background-image: linear-gradient(#333 1px, transparent 1px), linear-gradient(90deg, #333 1px, transparent 1px); background-size: 20px 20px; z-index:0;"></div>
    <div class="scanline-overlay"></div>

    <div class="relative z-10 max-w-4xl mx-auto pt-10 px-4 pb-20">
        
        <!-- HEADER -->
        <div style="text-align: center; margin-bottom: 50px;">
            <img src="../assets/images/cqr-logo-gold.png" style="width: 80px; filter: drop-shadow(0 0 10px gold);" class="mx-auto animate-pulse-slow">
            <h1 class="animus-title text-4xl md:text-6xl my-4 glitch-text" data-text="THE BROTHERHOOD" style="color:white; font-family:'Cinzel', serif;">THE BROTHERHOOD</h1>
            <p style="letter-spacing: 5px; color: #666; font-size: 0.9em; text-transform:uppercase;">LISBON CELL HIERARCHY</p>
            <a href="../pages/dashboard.html" class="inline-block mt-4 text-xs text-white/50 hover:text-gold no-underline">[ RETURN TO DASHBOARD ]</a>
        </div>

        <!-- USER DOSSIER CARD -->
        <div id="user-dossier" class="holo-card slide-in-entry" style="position: relative; overflow: hidden; padding: 30px; border: 1px solid gold; background: rgba(10,10,10,0.9); margin-bottom: 40px; box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);">
            
            <!-- Animated Background Pulse -->
            <div style="position: absolute; top: -50px; right: -50px; width: 250px; height: 250px; 
                background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%); 
                animation: pulse 4s infinite;"></div>

            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px; position: relative; z-index: 2;">
                
                <!-- Left: Rank & Name -->
                <div style="flex:1; min-width: 250px;">
                    <div style="display:flex; align-items:center; gap:15px; margin-bottom:10px;">
                        <div style="width:60px; height:60px; border:2px solid gold; display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:50%;">
                            <img id="my-avatar" src="../assets/images/default-avatar.png" style="width:100%; height:100%; object-fit:cover;">
                        </div>
                        <div>
                            <h3 style="color: gold; margin: 0; font-size: 0.8em; letter-spacing:1px;">IDENTITY CONFIRMED</h3>
                            <div id="my-codename" class="glitch-text" data-text="LOADING..." style="font-size: 1.5em; color: white; font-weight:bold;">LOADING...</div>
                        </div>
                    </div>
                
                    <h1 id="my-rank-label" style="font-size: 2.5em; margin: 10px 0; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); font-family:'Cinzel', serif;">INITIATE</h1>
                    
                    <div style="margin-top:5px; font-size:0.8em; color:#fff;">
                        SYNC RATE: <span id="my-sync" style="color:cyan;">0%</span>
                    </div>
                </div>

                <!-- Right: XP & Progress -->
                <div style="text-align: right; min-width: 150px;">
                    <div style="font-size: 3em; color: gold; font-family:'Courier New'; line-height:1;" id="my-exp">0</div>
                    <div style="font-size: 0.7em; color: #aaa; letter-spacing:2px; margin-bottom:15px;">TOTAL EXPERIENCE</div>
                    
                    <div style="width:100%; max-width:200px; height:4px; background:#333; margin-left:auto; position:relative;">
                        <div id="rank-progress-bar" style="width: 0%; height:100%; background:cyan; box-shadow: 0 0 10px cyan; transition: width 1s ease-out;"></div>
                    </div>
                    <div style="font-size:0.7em; color:cyan; margin-top:5px;">NEXT RANK PROGRESS</div>
                </div>
            </div>
        </div>

        <style>
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.5; }
        }
        </style>

        <!-- LEADERBOARD TABLE -->
        <div style="margin-top: 20px;">
            <div style="display:flex; justify-content:space-between; align-items:flex-end; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px;">
                <h3 style="color: gold; font-size: 1.2em; font-family:'Cinzel', serif; margin:0;">THE GOLDEN REGISTER</h3>
                <span style="font-size:0.7em; color:#666;">TOP 10 OPERATIVES</span>
            </div>

            <div id="leaderboard-list" style="display:flex; flex-direction:column; gap:10px;">
                <div class="loader text-center text-gold blink py-10">CONNECTING TO ANIMUS NETWORK...</div>
            </div>
        </div>
        </div>
    </div>

    <!-- GLOBAL NAV DOCK (ANIMUS) -->
    <nav class="animus-global-nav">
        <button onclick="window.location.href='quest_map.html'" class="nav-btn" id="nav-map"><span class="icon">📍</span><br>ATLAS</button>
        <button onclick="window.location.href='quest_board.html'" class="nav-btn" id="nav-board"><span class="icon">📖</span><br>CODEX</button>
        <button onclick="window.location.href='hall_of_legends.html'" class="nav-btn active" id="nav-bro"><span class="icon">🏛️</span><br>BROTHERHOOD</button>
        <div class="nav-divider"></div>
        <button onclick="window.QuestEngine.toggleComms()" class="nav-btn"><span class="icon">💬</span><br>COMMS</button>
        <button onclick="window.location.href='../pages/dashboard.html'" class="nav-btn exit"><span class="icon">⚡</span><br>MAIN</button>
    </nav>

    <!-- COMMS TERMINAL (Slide-in) -->
    <div id="comms-terminal" class="comms-hidden">
        <div class="comms-header">
            <h3 style="color: #00f0ff; margin: 0; font-family:'Cinzel', serif;">COMMS LINK</h3>
            <button onclick="window.QuestEngine.toggleComms(false)" style="background:transparent; border:none; color:white; font-size:1.5em; cursor:pointer;">×</button>
        </div>
        <div class="comms-tabs">
            <button onclick="switchCommsTab('requests')" id="tab-requests" class="active">PENDING</button>
            <button onclick="switchCommsTab('network')" id="tab-network">CHATS</button>
        </div>
        <div id="comms-requests-view" class="comms-view active"></div>
        <div id="comms-network-view" class="comms-view"></div>
        <div id="comms-chat-view" class="comms-view" style="display:none;">
            <div style="border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:10px;">
                <button onclick="closeChat()" style="color:#00f0ff; background:transparent; border:none; cursor:pointer;">◀ BACK</button>
                <span id="chat-partner-name" style="color:gold; margin-left:10px; font-weight:bold;">--</span>
            </div>
            <div id="chat-messages" style="flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column;"></div>
            <div style="display:flex; margin-top:10px;">
                <input type="text" id="chat-input" placeholder="Message..." style="flex:1; background:#111; color:white; border:1px solid #333; padding:10px;">
                <button onclick="window.QuestEngine.sendChatMessage()" style="background:#00f0ff; color:black; border:none; padding:0 15px; font-weight:bold; cursor:pointer;">SEND</button>
            </div>
        </div>
    </div>

    <style>
        .leaderboard-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.02); padding: 15px; border-left: 2px solid #333;
            transition: all 0.3s; font-family: 'Courier New';
        }
        .leaderboard-item:hover {
            background: rgba(255,215,0,0.05); border-left-color: gold; transform: translateX(5px);
        }
        .rank-num { font-weight: bold; margin-right: 15px; font-size: 1.2em; }
    </style>

    <script>
        window.addEventListener('load', async () => {
             if(window.QuestEngine) {
                 if(window.initEngine) await window.initEngine(); // User Profile Load
                 if(window.initBrotherhood) await window.initBrotherhood(); // Leaderboard Logic

                 // Avatar Update
                 if(window.userProfile && window.userProfile.avatar_url) {
                     document.getElementById('my-avatar').src = window.userProfile.avatar_url;
                 }
             } else {
                 document.getElementById('leaderboard-list').innerHTML = "<div class='text-red-500 text-center'>OFFLINE MODE</div>";
             }
        });
    </script>
</body>
</html>
