<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Session | Kiss Your Heart</title>
  <link rel="icon" href="/Assets/kyh/brand/kiss-your-heart-logo.png" type="image/png">
  <link rel="stylesheet" href="/css/kyh-design-system.css">
</head>
<body class="kyh-body">
  <div class="kyh-shell">
    <div id="kyh-nav-root"></div>
    <main class="kyh-section">
      <div class="kyh-container kyh-reveal" style="max-width:52rem;">
        <p class="kyh-eyebrow">Sessions</p>
        <h1 class="kyh-display kyh-display-md">Book a Session</h1>
        <p class="kyh-lead" style="margin-top:0.75rem;">Choose the support that matches where you are — from first feeling to full journey.</p>
        <div id="kyh-book-grid" class="kyh-journey-grid" style="margin-top:1.5rem;"></div>
        <p class="kyh-muted" style="margin-top:1.5rem;text-align:center;">
          Not sure yet? <a href="/pages/kyh/create/project-builder" style="color:var(--kyh-gold);">Start with the Project Builder</a>
        </p>
      </div>
    </main>
    <div id="kyh-footer-root"></div>
  </div>
  <script src="/js/kyh/kyh-config.js"></script>
  <script src="/js/kyh/data/services.js"></script>
  <script src="/js/kyh/kyh-book.js"></script>
  <script src="/js/kyh/kyh-shell.js"></script>
  <script src="/js/kyh/kyh-motion.js"></script>
  <script src="/js/kyh/kyh-page.js"></script>
  <script src="/js/agents/flowee.js" defer></script>
  <script src="/js/agents/flowee_kyh_guide.js" defer></script>
  <script>
    KYHPage.boot({
      onReady: function () {
        KYHBook.renderGrid(document.getElementById('kyh-book-grid'));
      }
    });
  </script>
</body>
</html>
