            THE SANCTUM
        </h1>

        <!-- The Master Portrait -->
        <div class="relative w-80 h-[500px] md:w-96 md:h-[600px] bg-black border border-white/10 rounded-t-full rounded-b-lg shadow-[0_0_50px_rgba(0,0,0,0.8)] overflow-hidden group transition-all duration-700 hover:border-white/20 hover:shadow-[0_0_80px_rgba(154,77,255,0.1)]">

            <div class="relative w-full h-full group" id="portrait-container">
                <img src="../Assets/images/logo.png" alt="The Architect" class="w-full h-full object-cover opacity-60 group-hover:opacity-80 transition-opacity duration-700 grayscale group-hover:grayscale-0 pointer-events-none">
                
                <!-- CLICK TRIGGER OVERLAY (Standard Entry) -->
                <div onclick="activateNenScanner()" class="absolute inset-0 z-40 cursor-pointer" title="Enter The Sanctum"></div>

                <!-- THE NEXUS KEY (MASTER DASHBOARD ACCESS) -->
                <!-- Hidden on the eye or specific detail -->
                <div id="nexus-key-detail" 
                     class="absolute top-[38%] left-[51%] w-6 h-6 z-[60] cursor-alias opacity-0 hover:bg-white/20 rounded-full transition-all duration-300"
                     onclick="event.stopPropagation(); activateMasterKey()"
                     title="???">
                </div>

                <!-- Visual Hint (The Nexus Key Glint) -->
                <div id="nexus-key" 
                    class="absolute top-[35%] left-[50%] -translate-x-1/2 w-4 h-4 rounded-full pointer-events-none z-30 transition-all duration-500 group-hover:scale-150 hidden-trigger">
                    <div class="absolute inset-0 bg-electric/0 group-hover:bg-electric/20 blur-sm rounded-full transition-all duration-300"></div>
                </div>
            </div>
            <!-- Overlay Text -->
            <div class="absolute bottom-10 left-0 w-full text-center pointer-events-none z-40">
                <p class="text-xs uppercase tracking-[0.3em] text-white/30 group-hover:text-electric transition-colors duration-500">Master of the Flow</p>
                <div class="w-1 h-12 bg-gradient-to-b from-white/10 to-transparent mx-auto mt-4"></div>
            </div>

            <!-- Scanner Effect (Hidden Default) -->
            <div id="nen-scanner" class="absolute left-0 w-full h-2 bg-electric/80 shadow-[0_0_20px_#9A4DFF] hidden z-40 pointer-events-none"></div>
            <div id="glass-shatter" class="absolute inset-0 bg-white hidden z-[60] mix-blend-overlay pointer-events-none"></div>
        </div>

        <div class="mt-8 text-[10px] text-white/20 font-mono tracking-widest">
            // RESTRICTED ACCESS // LEVEL 0 ONLY
        </div>

    </main>

    <script>
        function activateNenScanner() {
            console.log("[Sanctum] Key Activated.");
            
            try {
                const scanner = document.getElementById('nen-scanner');
                const shatter = document.getElementById('glass-shatter');
                const key = document.getElementById('nexus-key');
                
                if(!key || !scanner || !shatter) {
                    console.error("Critical DOM Elements missing!");
                    // Emergency Redirect
                    window.location.href = 'dashboard.html?mode=command_core';
                    return;
                }

                // UI Feedback
                key.classList.remove('animate-ping'); // Reset
                void key.offsetWidth; // Trigger reflow
                key.classList.add('animate-ping');
                
                localStorage.setItem('nexus_key_unlocked', 'true'); 
                
                // Audio Simulation
                console.log("[SFX] Thrummmm...");

                setTimeout(() => {
                    scanner.classList.remove('hidden');
                    scanner.classList.add('animate-scan');
                }, 200);

                setTimeout(() => {
                    shatter.classList.remove('hidden');
                    shatter.classList.add('animate-pulse');
                    document.body.classList.add('animate-shake');
                }, 1500);

                setTimeout(() => {
                    console.log("[Sanctum] Crossing the Threshold...");
                    window.location.href = 'dashboard.html?mode=command_core';
                }, 2000);
            } catch (err) {
                console.error("Sanctum Malfunction:", err);
                alert("Key Malfunction. Direct Bypass Engaged.");
                window.location.href = 'dashboard.html?mode=command_core';
            }
        }
    </script>
    
    <style>
        .animate-shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
