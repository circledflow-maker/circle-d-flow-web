<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flavor Quest - African Queen Kitchen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase_client.js"></script>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Space Mono', monospace;
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .marker { font-family: 'Permanent Marker', cursive; }
        .neon-green { text-shadow: 0 0 10px #00ff00; color: #00ff00; }
        .neon-orange { text-shadow: 0 0 10px #ff6600; color: #ff6600; }
        
        .quest-card {
            background: rgba(20, 20, 20, 0.9);
            border: 2px dashed #333;
            transition: all 0.3s;
        }
        .quest-card:hover {
            border-color: #00ff00;
            transform: scale(1.02);
        }
        .quest-card.completed {
            border-style: solid;
            border-color: #00ff00;
            background: rgba(0, 255, 0, 0.05);
        }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12">

    <!-- Mobile Header & Burger Menu -->
    <div class="fixed top-6 left-6 z-[100]">
        <button id="burger-btn" class="w-10 h-10 flex flex-col justify-center items-center gap-1.5 bg-black border border-[#d4af37]/50 rounded cursor-pointer z-[101]">
            <span class="w-6 h-0.5 bg-[#d4af37] transition-all duration-300"></span>
            <span class="w-6 h-0.5 bg-[#d4af37] transition-all duration-300"></span>
            <span class="w-6 h-0.5 bg-[#d4af37] transition-all duration-300"></span>
        </button>
    </div>

    <!-- Fullscreen Mobile Menu Overlay -->
    <div id="mobile-menu" class="fixed inset-0 bg-black/95 z-[90] opacity-0 pointer-events-none transition-opacity duration-300 flex flex-col items-center justify-center">
        <nav class="flex flex-col gap-6 text-center">
            <a href="../index.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition">Zum Orbit</a>
            <a href="bantaba.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition">Nach Bantaba</a>
            <a href="about.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition">About Us</a>
            <a href="portfolio_anime_reality.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition">Portfolio</a>
            <a href="heart.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition">Heart</a>
            <a href="luvo.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition">Luvo</a>
        </nav>
    </div>


    <!-- Header -->
    <div class="flex justify-between items-center mb-12">
        <a href="taste_world_entry.html" class="flex items-center gap-2 hover:text-[#00ff00] transition-colors">
            <span class="material-symbols-outlined">arrow_back</span>
            <span class="uppercase font-bold">Back to Kitchen</span>
        </a>
        <div class="text-right">
            <div class="marker text-3xl neon-orange">Flavor Quest</div>
            <div class="text-xs text-white/50" id="user-xp">XP: 0 / Level 1</div>
        </div>
    </div>

    <!-- Active Quests -->
    <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
        <span class="material-symbols-outlined text-[#00ff00]">flag</span> Active Missions
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12" id="quest-grid">
        <!-- Quests Injected JS -->
    </div>

    <!-- Rewards Shop -->
    <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
        <span class="material-symbols-outlined text-[#ff6600]">storefront</span> Loot Shop
    </h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="p-4 border border-white/10 rounded-lg text-center opacity-50 cursor-not-allowed">
            <div class="material-symbols-outlined text-4xl mb-2">local_cafe</div>
            <h3 class="font-bold">Free Drink</h3>
            <p class="text-xs text-white/50">Cost: 500 XP</p>
        </div>
        <div class="p-4 border border-white/10 rounded-lg text-center opacity-50 cursor-not-allowed">
            <div class="material-symbols-outlined text-4xl mb-2">restaurant</div>
            <h3 class="font-bold">Secret Menu</h3>
            <p class="text-xs text-white/50">Cost: 1000 XP</p>
        </div>
    </div>

    <!-- Scripting -->
    <script src="../js/agents/helper.js"></script>
    <script src="../js/agents/pusher.js"></script>
    <script>
        const quests = [
            { id: 1, title: "The First Bite", desc: "Order any main dish from the Kitchen.", xp: 100, status: 'claimable' },
            { id: 2, title: "Social Butterfly", desc: "Share a photo of your meal on Instagram.", xp: 200, status: 'locked' },
            { id: 3, title: "Critic's Choice", desc: "Leave a review in the Flavor Log.", xp: 150, status: 'active' },
            { id: 4, title: "The Regular", desc: "Order 3 times in one week.", xp: 500, status: 'locked' }
        ];

        async function renderQuests() {
            const grid = document.getElementById('quest-grid');
            grid.innerHTML = '';
            
            // Fetch dynamic quest if ID in URL
            const urlParams = new URLSearchParams(window.location.search);
            const dynamicId = urlParams.get('id');
            
            let allQuests = [...quests];
            
            if(dynamicId && window.cdf_supabase) {
                try {
                    const { data, error } = await window.cdf_supabase.from('quests').select('*').eq('id', dynamicId).single();
                    if(!error && data) {
                        allQuests.unshift({
                            id: data.id,
                            title: "[SCANNED] " + data.title,
                            desc: data.description || "Community Quest. Type: " + data.type,
                            xp: data.reward_karma || 100,
                            status: 'claimable'
                        });
                    }
                } catch(e) { console.error("Error loading scanned quest", e); }
            }
            
            allQuests.forEach(q => {
                let actionBtn = '';
                if(q.status === 'claimable') {
                    actionBtn = `<button onclick="claimReward(${q.id}, ${q.xp})" class="mt-4 w-full py-2 bg-[#00ff00] text-black font-bold uppercase text-xs hover:bg-white transition-colors">Claim ${q.xp} XP</button>`;
                } else if (q.status === 'active') {
                    actionBtn = `<div class="mt-4 w-full py-2 border border-white/20 text-center text-xs text-white/50 uppercase">In Progress</div>`;
                } else {
                    actionBtn = `<div class="mt-4 w-full py-2 text-center text-xs text-white/20 uppercase"><span class="material-symbols-outlined text-sm align-middle">lock</span> Locked</div>`;
                }

                const card = document.createElement('div');
                card.className = `quest-card p-6 rounded-lg ${q.status === 'completed' ? 'completed' : ''}`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-lg">${q.title}</h3>
                        <span class="text-[#00ff00] font-mono text-sm">+${q.xp} XP</span>
                    </div>
                    <p class="text-sm text-white/70">${q.desc}</p>
                    ${actionBtn}
                `;
                grid.appendChild(card);
            });
        }

        function claimReward(id, xp) {
            // Update local state (simulated)
            const q = quests.find(i => i.id === id);
            q.status = 'completed';
            q.title += ' (DONE)';
            
            // Notify
            if(window.Pusher) {
                window.Pusher.showToast(`Quest Completed! +${xp} XP`, 'xp');
                window.Pusher.broadcast('XP_GAIN', { amount: xp });
            }
            
            // Add to Supabase Gamification if it's a dynamic quest (uuid vs number)
            if(typeof id === 'string' && window.cdf_supabase) {
                 window.cdf_supabase.from('quests').update({ status: 'completed' }).eq('id', id).then(() => {
                     console.log("Dynamic quest completed");
                 });
            }
            
            renderQuests();
        }

        // Init
        renderQuests();

        // Check for User Alignment (Integration)
        const isAligned = localStorage.getItem('cdf_alignment_status') === 'ALIGNED';
        if(isAligned) {
            document.getElementById('user-xp').innerText += ' | ALIGNED';
        }
    </script>

<script src="../js/agents/global_ticker.js" defer></script>
<script src="../js/agents/network_hub.js" defer></script>

    <script src="../js/agents/tutorial_core.js" defer></script>
    <script src="../js/agents/quest_controller.js" defer></script>
    <script src="../js/agents/visual_integrity.js" defer></script>
    <script src="../js/agents/sound_engineer.js" defer></script>
    <script src="../js/agents/flowee.js" defer></script>
</body>
</html>
