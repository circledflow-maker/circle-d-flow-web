<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flavor Quest | Taste World</title>
    <script src="https://cdn.tailwindcss.com" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { background:#050505; color:#fff; font-family:'Space Mono',monospace; background-image:radial-gradient(#1a1a1a 1px,transparent 1px); background-size:20px 20px; padding-bottom:88px; }
        .neon-green { text-shadow:0 0 10px #00ff00; color:#00ff00; }
        .quest-card { background:rgba(20,20,20,0.9); border:2px dashed #333; transition:all 0.3s; }
        .quest-card.completed { border-style:solid; border-color:#00ff00; background:rgba(0,255,0,0.05); }
        .feedback-box { border:1px solid rgba(0,255,0,0.3); border-radius:12px; background:rgba(0,0,0,0.6); padding:1rem; }
        #feedback-preview { max-height:120px; object-fit:cover; border-radius:8px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 max-w-2xl mx-auto">

    <header class="flex justify-between items-center mb-8">
        <a href="taste_world_hub.html" class="flex items-center gap-2 hover:text-[#00ff00] text-xs uppercase">
            <span class="material-symbols-outlined">arrow_back</span> Hub
        </a>
        <div class="flex gap-2 items-center">
            <div id="tw-lang-switch"></div>
            <div class="text-right">
                <div class="text-lg neon-green font-bold" data-tw-i18n="tw.flavor.title">Flavor Quest</div>
                <div class="text-[10px] text-white/50" id="user-xp">XP: —</div>
            </div>
        </div>
    </header>

    <h2 class="text-sm font-bold mb-4 flex items-center gap-2">
        <span class="material-symbols-outlined text-[#00ff00]">flag</span>
        <span data-tw-i18n="tw.flavor.missions">Aktive Missionen</span>
    </h2>
    <div class="grid gap-4 mb-10" id="quest-grid"></div>

    <section class="feedback-box mb-10" id="flavor-feedback-panel">
        <h2 class="text-sm font-bold mb-3 flex items-center gap-2 text-[#00ff00]">
            <span class="material-symbols-outlined">rate_review</span>
            <span data-tw-i18n="tw.flavor.feedback">Flavor Log — Feedback</span>
        </h2>
        <div class="flex gap-2 mb-3" id="rating-stars">
            <button type="button" class="flame text-xl opacity-40" data-r="1">🔥</button>
            <button type="button" class="flame text-xl opacity-40" data-r="2">🔥</button>
            <button type="button" class="flame text-xl opacity-40" data-r="3">🔥</button>
            <button type="button" class="flame text-xl opacity-40" data-r="4">🔥</button>
            <button type="button" class="flame text-xl opacity-40" data-r="5">🔥</button>
        </div>
        <textarea id="feedback-body" rows="3" class="w-full bg-black/50 border border-white/10 rounded p-3 text-xs mb-3" data-tw-i18n="tw.flavor.feedback.placeholder"></textarea>
        <div class="flex gap-3 items-center mb-3 flex-wrap">
            <label class="text-[10px] px-3 py-2 border border-white/20 rounded cursor-pointer uppercase">
                <span data-tw-i18n="tw.flavor.upload">Foto hochladen</span>
                <input type="file" id="feedback-photo" accept="image/*" class="hidden">
            </label>
            <label class="text-[10px] px-3 py-2 border border-white/20 rounded cursor-pointer uppercase">
                Video
                <input type="file" id="feedback-video" accept="video/mp4,video/webm,video/quicktime" class="hidden">
            </label>
            <img id="feedback-preview" class="hidden w-20 h-20 object-cover rounded border border-white/10" alt="">
            <video id="feedback-video-preview" class="hidden w-24 h-20 object-cover rounded border border-white/10" muted playsinline></video>
        </div>
        <button type="button" id="btn-send-feedback" class="w-full py-3 bg-[#00ff00] text-black font-bold text-xs uppercase" data-tw-i18n="tw.flavor.send">Feedback senden</button>
    </section>

    <div id="flowee-agent" style="position:fixed;bottom:72px;right:12px;z-index:9998"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="../js/data/taste_world_i18n.js?v=1.0" defer></script>
    <script src="../js/agents/supabase_client.js?v=4.1" defer></script>
    <script src="../js/agents/pusher.js" defer></script>
    <script src="../js/agents/flowee.js?v=5.0" defer></script>
    <script src="../js/agents/flowee_reward.js?v=1.0" defer></script>
    <script src="../js/agents/quest_engine.js?v=4.7" defer></script>
    <script src="../js/agents/flavor_quest_engine.js?v=1.1" defer></script>
    <script src="../js/utils/media_compress.js?v=1.0" defer></script>
    <script src="../js/agents/kitchen_feedback.js?v=1.1" defer></script>
    <script defer>
        let feedbackRating = 5;

        document.addEventListener('DOMContentLoaded', () => {
            window.TasteI18n?.renderLangSwitcher('tw-lang-switch');
            window.TasteI18n?.apply();
            if (window.KitchenFeedback) window.KitchenFeedback.setRating(5);

            document.querySelectorAll('#rating-stars .flame').forEach((btn, i) => {
                btn.addEventListener('click', () => {
                    feedbackRating = i + 1;
                    if (window.KitchenFeedback) window.KitchenFeedback.setRating(feedbackRating);
                    document.querySelectorAll('#rating-stars .flame').forEach((b, j) => {
                        b.style.opacity = j < feedbackRating ? '1' : '0.35';
                    });
                });
            });
            document.querySelectorAll('#rating-stars .flame').forEach((b, j) => { b.style.opacity = j < 5 ? '1' : '0.35'; });

            document.getElementById('feedback-photo')?.addEventListener('change', async (e) => {
                const file = e.target.files?.[0];
                if (!file || !window.KitchenFeedback) return;
                try {
                    const url = await window.KitchenFeedback.handlePhotoInput(file);
                    document.getElementById('feedback-video-preview')?.classList.add('hidden');
                    const prev = document.getElementById('feedback-preview');
                    prev.src = url;
                    prev.classList.remove('hidden');
                } catch (err) {
                    if (window.Pusher) window.Pusher.showToast(err.message, 'error');
                }
            });

            document.getElementById('feedback-video')?.addEventListener('change', async (e) => {
                const file = e.target.files?.[0];
                if (!file || !window.KitchenFeedback) return;
                try {
                    const url = await window.KitchenFeedback.handleVideoInput(file);
                    document.getElementById('feedback-preview')?.classList.add('hidden');
                    const vid = document.getElementById('feedback-video-preview');
                    vid.src = url;
                    vid.classList.remove('hidden');
                } catch (err) {
                    if (window.Pusher) window.Pusher.showToast(err.message, 'error');
                }
            });

            document.getElementById('btn-send-feedback')?.addEventListener('click', async () => {
                const body = document.getElementById('feedback-body')?.value?.trim();
                if (!body) {
                    if (window.Pusher) window.Pusher.showToast('Bitte Text eingeben / Please write feedback', 'error');
                    return;
                }
                if (window.KitchenFeedback) {
                    window.KitchenFeedback.setRating(feedbackRating);
                    const result = await window.KitchenFeedback.submit(body);
                    if (!result.ok) {
                        if (window.Pusher) window.Pusher.showToast('Foto oder Video erforderlich / Photo or video required', 'error');
                        return;
                    }
                } else {
                    await window.FlavorQuestEngine.submitFeedback({
                        kitchenSlug: 'akwabalx',
                        rating: feedbackRating,
                        body,
                    });
                }
                if (window.Pusher) window.Pusher.showToast('Flavor Log gespeichert — claim XP in missions', 'success');
                window.FlavorQuestEngine.renderQuests('quest-grid');
            });

            window.FlavorQuestEngine.renderQuests('quest-grid');
            window.addEventListener('FLAVOR_QUEST_UPDATED', () => window.FlavorQuestEngine.renderQuests('quest-grid'));

            const urlId = new URLSearchParams(location.search).get('id');
            if (urlId) window.FlavorQuestEngine.setStatus('LQ-FQ06', 'claimable', { scanId: urlId });

            if (window.Flowee) window.Flowee.renderVessel();
            if (window.QuestEngine?.profile) {
                document.getElementById('user-xp').textContent = `XP: ${window.QuestEngine.profile.exp || 0}`;
            }
        });
    </script>
</body>
</html>
