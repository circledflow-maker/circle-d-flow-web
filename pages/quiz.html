<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingdom of Science | Circle D Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        /* Dr. STONE AESTHETIC */
        body { 
            background-color: #1a1a1a; 
            color: #e0e0e0; 
            font-family: 'Space Mono', monospace;
            background-image: url('https://www.transparenttextures.com/patterns/cracked-concrete.png'); /* Stone Texture */
        }
        .font-stone { font-family: 'Rock Salt', cursive; } /* Primitive feel */
        
        .science-glow {
            text-shadow: 0 0 10px #10b981, 0 0 20px #10b981; /* Emerald Green Glow */
        }
        
        .box-science {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            position: relative;
        }
        /* Blueprint corners */
        .box-science::before {
            content: ''; position: absolute; top: -2px; left: -2px; width: 10px; height: 10px; border-top: 2px solid #10b981; border-left: 2px solid #10b981;
        }
        .box-science::after {
            content: ''; position: absolute; bottom: -2px; right: -2px; width: 10px; height: 10px; border-bottom: 2px solid #10b981; border-right: 2px solid #10b981;
        }

        .animate-crack {
            animation: crackOpen 0.5s ease-out forwards;
        }
        @keyframes crackOpen {
            0% { transform: scale(1); filter: grayscale(100%); }
            50% { transform: scale(1.05); filter: grayscale(0%); }
            100% { transform: scale(1); box-shadow: 0 0 30px #10b981; }
        }
        
        /* Floating Particles */
        .particle {
            position: absolute;
            background: #10b981;
            border-radius: 50%;
            opacity: 0.5;
            animation: floatUp 5s infinite linear;
        }
        @keyframes floatUp {
            from { transform: translateY(100vh) scale(0); opacity: 0; }
            to { transform: translateY(-10vh) scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden relative selection:bg-emerald-500 selection:text-black">

    <!-- FX Layer -->
    <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
        <!-- Floating "Science" Particles -->
        <div class="particle left-[10%] w-1 h-1 delay-0"></div>
        <div class="particle left-[30%] w-2 h-2 delay-1000"></div>
        <div class="particle left-[60%] w-1 h-1 delay-2000"></div>
        <div class="particle left-[80%] w-3 h-3 delay-3000"></div>
        
        <!-- Light Leak -->
        <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-[100px]"></div>
    </div>

    <!-- HUD -->
    <div class="relative z-50 p-6 flex justify-between items-center bg-black/40 border-b border-white/5 backdrop-blur-md">
        <a href="library.html" class="flex items-center gap-2 text-white/50 hover:text-emerald-400 transition-colors group">
            <span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform">arrow_back</span>
            <span class="text-xs uppercase tracking-widest font-bold">World Map</span>
        </a>
        <div class="text-center">
            <h1 class="text-2xl font-stone text-white tracking-wider -rotate-2 science-glow">Kingdom of Science</h1>
        </div>
        
        <!-- CREATE QUIZ BUTTON -->
        <button onclick="Brain.attemptCreation()" class="flex items-center gap-2 px-4 py-2 border border-emerald-500/50 hover:bg-emerald-500/10 text-emerald-400 rounded transition-all group">
            <span class="material-symbols-outlined group-hover:rotate-90 transition-transform">science</span>
            <span class="text-xs font-bold uppercase tracking-widest">Forge</span>
        </button>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="relative z-10 flex-1 flex flex-col items-center justify-center p-6 h-full pt-16">
        <div id="quiz-container" class="w-full max-w-4xl flex flex-col items-center justify-center">
            <!-- Brain.js will inject content here -->
            <div class="animate-pulse flex flex-col items-center text-white/30">
                <span class="material-symbols-outlined text-6xl mb-4 text-emerald-500">biotech</span>
                <span class="uppercase tracking-widest text-sm">Synthesizing Chemical Formula...</span>
            </div>
        </div>
    </main>
    
    <!-- PETRIFICATION BREAK OVERLAY (Hidden) -->
    <div id="stone-overlay" class="fixed inset-0 z-[100] bg-[#2a2a2a] flex items-center justify-center hidden">
         <div class="text-center">
            <h2 class="text-6xl font-stone text-gray-500 mb-4 tracking-widest">CRACKING...</h2>
            <div class="w-64 h-2 bg-gray-700 rounded-full overflow-hidden mx-auto">
                <div class="h-full bg-emerald-500 animate-[width_2s_ease-in-out_forwards]" style="width: 0%"></div>
            </div>
         </div>
    </div>

    <!-- AGENTS -->
    <script src="../js/agents/network_hub.js"></script>
    <script src="../js/agents/pusher.js"></script>
    <script src="../js/agents/helper.js"></script>
    
    <!-- The Brain (Logic) -->
    <script src="../js/agents/brain.js"></script>
    <script>
        // Boot Sequence
        document.addEventListener('DOMContentLoaded', () => {
             // Generate Particles
             const container = document.querySelector('.absolute.inset-0.z-0');
             for(let i=0; i<10; i++) {
                 const p = document.createElement('div');
                 p.className = `particle w-${Math.random() > 0.5 ? 2 : 1} h-${Math.random() > 0.5 ? 2 : 1}`;
                 p.style.left = `${Math.random() * 100}%`;
                 p.style.animationDelay = `${Math.random() * 5}s`;
                 p.style.animationDuration = `${5 + Math.random() * 5}s`;
                 container.appendChild(p);
             }

            setTimeout(() => {
                if(window.Brain) {
                    window.Brain.startQuiz();
                }
            }, 1000);
        });
    </script>
    
    <!-- Horizon Bar -->
    <script src="../js/agents/global_ticker.js" defer></script>
    <script src="../js/agents/horizon_bar.js" defer></script>

    <!-- AUTOMATED AGENT INJECTION -->
    <script src="../js/agents/imperial_hud.js" defer></script>
<script src="../js/agents/constructor_bot.js" defer></script>
<script src="../js/agents/kingdom_science.js" defer></script>
<script src="../js/agents/resonance_bridge.js" defer></script>
<script src="../js/agents/vault_space.js" defer></script>
<script src="../js/agents/social_matrix.js" defer></script>
<script src="../js/agents/orbital_menu.js" defer></script>
    <script src="../js/agents/tutorial_core.js" defer></script>
    <script src="../js/agents/quest_controller.js" defer></script>
    <script src="../js/agents/visual_integrity.js" defer></script>
    <script src="../js/agents/sound_engineer.js" defer></script>
    <script src="../js/agents/flowee.js" defer></script>
</body>
</html>
