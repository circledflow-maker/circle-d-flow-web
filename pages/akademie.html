<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Akademie: Manga Archives - Circle D Flow</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'background-dark': '#0a0a0a',
                        'haki-gold': '#d4af37',
                        'electric': '#00f0ff'
                    },
                    fontFamily: {
                        mono: ['Courier New', 'Courier', 'monospace'],
                        cinzel: ['Cinzel', 'serif']
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/agents/supabase_client.js?v=3.2"></script>
    <script src="../js/data/akademie_data.js"></script>

    <style>
        body { background-color: #0a0a0a; color: white; overflow-x: hidden; font-family: 'Courier New', monospace; }
        .cinzel { font-family: 'Cinzel', serif; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4af37; }

        /* Book Cover 3D Effect */
        .book-container {
            perspective: 1000px;
            width: 160px;
            height: 240px;
            margin: 20px;
        }
        .book {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
            cursor: pointer;
            box-shadow: -5px 5px 20px rgba(0,0,0,0.8);
        }
        .book:hover {
            transform: rotateY(-15deg) scale(1.05);
        }
        .book-front {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            background: #111;
            border: 2px solid #d4af37;
            border-left: 8px solid #8b6914; /* Binding */
            border-radius: 4px 8px 8px 4px;
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        .book-front img { width: 100%; height: 100px; object-fit: cover; border-bottom: 2px solid #d4af37; }

        /* Reader View */
        .reader-mobile { flex-direction: column; }
        .reader-desktop { 
            flex-direction: row; 
            overflow-x: auto; 
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            perspective: 1200px;
        }
        .manga-page {
            flex: 0 0 auto;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-bottom: 2px solid #333;
        }
        @media (min-width: 768px) {
            .manga-page {
                width: 50vw; /* 2 pages on screen */
                height: 100vh;
                scroll-snap-align: center;
                border-bottom: none;
                border-right: 1px solid #222;
                transform-style: preserve-3d;
                transition: transform 0.3s;
            }
            /* Subtle 3D page curve effect */
            .manga-page:nth-child(odd) { transform: rotateY(2deg); transform-origin: right center; }
            .manga-page:nth-child(even) { transform: rotateY(-2deg); transform-origin: left center; }
            .manga-page img { max-height: 80vh; max-width: 90%; box-shadow: 0 0 30px rgba(0,0,0,0.8); border: 1px solid #444; }
        }
        @media (max-width: 767px) {
            .manga-page img { width: 100%; max-height: 60vh; object-fit: contain; }
        }
    </style>
</head>
<body class="bg-background-dark min-h-screen flex flex-col">

    <!-- Header -->
    <header class="fixed top-0 left-0 w-full z-40 bg-black/90 border-b border-haki-gold/30 p-4 flex justify-between items-center shadow-[0_0_20px_rgba(212,175,55,0.2)]">
        <button onclick="window.location.href='../Index.html'" class="text-white hover:text-haki-gold transition">
            <span class="material-symbols-outlined text-3xl">home</span>
        </button>
        <h1 class="cinzel text-xl text-haki-gold tracking-widest font-bold">AKADEMIE ARCHIVES</h1>
        <div class="w-8"></div> <!-- Spacer -->
    </header>

    <!-- 1. LIBRARY VIEW -->
    <main id="view-library" class="flex-grow pt-24 px-4 pb-12 w-full text-center">
        <p class="text-gray-400 text-sm mb-10 max-w-xl mx-auto">Welcome to the Grand Library. Here, the raw chronicles forged in the Areas are archived and bound into immortal Manga Volumes.</p>
        
        <div id="bookshelf" class="flex flex-wrap justify-center gap-4 max-w-6xl mx-auto">
            <p class="text-haki-gold animate-pulse">Loading Archives...</p>
        </div>

        <!-- Dev Hack -->
        <div class="mt-32 p-4 border border-red-900/50 bg-red-900/10 rounded inline-block">
            <h4 class="text-red-500 mb-2 text-xs">SYSTEM ADMIN TOOLS</h4>
            <button onclick="forceArchiveDev()" class="bg-red-800 hover:bg-red-600 text-white px-4 py-2 text-xs rounded border border-red-500">FORCE ARCHIVE CURRENT MONTH</button>
            <p class="text-[10px] text-gray-500 mt-2">Packs all current live chronicles into a Manga Volume.</p>
        </div>
    </main>

    <!-- 2. VOLUMES VIEW (Hidden) -->
    <div id="view-volumes" class="hidden fixed inset-0 bg-black/95 z-50 overflow-y-auto pt-24 px-4 pb-12">
        <button onclick="showLibrary()" class="absolute top-24 left-4 text-haki-gold hover:text-white flex items-center gap-2">
            <span class="material-symbols-outlined">arrow_back</span> Back
        </button>
        
        <div class="max-w-4xl mx-auto mt-12">
            <h2 id="series-title" class="cinzel text-3xl text-haki-gold mb-8 text-center border-b border-haki-gold/30 pb-4">Series Name</h2>
            <div id="volumes-list" class="flex flex-col gap-4">
                <!-- Volumes injected here -->
            </div>
        </div>
    </div>

    <!-- 3. READER VIEW (Hidden) -->
    <div id="view-reader" class="hidden fixed inset-0 bg-[#050505] z-[100] flex-col">
        <!-- Reader Toolbar -->
        <div class="h-14 bg-black/80 border-b border-[#333] flex items-center justify-between px-4 z-10">
            <button onclick="closeReader()" class="text-white hover:text-haki-gold"><span class="material-symbols-outlined">close</span></button>
            <span id="reader-title" class="cinzel text-haki-gold text-sm truncate max-w-[200px] md:max-w-md">Volume</span>
            <span class="text-xs text-gray-500 md:hidden">Scroll &darr;</span>
            <span class="text-xs text-gray-500 hidden md:block">Swipe &rarr;</span>
        </div>
        
        <!-- Reader Content -->
        <div id="reader-content" class="flex-1 overflow-auto flex reader-mobile md:reader-desktop bg-[url('../Assets/images/vision_oasis_bg.png')] bg-cover bg-center bg-blend-overlay bg-black/90">
            <!-- Pages injected here -->
        </div>
    </div>

    <script>
        let allAreas = [];
        let allLiveChronicles = [];
        let allArchives = [];
        let currentSelectedArea = null;

        async function initAkademie() {
            try {
                // Fetch Areas
                const { data: areas } = await window.supabaseClient.from('flow_areas').select('*');
                allAreas = areas || [];
                
                // Add Google Drive Artists
                if (window.AkademieData) {
                    window.AkademieData.forEach(artist => {
                        allAreas.push({
                            id: artist.id,
                            name: artist.name,
                            is_gdrive: true,
                            data: artist
                        });
                    });
                }

                // Fetch Live Chronicles (To be "Current Volume")
                const { data: chronicles } = await window.supabaseClient.from('chronicles').select('*').order('created_at', { ascending: true });
                allLiveChronicles = chronicles || [];

                // Fetch Archives (Past Volumes)
                const { data: archives } = await window.supabaseClient.from('manga_archives').select('*').order('archive_month', { ascending: false });
                allArchives = archives || [];

                renderBookshelf();
            } catch (err) {
                console.error("Akademie Load Error", err);
                document.getElementById('bookshelf').innerHTML = `<p class="text-red-500">Failed to load the library.</p>`;
            }
        }

        function renderBookshelf() {
            const shelf = document.getElementById('bookshelf');
            shelf.innerHTML = '';

            if (allAreas.length === 0) {
                shelf.innerHTML = `<p class="text-gray-500">No series discovered yet.</p>`;
                return;
            }

            allAreas.forEach(area => {
                // Check if area has ANY content (live or archived) or is GDrive
                const hasLive = allLiveChronicles.some(c => c.area_id === area.id);
                const hasArchived = allArchives.some(a => a.area_id === area.id);
                
                if (!hasLive && !hasArchived && !area.is_gdrive) return; // Skip empty areas

                let coverImg = area.image_url || '../Assets/images/logo.png';
                let seriesType = area.is_gdrive ? 'Artist Series' : 'Flow Series';
                
                if (area.is_gdrive && area.data.files && area.data.files.length > 0) {
                     coverImg = `https://drive.google.com/thumbnail?id=${area.data.files[0].id}&sz=w600`;
                } else if (area.is_gdrive && area.data.chapters && area.data.chapters.length > 0 && area.data.chapters[0].files.length > 0) {
                     coverImg = `https://drive.google.com/thumbnail?id=${area.data.chapters[0].files[0].id}&sz=w600`;
                }
                
                shelf.innerHTML += `
                    <div class="book-container" onclick="openSeries('${area.id}')">
                        <div class="book">
                            <div class="book-front">
                                <img src="${coverImg}" alt="Cover" onerror="this.src='../Assets/images/logo.png'">
                                <div class="p-3 text-left flex-1 flex flex-col justify-between">
                                    <h3 class="cinzel text-xs text-white font-bold truncate">${area.name}</h3>
                                    <p class="text-[10px] text-haki-gold mt-2">${seriesType}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function openSeries(areaId) {
            currentSelectedArea = allAreas.find(a => a.id === areaId);
            if (!currentSelectedArea) return;

            document.getElementById('view-library').classList.add('hidden');
            document.getElementById('view-volumes').classList.remove('hidden');
            
            document.getElementById('series-title').innerText = currentSelectedArea.name;
            const list = document.getElementById('volumes-list');
            list.innerHTML = '';

            if (currentSelectedArea.is_gdrive) {
                // GDrive Artist Series
                if (currentSelectedArea.data.chapters) {
                    currentSelectedArea.data.chapters.forEach((chapter, idx) => {
                        list.innerHTML += `
                            <div onclick="openReader('gdrive', '${idx}')" class="bg-black/60 border border-haki-gold/40 p-4 rounded cursor-pointer hover:bg-white/5 transition flex justify-between items-center group">
                                <div>
                                    <h4 class="text-lg cinzel text-haki-gold">${chapter.title}</h4>
                                    <p class="text-xs text-gray-400">Google Drive Archive</p>
                                </div>
                                <span class="material-symbols-outlined text-white/30 group-hover:text-haki-gold transition">auto_stories</span>
                            </div>
                        `;
                    });
                } else {
                    list.innerHTML += `
                        <div onclick="openReader('gdrive', '0')" class="bg-black/60 border border-haki-gold/40 p-4 rounded cursor-pointer hover:bg-white/5 transition flex justify-between items-center group">
                            <div>
                                <h4 class="text-lg cinzel text-haki-gold">Full Portfolio</h4>
                                <p class="text-xs text-gray-400">Google Drive Archive</p>
                            </div>
                            <span class="material-symbols-outlined text-white/30 group-hover:text-haki-gold transition">auto_stories</span>
                        </div>
                    `;
                }
            } else {
                // Flow Area Series
                // Render Archived Volumes
                const areaArchives = allArchives.filter(a => a.area_id === areaId);
                areaArchives.forEach((archive, idx) => {
                    const date = new Date(archive.archive_month).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
                    list.innerHTML += `
                        <div onclick="openReader('archive', '${archive.id}')" class="bg-black/60 border border-haki-gold/40 p-4 rounded cursor-pointer hover:bg-white/5 transition flex justify-between items-center group">
                            <div>
                                <h4 class="text-lg cinzel text-haki-gold">Vol. ${areaArchives.length - idx}</h4>
                                <p class="text-xs text-gray-400">${date}</p>
                            </div>
                            <span class="material-symbols-outlined text-white/30 group-hover:text-haki-gold transition">auto_stories</span>
                        </div>
                    `;
                });

                // Render Live Chronicles (Current Work in Progress)
                const areaLive = allLiveChronicles.filter(c => c.area_id === areaId);
                if (areaLive.length > 0) {
                    list.innerHTML += `
                        <div onclick="openReader('live', '${areaId}')" class="bg-[#111] border border-electric/50 p-4 rounded cursor-pointer hover:bg-electric/10 transition flex justify-between items-center shadow-[0_0_15px_rgba(0,240,255,0.1)] group">
                            <div>
                                <h4 class="text-lg cinzel text-electric">Current Chapter (Live)</h4>
                                <p class="text-xs text-gray-400">Unbound Chronicles</p>
                            </div>
                            <span class="material-symbols-outlined text-electric/50 group-hover:text-electric transition">edit_document</span>
                        </div>
                    `;
                }
            }
        }

        function showLibrary() {
            document.getElementById('view-volumes').classList.add('hidden');
            document.getElementById('view-library').classList.remove('hidden');
        }

        function openReader(type, id) {
            let pages = [];
            let title = "";

            if (type === 'live') {
                pages = allLiveChronicles.filter(c => c.area_id === id);
                title = "Current Chapter - " + currentSelectedArea.name;
            } else if (type === 'archive') {
                const archive = allArchives.find(a => a.id === id);
                title = "Archived Volume - " + currentSelectedArea.name;
                try {
                    pages = JSON.parse(archive.content_dump);
                } catch(e) {
                    console.error("Failed to parse archive dump", e);
                }
            } else if (type === 'gdrive') {
                let chapterIdx = parseInt(id);
                if (currentSelectedArea.data.chapters) {
                    title = currentSelectedArea.data.chapters[chapterIdx].title;
                    let gfiles = currentSelectedArea.data.chapters[chapterIdx].files;
                    pages = gfiles.map(f => ({
                        content: "",
                        user_name: currentSelectedArea.name,
                        media_url: f.type === 'video' ? `https://drive.google.com/file/d/${f.id}/preview` : `https://drive.google.com/uc?export=download&id=${f.id}`
                    }));
                } else {
                    title = "Full Portfolio";
                    let gfiles = currentSelectedArea.data.files || [];
                    pages = gfiles.map(f => ({
                        content: "",
                        user_name: currentSelectedArea.name,
                        media_url: f.type === 'video' ? `https://drive.google.com/file/d/${f.id}/preview` : `https://drive.google.com/uc?export=download&id=${f.id}`
                    }));
                }
            }

            document.getElementById('reader-title').innerText = title;
            const content = document.getElementById('reader-content');
            content.innerHTML = '';

            if (pages.length === 0) {
                content.innerHTML = `<p class="m-auto text-gray-500">The pages are blank...</p>`;
            } else {
                // Add cover page
                content.innerHTML += `
                    <div class="manga-page">
                        <h1 class="cinzel text-4xl text-haki-gold mb-4 text-center">${currentSelectedArea.name}</h1>
                        <p class="text-gray-400 border-t border-haki-gold/30 pt-4">${title}</p>
                    </div>
                `;

                pages.forEach(p => {
                    let mediaHtml = '';
                    if (p.media_url) {
                        if (p.media_url.includes('drive.google.com/file/d/')) {
                             const preview = p.media_url.replace(/\/view.*$/, '/preview');
                             mediaHtml = `<iframe src="${preview}" class="w-full h-[40vh] md:w-[80%] md:h-[60vh] mx-auto border border-[#333] mb-4"></iframe>`;
                        } else if (p.media_url.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
                             mediaHtml = `<img src="${p.media_url}" class="mb-4 object-contain">`;
                        } else {
                             mediaHtml = `<video src="${p.media_url}" controls class="max-h-[60vh] max-w-full mx-auto mb-4 border border-[#333]"></video>`;
                        }
                    }

                    content.innerHTML += `
                        <div class="manga-page bg-black/40 backdrop-blur-sm">
                            ${mediaHtml}
                            <div class="max-w-xl text-center">
                                <p class="text-sm md:text-base text-gray-300 leading-relaxed mb-4">"${p.content}"</p>
                                <p class="text-xs text-haki-gold/70 font-bold">- ${p.user_name || 'Anonymous Soul'}</p>
                            </div>
                        </div>
                    `;
                });
                
                // Add back cover
                content.innerHTML += `
                    <div class="manga-page">
                        <p class="cinzel text-2xl text-white/50">TO BE CONTINUED...</p>
                    </div>
                `;
            }

            document.getElementById('view-reader').classList.remove('hidden');
            document.getElementById('view-reader').classList.add('flex');
        }

        function closeReader() {
            document.getElementById('view-reader').classList.add('hidden');
            document.getElementById('view-reader').classList.remove('flex');
        }

        // --- DEV SYSTEM SCRIPT ---
        async function forceArchiveDev() {
            if(!confirm("Create a Manga Volume from ALL live chronicles right now?")) return;
            
            try {
                // Get unique areas that have live chronicles
                const activeAreas = [...new Set(allLiveChronicles.map(c => c.area_id))];
                
                for(let areaId of activeAreas) {
                    const areaChronicles = allLiveChronicles.filter(c => c.area_id === areaId);
                    const dump = JSON.stringify(areaChronicles);
                    const today = new Date().toISOString().split('T')[0];

                    // Insert Archive
                    await window.supabaseClient.from('manga_archives').insert([{
                        area_id: areaId,
                        archive_month: today,
                        content_dump: dump
                    }]);

                    // Delete original chronicles (To "seal" the volume)
                    // Note: In real production, you might want to keep them or delete. The prompt said "pack them into a volume".
                    // Let's actually delete them to simulate moving them!
                    await window.supabaseClient.from('chronicles').delete().eq('area_id', areaId);
                }

                alert("Manga Volumes Generated! Reloading Akademie...");
                location.reload();
            } catch(e) {
                console.error(e);
                alert("Archive Failed. Check console.");
            }
        }

        window.onload = initAkademie;
    </script>
</body>
</html>
