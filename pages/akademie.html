<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Akademie: Souls of the Flow - Circle D Flow</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'background-dark': '#0a0a0a',
                        'haki-gold': '#d4af37',
                        'accent-dark': '#1a1a1a'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Courier New', 'Courier', 'monospace'],
                        cinzel: ['Cinzel', 'serif']
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <style>
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .cinzel { font-family: 'Cinzel', serif; }
        .mono { font-family: 'Courier New', Courier, monospace; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4af37; }

        .folder-card {
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: all 0.3s ease;
        }
        .folder-card:hover {
            border-color: rgba(212, 175, 55, 0.8);
            transform: translateY(-2px);
            background: rgba(40, 40, 40, 0.9);
        }

        /* Lightbox Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
        }
        .grid-item {
            position: relative;
            padding-bottom: 100%;
            overflow: hidden;
            border-radius: 8px;
            background: #111;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
        }
        .grid-item img, .grid-item iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
            border: none;
        }
        .grid-item:hover img {
            transform: scale(1.05);
        }
        
        #full-image-overlay {
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-background-dark min-h-screen flex flex-col">

    <!-- Navigation Header -->
    <header class="fixed top-0 left-0 w-full z-40 bg-background-dark/80 backdrop-blur-md border-b border-white/10 p-4 flex justify-between items-center">
        <button onclick="window.history.back()" class="text-white hover:text-[#d4af37] transition">
            <span class="material-symbols-outlined text-2xl">arrow_back</span>
        </button>
        <h1 class="cinzel text-xl text-[#d4af37] tracking-widest uppercase">Akademie</h1>
        <button onclick="window.location.href='../Index.html'" class="text-white hover:text-[#d4af37] transition">
            <span class="material-symbols-outlined text-2xl">home</span>
        </button>
    </header>

    <main class="flex-grow pt-24 px-4 pb-12 max-w-6xl mx-auto w-full">
        <div class="text-center mb-10">
            <h2 class="cinzel text-3xl md:text-4xl text-white mb-2 uppercase">Souls of the Flow</h2>
            <p class="text-gray-400 font-mono text-sm max-w-2xl mx-auto">Explore the collected essence of our members and artists. Each folder contains up to 11 glimpses into their journey within the matrix.</p>
        </div>

        <!-- Folders Grid -->
        <div id="folders-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Populated dynamically via JS -->
        </div>
    </main>

    <!-- Main Lightbox for Artist's Images -->
    <div id="artist-lightbox" class="fixed inset-0 bg-black/95 z-[100] hidden flex-col">
        <!-- Lightbox Header -->
        <div class="flex items-center justify-between p-4 border-b border-white/10 bg-black/80">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-[#d4af37] text-2xl">folder_open</span>
                <h3 id="artist-title" class="cinzel text-xl text-white">Artist Name</h3>
            </div>
            <button onclick="closeArtistLightbox()" class="text-white hover:text-[#d4af37] transition">
                <span class="material-symbols-outlined text-3xl">close</span>
            </button>
        </div>
        
        <!-- Images Grid inside Lightbox -->
        <div class="flex-grow overflow-y-auto p-4 md:p-8">
            <div id="artist-images-grid" class="grid-container max-w-5xl mx-auto">
                <!-- Images populated dynamically -->
            </div>
        </div>
    </div>

    <!-- Full Image View Overlay -->
    <div id="full-image-overlay" class="fixed inset-0 bg-black/90 z-[110] hidden flex-col items-center justify-center" onclick="closeFullImage()">
        <button onclick="closeFullImage()" class="absolute top-6 right-6 text-white hover:text-[#d4af37] transition z-[120]">
            <span class="material-symbols-outlined text-4xl">close</span>
        </button>
        <div id="full-media-container" class="w-full h-full p-4 flex items-center justify-center pointer-events-none">
            <!-- Populated with img or iframe -->
        </div>
    </div>

    <script src="../js/data/akademie_data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('folders-container');
            container.innerHTML = '<p class="text-[#d4af37] text-center w-full cinzel animate-pulse">Loading Akademie Data...</p>';
            
            fetch('/api/akademie')
                .then(res => res.json())
                .then(data => {
                    if (data && data.Artist && data.Artist.length > 0) {
                        const foldersMap = {};
                        data.Artist.forEach(item => {
                            const folderName = item.professional_name;
                            if (!foldersMap[folderName]) foldersMap[folderName] = { name: folderName, files: [] };
                            const idMatch = item.url.match(/id=([^&]+)/);
                            if (idMatch) {
                                foldersMap[folderName].files.push(idMatch[1]);
                            }
                        });
                        window.AkademieData = Object.values(foldersMap);
                    }
                    renderFolders();
                })
                .catch(err => {
                    console.error("Failed to load /api/akademie, using fallback", err);
                    renderFolders(); // fallback to local script data
                });
        });

        function renderFolders() {
            const container = document.getElementById('folders-container');
            if (!window.AkademieData || window.AkademieData.length === 0) {
                container.innerHTML = '<p class="text-red-500 text-center w-full">Error loading Akademie Data. Try refreshing in a moment.</p>';
                return;
            }

            container.innerHTML = window.AkademieData.map((artist, index) => {
                const count = (artist.files && artist.files.length) ? artist.files.length : '0';
                return `
                <div class="folder-card p-4 rounded-xl cursor-pointer flex items-center gap-4" onclick="openArtistLightbox(${index})">
                    <div class="bg-black border border-[#d4af37]/30 rounded-lg p-3 flex-shrink-0">
                        <span class="material-symbols-outlined text-[#d4af37] text-2xl">folder_shared</span>
                    </div>
                    <div class="overflow-hidden">
                        <h4 class="text-white font-semibold truncate" title="${artist.name}">${artist.name}</h4>
                        <p class="text-xs text-gray-500 font-mono mt-1">${count} Items</p>
                    </div>
                </div>
            `}).join('');
        }

        function openArtistLightbox(artistIndex) {
            const artist = window.AkademieData[artistIndex];
            document.getElementById('artist-title').textContent = artist.name;
            
            const grid = document.getElementById('artist-images-grid');
            let imagesHTML = '';
            
            if (artist.files && artist.files.length > 0) {
                // If we successfully scraped their files
                artist.files.forEach((fileItem, i) => {
                    let id = typeof fileItem === 'string' ? fileItem : fileItem.id;
                    let type = typeof fileItem === 'string' ? 'unknown' : (fileItem.type || 'unknown');
                    const srcUrl = `https://drive.google.com/uc?export=view&id=${id}`;
                    const previewUrl = `https://drive.google.com/file/d/${id}/preview`;
                    
                    // We load as image first. If it's a video, user clicks it and the full view can use iframe preview
                    imagesHTML += `
                        <div class="grid-item" onclick="openFullMedia('${srcUrl}', '${previewUrl}', '${type}', event)">
                            <!-- Try loading as image, fallback to a video icon if it fails to load image -->
                            <img src="${srcUrl}" onerror="this.onerror=null; this.src='../Assets/images/logo.png'; this.style.opacity='0.2'; this.parentElement.innerHTML += '<span class=\\'material-symbols-outlined absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-white text-4xl\\'>play_circle</span>';" alt="${artist.name} Item ${i}">
                        </div>
                    `;
                });
            } else {
                // Fallback if scraping failed or didn't run
                imagesHTML = `<p class="text-gray-400 font-mono col-span-full text-center py-10">Kein Content vorhanden.</p>`;
            }
            
            grid.innerHTML = imagesHTML;
            
            // Show lightbox
            const lightbox = document.getElementById('artist-lightbox');
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeArtistLightbox() {
            const lightbox = document.getElementById('artist-lightbox');
            lightbox.classList.add('hidden');
            lightbox.classList.remove('flex');
            document.body.style.overflow = '';
        }

        function renderArtist(artistId) {
            const artist = AkademieData.find(a => a.id === artistId);
            const contentGrid = document.getElementById('artist-images-grid');
            if (!artist) return;
            
            // Generate grid
            let imagesHTML = '';
            
            if (!artist.files || artist.files.length === 0) {
                imagesHTML = '<div class="col-span-full text-center text-gray-400 py-12"><p class="font-mono">Kein Content vorhanden.</p></div>';
            } else {
                // Determine whether files is an array of strings (old) or array of objects (new)
                artist.files.forEach(fileItem => {
                    let fileId = '';
                    let fileType = 'unknown';
                    
                    if (typeof fileItem === 'string') {
                        fileId = fileItem;
                    } else {
                        fileId = fileItem.id;
                        fileType = fileItem.type;
                    }
                    
                    const srcUrl = `https://drive.google.com/uc?export=view&id=${fileId}`;
                    const previewUrl = `https://drive.google.com/file/d/${fileId}/preview`;
                    
                    // Add video play icon if type is video
                    const playIconHTML = fileType === 'video' ? `
                        <div class="absolute inset-0 flex items-center justify-center bg-black/30 group-hover:bg-black/50 transition-colors">
                            <span class="material-symbols-outlined text-white text-5xl opacity-80 group-hover:opacity-100 transition-opacity drop-shadow-lg">play_circle</span>
                        </div>
                    ` : '';
                    
                    imagesHTML += `<div class="grid-item group relative" onclick="openFullMedia('${srcUrl}', '${previewUrl}', '${fileType}', event)">
                        <img src="${srcUrl}" 
                             alt="Portfolio item" 
                             class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105"
                             loading="lazy"
                             onerror="this.onerror=null; this.src='../Assets/images/logo.png'; this.classList.add('p-8', 'opacity-20');">
                        ${playIconHTML}
                    </div>`;
                });
            }
            
            contentGrid.innerHTML = imagesHTML;
            const mobileMenu = document.getElementById('mobile-menu');
            if (mobileMenu) {
                mobileMenu.classList.add('hidden');
            }
        }

        // --- FULL SCREEN OVERLAY ---
        function openFullMedia(srcUrl, previewUrl, fileType, event) {
            if (event) event.stopPropagation();
            
            const overlay = document.getElementById('full-image-overlay');
            const container = document.getElementById('full-media-container');
            
            // Check if it's a video based on type or fallback to string matching
            const isVideo = fileType.includes('video') || fileType === 'video';
            
            if (isVideo) {
                // If it's a video, attempt to use HTML5 video with the export link
                // We use pointer-events-auto so the controls can be clicked
                container.innerHTML = `
                    <video controls autoplay class="max-w-full max-h-full rounded shadow-2xl pointer-events-auto" style="max-height: 85vh;">
                        <source src="${srcUrl}" type="${fileType !== 'unknown' ? fileType : 'video/mp4'}">
                        Your browser does not support the video tag.
                        <a href="${srcUrl}" class="text-electric block mt-4" target="_blank">Download Video</a>
                    </video>
                `;
            } else {
                // Image
                container.innerHTML = `
                    <img src="${srcUrl}" class="max-w-full max-h-full object-contain rounded shadow-2xl pointer-events-auto" style="max-height: 85vh;" alt="Media View">
                `;
            }
            
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeFullImage() {
            const overlay = document.getElementById('full-image-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
            document.getElementById('full-media-container').innerHTML = '';
        }
    </script>
</body>
</html>
