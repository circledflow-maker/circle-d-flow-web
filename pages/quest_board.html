<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CQR | THE CODEX</title>
    <link rel="stylesheet" href="../css/styles.css"> 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/agents/agent.js?v=3.2"></script>
    <script src="../js/agents/helper.js?v=3.2"></script>
    <script src="../js/agents/pusher.js?v=3.2"></script>
    <script src="../js/agents/sound_engineer.js?v=3.2"></script>
    <script src="../js/agents/brain.js?v=3.2"></script>
    <script src="../js/agents/flowee.js?v=3.2"></script>
    <script src="../js/agents/supabase_client.js?v=3.2"></script>
    <script src="../js/agents/quest_engine.js?v=3.3"></script> <!-- Updated Version -->
</head>
<body class="animus-ui m-0 p-0 overflow-hidden flex items-center justify-center min-h-screen bg-black">

    <!-- Background Ambiance -->
    <div class="scanline-overlay"></div>
    <div style="position:fixed; inset:0; background: radial-gradient(circle, rgba(20,20,20,1) 0%, rgba(0,0,0,1) 90%); z-index:-1;"></div>

    <!-- MAIN CODEX CONTAINER (THE BOOK) -->
    <div id="codex-container" style="
        width: 90vw; max-width: 1200px; height: 85vh; 
        background: rgba(10, 10, 10, 0.95); 
        border: 2px solid gold; 
        box-shadow: 0 0 50px rgba(255, 215, 0, 0.1);
        display: flex; position: relative; overflow: hidden;
    ">
        
        <!-- SIDEBAR (Spine) -->
        <div style="width: 250px; background: rgba(0,0,0,0.8); border-right: 1px solid #333; padding: 20px; display: flex; flex-direction: column;">
            <div style="text-align: center; margin-bottom: 30px;">
                <img src="../assets/images/cqr-logo-gold.png" style="width:60px; filter:drop-shadow(0 0 5px gold);" class="animate-pulse-slow">
                <h2 style="font-family:'Cinzel', serif; color:gold; margin-top:10px; font-size:1.5em; letter-spacing:2px;">THE CODEX</h2>
                <p style="font-size:0.7em; color:#666;">ANIMUS MEMORY ARCHIVE</p>
            </div>

            <button onclick="switchTab('read')" id="tab-read" class="codex-tab active">📖 READ MEMORIES</button>
            <button onclick="switchTab('write')" id="tab-write" class="codex-tab">✍️ ENCODE MEMORY</button>
            
            <div style="margin-top:auto; font-size:0.7em; color:#444; font-family:'Courier New';">
                SYNC STATUS: <span style="color:green;">CONNECTED</span><br>
                SERVER: LISBON-CORE<br>
                <a href="dashboard.html" style="color:gold; text-decoration:none; display:block; margin-top:10px;">[ RETURN ]</a>
            </div>
        </div>

        <!-- CONTENT AREA (Pages) -->
        <div style="flex: 1; position: relative; overflow: hidden;">
            
            <!-- PAGE 1: READ LIST (Left) & DETAIL (Right) -->
            <div id="quest-detail-page" style="display:flex; width:100%; height:100%;">
                
                <!-- LIST COLUMN -->
                <div style="width: 40%; border-right: 1px solid #222; overflow-y: auto; padding: 20px;">
                    <h3 style="color:#aaa; border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:15px; font-size:0.9em;">AVAILABLE SEQUENCES</h3>
                    <div id="quest-anchor-list">
                        <!-- Loaded via JS -->
                        <div class="loader text-gold blink">LOADING ARCHIVES...</div>
                    </div>
                </div>

                <!-- DETAIL COLUMN -->
                <div style="width: 60%; padding: 40px; position:relative; perspective: 1000px;">
                     <!-- Actual Content wrapped for animation -->
                     <div id="detail-card" style="height:100%; display:flex; flex-direction:column;">
                        <div style="border-bottom: 2px solid gold; padding-bottom: 10px; margin-bottom: 20px;">
                            <h1 id="detail-title" class="glitch-text" data-text="SELECT SEQUENCE" style="font-size:2.5em; color:white; font-family:'Cinzel', serif;">SELECT SEQUENCE</h1>
                            <p id="detail-subtitle" style="color:gold; font-family:'Courier New';">MEMORY FRAGMENT</p>
                        </div>

                        <div style="flex:1; overflow-y:auto; font-family:'Courier New'; font-size:1.1em; color:#ccc; line-height:1.6;" id="detail-desc">
                            Select a memory sequence from the left to view details.
                        </div>

                        <div style="background:rgba(255,215,0,0.05); padding:15px; border:1px solid #333; margin-top:20px; display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <div style="font-size:0.8em; color:#666;">REWARD DATA</div>
                                <div style="font-size:1.2em; color:white;"><span id="detail-exp" style="color:gold;">0</span> XP / <span id="detail-credits">0</span> Credits</div>
                            </div>
                            <button id="sync-btn" onclick="redirectToQuest()" style="display:none; background:gold; color:black; border:none; padding:10px 20px; font-weight:bold; cursor:pointer; font-family:'Courier New'; box-shadow: 0 0 10px gold;">
                                TARGET ON MAP 🎯
                            </button>
                        </div>
                     </div>
                </div>
            </div>


            <!-- PAGE 2: CREATE FORM -->
            <div id="quest-create-page" style="display:none; flex-direction:column; padding:40px; height:100%; align-items:center; justify-content:center;">
                
                <div style="width:100%; max-width:600px; background:rgba(20,20,20,0.9); border:1px solid #333; padding:30px; box-shadow:0 0 20px rgba(0,0,0,0.5);">
                    <h2 style="color:gold; text-align:center; margin-bottom:20px; font-family:'Cinzel', serif;">ENCODE NEW SCENARIO</h2>
                    
                    <div class="form-group" style="margin-bottom:15px;">
                        <label style="color:#666; font-size:0.8em;">SEQUENCE TITLE</label>
                        <input type="text" id="new-title" placeholder="e.g. The Hidden Cache" style="width:100%; padding:10px; background:black; border:1px solid #444; color:white; font-family:'Courier New';">
                    </div>

                    <div class="form-group" style="margin-bottom:15px;">
                        <label style="color:#666; font-size:0.8em;">DESCRIPTION / INSTRUCTIONS</label>
                        <textarea id="new-desc" placeholder="Describe the objective..." style="width:100%; height:100px; padding:10px; background:black; border:1px solid #444; color:white; font-family:'Courier New';"></textarea>
                    </div>

                    <div style="display:flex; gap:10px; margin-bottom:15px;">
                         <div style="flex:1;">
                            <label style="color:#666; font-size:0.8em;">LATITUDE</label>
                            <input type="text" id="new-lat" readonly style="width:100%; padding:10px; background:#111; border:1px solid #333; color:#666;">
                         </div>
                         <div style="flex:1;">
                            <label style="color:#666; font-size:0.8em;">LONGITUDE</label>
                            <input type="text" id="new-lng" readonly style="width:100%; padding:10px; background:#111; border:1px solid #333; color:#666;">
                         </div>
                    </div>

                    <button class="geo-btn" onclick="getCurrentLocation()" style="width:100%; padding:10px; background:#222; border:1px solid gold; color:gold; cursor:pointer; margin-bottom:20px; font-family:'Courier New';">
                        📡 GET CURRENT COORDINATES
                    </button>

                    <div style="display:flex; align-items:center; justify-content:space-between; border-top:1px solid #333; padding-top:20px;">
                        <div>
                            <label style="color:#666; font-size:0.8em;">DIFFICULTY (XP REWARD)</label>
                            <select id="new-exp" style="background:black; color:white; border:1px solid #444; padding:5px;">
                                <option value="50">Easy (50 XP)</option>
                                <option value="100">Medium (100 XP)</option>
                                <option value="250">Hard (250 XP)</option>
                            </select>
                        </div>
                        <button onclick="submitNewQuest()" style="background:gold; color:black; border:none; padding:10px 30px; font-weight:bold; cursor:pointer; font-family:'Courier New';">UPLOAD SEQUENCE</button>
                    </div>

                </div>

            </div>

        </div>
    </div>

    <style>
        .codex-tab { 
            display:block; width:100%; padding:15px; 
            background:transparent; border:none; 
            color:#666; text-align:left; cursor:pointer; 
            font-size:1em; border-bottom:1px solid #222; 
            font-family: 'Courier New'; transition: all 0.3s; 
        }
        .codex-tab:hover, .codex-tab.active { 
            color:gold; background:rgba(255,215,0,0.05); 
            border-left:4px solid gold; padding-left: 20px; 
            text-shadow: 0 0 5px gold;
        }

        .quest-item {
            padding: 15px; border-bottom: 1px solid #222;
            cursor: pointer; transition: background 0.2s;
            font-family: 'Courier New'; color: #ccc;
        }
        .quest-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: gold;
        }

        /* PAGE FLIP ANIMATION CLASS */
        .page-flip {
            animation: flipIn 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
            transform-origin: left center;
        }

        @keyframes flipIn {
            0% { transform: rotateY(-90deg); opacity: 0; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }

        .loader { font-family: 'Courier New'; font-size: 0.8em; text-align: center; margin-top: 20px; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>

    <script>
        // Start Engine
        window.addEventListener('load', async () => {
            if(window.QuestEngine) {
                // Wait for Engine to be ready
                if(window.initEngine) await window.initEngine();
                
                // Load Initial List
                if(window.loadAllQuests) window.loadAllQuests();
            } else {
                console.error("Critical Failure: Quest Engine not detected.");
            }
        });
    </script>
</body>
</html>
