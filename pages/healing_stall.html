<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healing Sanctuary | The Bazaar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Cinzel:wght@700&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {
            background: #08040a url('../benin_bg.png') no-repeat center center fixed;
            background-size: cover;
            color: #f4e4bc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(34, 197, 94, 0.2) 0%, rgba(0, 0, 0, 0.95) 100%);
            z-index: -1;
        }

        .shop-container {
            display: grid;
            grid-template-columns: 450px 1fr;
            height: 100vh;
            padding-top: 64px;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .merchant-img {
                height: 45vh;
                max-height: 350px;
            }
            .shop-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                overflow-y: auto;
            }
            .merchant-side {
                height: 50vh;
                min-height: 400px;
                border-right: none;
                border-bottom: 1px solid rgba(255, 174, 66, 0.2);
            }
            .inventory-side {
                padding: 20px;
                overflow-y: visible;
            }
            body {
                overflow-y: auto;
            }
        }

        .merchant-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 50px;
            position: relative;
        }

        .merchant-img {
            height: 85vh;
            filter: drop-shadow(0 0 30px rgba(34, 197, 94, 0.3));
            object-fit: contain;
            transition: all 0.5s ease;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.02); }
        }

        .dialogue-bubble {
            background: rgba(62, 39, 35, 0.95);
            border: 2px solid #FFAE42;
            padding: 10px 15px;
            border-radius: 15px;
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 380px;
            z-index: 10;
            font-size: 0.9rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        @keyframes popIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .inventory-side {
            padding: 40px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(34, 197, 94, 0.1);
        }

        .clay-slab {
            background: #1a2e1a url('https://www.transparenttextures.com/patterns/dark-matter.png');
            border: 1px solid rgba(34, 197, 94, 0.2);
            padding: 20px;
            border-radius: 12px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .clay-slab:hover {
            border-color: #22c55e;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.2);
        }

        .price-tag {
            color: #22c55e;
            font-family: 'Cinzel', serif;
            font-weight: bold;
        }

        .buy-btn {
            background: #22c55e;
            color: black;
            font-weight: bold;
            text-transform: uppercase;
            padding: 8px 20px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .buy-btn:hover {
            background: white;
            box-shadow: 0 0 20px #22c55e;
        }

        /* CUSTOM SCROLLBAR */
        .inventory-side::-webkit-scrollbar { width: 6px; }
        .inventory-side::-webkit-scrollbar-thumb { background: #22c55e; border-radius: 10px; }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>

    


    <!-- HORIZON BAR -->
    <header class="fixed top-0 w-full z-[100] h-16 flex lg:grid lg:grid-cols-[1fr_2fr_1fr] items-center px-4 lg:px-8 bg-black/90 border-b border-[#22c55e]/20 justify-between lg:justify-start">
        <div class="hidden lg:flex justify-start">
            <a href="marketplace.html" class="flex items-center gap-2 text-[#22c55e]/70 hover:text-[#22c55e] transition-colors">
                <span class="material-symbols-outlined text-sm group-hover:-translate-x-1 transition-transform">arrow_back</span>
                <span class="text-[10px] font-bold uppercase tracking-widest">Back</span>
            </a>
        </div>
        <div class="flex justify-center ml-12 lg:ml-0">
            <h1 class="font-cinzel font-bold text-base lg:text-lg tracking-[0.4em] text-[#22c55e]">HEALING SANCTUARY</h1>
        </div>
        <div class="flex justify-end gap-2 lg:gap-6 items-center">
             <div class="text-right hidden sm:block">
                <div class="text-[8px] text-[#22c55e]/50 uppercase">Spirit Vitality</div>
                <div class="text-white font-bold text-sm">98%</div>
             </div>
             <span class="material-symbols-outlined text-[#22c55e]">rebase_edit</span>
        </div>
    </header>

    <div class="shop-container">
        <!-- MERCHANT -->
        <div class="merchant-side">
            <div class="dialogue-bubble">
                "Breathe in the essence of the Forest. Your spirit is a garden; we are here to help it bloom."
            </div>
            <img src="../Assets/images/healing_oracle.png" class="merchant-img" alt="Healing Oracle">
            <div class="absolute bottom-10 left-1/2 -translate-x-1/2 text-center">
                <h3 class="text-2xl font-cinzel text-[#22c55e] glow-orange">THE ORACLE</h3>
                <p class="text-[10px] uppercase tracking-[0.3em] opacity-50">Guardian of the Sacred Root</p>
            </div>
        </div>

        <!-- INVENTORY -->
        <div class="inventory-side">
            <div class="mb-10">
                <h2 class="text-3xl font-cinzel mb-2">Healing Remedies & Rituals</h2>
                <p class="text-sm text-white/40 uppercase tracking-widest">Restore Your Flow with Ancestral Wisdom</p>
            </div>

            <div class="swiper healingSwiper w-full pb-10" style="overflow: hidden;">
                <div id="healing-grid" class="swiper-wrapper">
                <!-- ITEMS INJECTED HERE -->
                <div class="swiper-slide clay-slab text-center p-10 opacity-50 w-full flex items-center justify-center">
                    <span class="material-symbols-outlined text-6xl">spa</span>
                    <p class="mt-4 uppercase tracking-[0.5em]">Gathering Herbs...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/agents/supabase_client.js"></script>
    <script>
        async function loadHealing() {
            const grid = document.getElementById('healing-grid');
            const { data, error } = await window.supabaseClient
                .from('market_items')
                .select('*')
                .eq('category', 'Healing')
                .eq('is_active', true);

            if (error || !data || data.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full clay-slab text-center p-10 opacity-50">
                        <p>The Sanctuary is quiet. No remedies available at this moon.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = '';
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'clay-slab flex gap-6 items-center';
                div.innerHTML = `
                    <div class="w-24 h-24 rounded bg-black/40 overflow-hidden flex-shrink-0">
                        <img src="${item.image_url || '../Assets/images/default_artifact.png'}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1">
                        <h4 class="text-lg font-bold text-white mb-1">${item.name}</h4>
                        <p class="text-xs text-white/40 mb-3 line-clamp-1">${item.description}</p>
                        <div class="flex justify-between items-center">
                            <div class="price-tag">${item.price_fc} FC</div>
                            <button class="buy-btn text-[10px]">Heal</button>
                        </div>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        window.onload = loadHealing;
    </script>
</body>
</html>
