<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigator's Log | Circle D Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0d0d0f; color: #e0e0e0; font-family: 'Space Mono', monospace; }
        .glass-panel { background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen py-8 px-4">
    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 h-[80vh]">
        
        <!-- COLUMN 1: NEWS FEED -->
        <div class="glass-panel rounded-xl p-6 flex flex-col">
            <h2 class="text-xl font-bold text-green-500 uppercase tracking-widest mb-6">Captain's Log</h2>
            <div class="flex-1 overflow-y-auto space-y-4">
                <div class="p-3 border-l-2 border-amber-500 bg-white/5">
                    <span class="text-[10px] text-white/40">Today, 10:00 AM</span>
                    <p class="text-sm mt-1">Tournament Brackets for "Roux Tour" are now live. Check the Battlefield.</p>
                </div>
                 <div class="p-3 border-l-2 border-purple-500 bg-white/5">
                    <span class="text-[10px] text-white/40">Yesterday</span>
                    <p class="text-sm mt-1">DJ Qter added 5 new tracks to the Sonic Temple.</p>
                </div>
            </div>
        </div>

        <!-- COLUMN 2: NAKAMA CHAT -->
        <div class="glass-panel rounded-xl p-6 flex flex-col">
            <h2 class="text-xl font-bold text-blue-500 uppercase tracking-widest mb-6">Nakama Comms</h2>
            <div class="flex-1 bg-black/20 rounded-lg p-4 mb-4 flex items-center justify-center text-white/30 text-xs">
                -- Secure Channel Established --
            </div>
            <div class="flex gap-2">
                <input type="text" placeholder="Broadcast message..." class="flex-1 bg-white/5 border border-white/10 rounded px-3 py-2 text-sm focus:outline-none focus:border-green-500">
                <button class="bg-green-500 text-black px-4 rounded font-bold hover:bg-green-400">SEND</button>
            </div>
        </div>

    </div>

    <!-- Back to Dashboard -->
    <div class="fixed top-4 left-4">
        <a href="dashboard.html" class="flex items-center gap-2 text-white/50 hover:text-white transition-colors text-xs uppercase tracking-widest">
            <span>&larr; Return to Bridge</span>
        </a>
    </div>

<script src="../js/agents/pusher.js" defer></script>
<script src="../js/agents/helper.js" defer></script>
<script src="../js/agents/global_ticker.js" defer></script>
<script src="../js/agents/network_hub.js" defer></script>

    <script src="../js/agents/tutorial_core.js" defer></script>
    <script src="../js/agents/quest_controller.js" defer></script>
    <script src="../js/agents/visual_integrity.js" defer></script>
    <script src="../js/agents/sound_engineer.js" defer></script>
    <script src="../js/agents/horizon_bar.js" defer></script>
    <script src="../js/agents/social_matrix.js" defer></script>

</body>
</html>
