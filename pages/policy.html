<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Policy - Circle D Flow</title>
    
    <!-- Fonts & Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <style>
        :root {
            --haki-gold: #d4af37;
            --dark-void: #0a0a0a;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--dark-void);
            color: white;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, .cinzel { font-family: 'Cinzel', serif; }
        .gold-glow { text-shadow: 0 0 15px rgba(212,175,55,0.6); }

        /* Ambient Dust */
        .dust-particles {
            position: absolute;
            width: 100%; height: 100%;
            background-image: radial-gradient(circle, rgba(212,175,55,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.3;
            animation: drift 20s linear infinite;
            z-index: 0;
            pointer-events: none;
            top: 0; left: 0;
            position: fixed;
        }
        @keyframes drift {
            from { background-position: 0 0; }
            to { background-position: 100px 100px; }
        }

        /* Burger Menu Styles */
        #burger-btn span {
            transform-origin: center;
        }
    </style>
</head>
<body class="notranslate">

    <div class="dust-particles"></div>

    <!-- Language Selector -->
    <div class="absolute top-6 right-6 z-[100] group font-mono text-sm">
        <button class="bg-[#111] border border-[#d4af37]/50 text-[#d4af37] px-3 py-1 rounded hover:bg-white/10 transition flex items-center gap-1">
            <span id="current-lang-display">DE</span>
            <span class="text-[10px]">▼</span>
        </button>
        <div class="absolute right-0 mt-2 bg-black/90 border border-[#d4af37]/50 rounded shadow-xl hidden group-hover:block w-full text-center divide-y divide-[#d4af37]/20">
            <button onclick="changeLanguage('en')" class="w-full text-gray-400 hover:text-[#d4af37] py-2 hover:bg-white/5 transition block">EN</button>
            <button onclick="changeLanguage('de')" class="w-full text-gray-400 hover:text-[#d4af37] py-2 hover:bg-white/5 transition block">DE</button>
            <button onclick="changeLanguage('fr')" class="w-full text-gray-400 hover:text-[#d4af37] py-2 hover:bg-white/5 transition block">FR</button>
            <button onclick="changeLanguage('pt')" class="w-full text-gray-400 hover:text-[#d4af37] py-2 hover:bg-white/5 transition block">PT</button>
        </div>
    </div>

    <!-- Hamburger Menu Button -->
    <button id="burger-btn" class="absolute top-6 left-6 z-[100] focus:outline-none flex flex-col gap-1.5 p-2 bg-black/50 border border-[#d4af37]/30 rounded hover:bg-[#d4af37]/10 transition">
        <span class="block w-6 h-0.5 bg-[#d4af37] transition-all duration-300"></span>
        <span class="block w-6 h-0.5 bg-[#d4af37] transition-all duration-300"></span>
        <span class="block w-6 h-0.5 bg-[#d4af37] transition-all duration-300"></span>
    </button>

    <!-- Fullscreen Menu Overlay -->
    <div id="mobile-menu" class="fixed inset-0 bg-black/95 z-[90] flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 backdrop-blur-md">
        <nav class="flex flex-col gap-8 text-center">
            <a href="../index.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition gold-glow" data-i18n="nav_orbit">Return to Orbit</a>
            <a href="bantaba.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition gold-glow" data-i18n="nav_guild_board">Guild Board</a>
            <a href="about.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition gold-glow" data-i18n="nav_about">About us</a>
            <a href="policy.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition gold-glow" data-i18n="nav_policy">Policy</a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="relative z-10 flex flex-col items-center justify-center min-h-screen px-6 py-20 text-center">
        <h1 class="text-4xl md:text-5xl cinzel text-[#d4af37] gold-glow mb-8" data-i18n="policy_title">Policy & Privacy</h1>
        <div class="max-w-2xl bg-black/60 p-8 md:p-12 backdrop-blur-md border border-[#d4af37]/30 rounded-lg shadow-2xl">
            <p class="text-gray-300 text-lg leading-relaxed font-light" data-i18n="policy_text">
                We respect your privacy. By using this site, you accept essential cookies and data handling to provide the Bantaba experience.
            </p>
        </div>
        <button class="mt-12 bg-transparent border border-[#d4af37] text-[#d4af37] px-8 py-3 font-mono hover:bg-[#d4af37] hover:text-black transition-all duration-300" onclick="window.location.href='bantaba.html'" data-i18n="btn_back">
            ← Back to Entrance
        </button>
    </div>

    <!-- Scripts -->
    <script src="../js/translations.js"></script>
    <script>
        // Burger Menu Logic
        const burgerBtn = document.getElementById('burger-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const spans = burgerBtn.querySelectorAll('span');
        let menuOpen = false;

        burgerBtn.addEventListener('click', () => {
            menuOpen = !menuOpen;
            if(menuOpen) {
                mobileMenu.classList.remove('opacity-0', 'pointer-events-none');
                spans[0].style.transform = 'translateY(8px) rotate(45deg)';
                spans[1].style.opacity = '0';
                spans[2].style.transform = 'translateY(-8px) rotate(-45deg)';
            } else {
                mobileMenu.classList.add('opacity-0', 'pointer-events-none');
                spans[0].style.transform = 'none';
                spans[1].style.opacity = '1';
                spans[2].style.transform = 'none';
            }
        });

        // Initialize Translations
        applyTranslations();
    </script>
</body>
</html>
