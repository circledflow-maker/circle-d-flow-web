<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AkwabaLX | Secret Garden Kitchen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../css/quest-triad.css">
    <link rel="stylesheet" href="../css/mobile-sphere-nav.css">
    <script src="../js/agents/mobile_sphere_nav.js?v=1.0" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="../js/agents/supabase_client.js?v=4.1"></script>
    <script src="../js/agents/agent.js?v=3.2"></script>
    <script src="../js/agents/pusher.js?v=3.2"></script>
    <script src="../js/agents/flowee.js?v=3.4"></script>
    <script src="../js/data/adinkra_catalog.js?v=1.0"></script>
    <script src="../js/agents/storage_hygiene.js?v=1.0"></script>
    <script src="../js/data/akwaba_kitchen_data.js?v=1.1"></script>
    <script src="../js/agents/flowee_voice.js?v=1.1"></script>
    <script src="../js/agents/flowee_reward.js?v=1.0"></script>
    <script src="../js/agents/kitchen_engine.js?v=1.2"></script>
    <script src="../js/agents/quest_engine.js?v=4.6"></script>
    <script src="../js/agents/flowee_kitchen_tour.js?v=2.0" defer></script>
    <link rel="stylesheet" href="../css/mobile-sphere-nav.css">
    <script src="../js/agents/mobile_sphere_nav.js?v=1.1" defer></script>
    <style>
        :root { --gold:#D4AF37; --sage:#8A9A5B; --terra:#E2725B; }
        body { background:#0a0806; color:#fdfbf7; font-family:'Plus Jakarta Sans',sans-serif; padding-bottom:88px; }
        .cinzel { font-family:'Cinzel',serif; }
        .menu-card { background:rgba(20,15,10,0.9); border:1px solid rgba(212,175,55,0.25); border-radius:12px; overflow:hidden; }
        .menu-card img { width:100%; height:120px; object-fit:cover; }
        #cart-bar { position:fixed; bottom:72px; left:0; right:0; z-index:90; }
        .flowee-tour-highlight { outline:2px solid #00ffcc; box-shadow:0 0 20px rgba(0,255,204,0.4); border-radius:12px; }
        #kitchen-menu-board { border:1px solid rgba(212,175,55,0.35); border-radius:12px; background:rgba(0,0,0,0.35); }
        #kitchen-menu-board img { width:100%; border-radius:12px; display:block; }
        #kitchen-entry-reel { position:fixed; inset:0; z-index:200; background:#0a0806; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        #kitchen-entry-reel.hidden { display:none; }
        #kitchen-entry-reel video { width:100%; max-height:100vh; object-fit:cover; }
        #kitchen-entry-reel .intro-slideshow { position:absolute; inset:0; }
        #kitchen-entry-reel .intro-slideshow img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 1.2s ease; }
        #kitchen-entry-reel .intro-slideshow img.active { opacity:1; }
        #kitchen-entry-reel .intro-vignette { position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 45%, rgba(0,0,0,0.35) 100%); pointer-events:none; }
        #kitchen-entry-reel .intro-brand { position:absolute; top:18%; left:0; right:0; text-align:center; z-index:202; pointer-events:none; }
        #kitchen-entry-reel button { position:absolute; bottom:24px; right:16px; z-index:203; }
    </style>
</head>
<body class="quest-triad-page">
    <div id="kitchen-entry-reel" class="hidden" aria-hidden="true">
        <div id="intro-slideshow" class="intro-slideshow hidden"></div>
        <video id="entry-reel-video" playsinline muted preload="metadata" poster="../Assets/kitchens/akwabalx/hero-1.jpg"></video>
        <div class="intro-vignette"></div>
        <div class="intro-brand">
            <p class="cinzel text-[var(--gold)] text-2xl tracking-widest">AkwabaLX</p>
            <p class="text-[10px] text-[var(--sage)] uppercase tracking-[0.25em] mt-1">Secret Garden LX</p>
        </div>
        <button type="button" onclick="dismissKitchenReel()" class="text-xs px-4 py-2 border border-[var(--gold)] text-[var(--gold)] rounded-full bg-black/70">Enter Kitchen →</button>
    </div>

    <header class="sticky top-0 z-50 bg-black/80 backdrop-blur border-b border-[var(--gold)]/20 px-4 py-3 flex items-center gap-3">
        <img id="kitchen-logo" src="../Assets/kitchens/akwabalx/logo.png" alt="AkwabaLX" class="w-14 h-14 rounded-full object-contain border-2 border-[var(--gold)]/50 bg-black/40 p-1" onerror="this.src='../Assets/kitchens/akwabalx/logo-fallback.png'">
        <div class="flex-1 min-w-0">
            <h1 class="cinzel text-lg text-[var(--gold)] truncate">AkwabaLX</h1>
            <p class="text-[10px] text-[var(--sage)] uppercase tracking-widest truncate">Secret Garden LX</p>
        </div>
        <a href="taste_world_entry.html" class="text-white/40 text-xs">← Taste</a>
    </header>

    <section class="relative">
        <img id="hero-poster" class="w-full max-h-48 object-cover" src="../Assets/kitchens/akwabalx/hero-1.jpg" alt="AkwabaLX at Secret Garden">
        <video id="hero-reel" class="hidden w-full max-h-48 object-cover" muted loop playsinline poster="../Assets/kitchens/akwabalx/hero-1.jpg"></video>
    </section>

    <section class="px-4 py-4">
        <p id="kitchen-tagline" class="text-sm text-white/70 italic mb-4"></p>
        <div class="flex flex-wrap gap-2 mb-4">
            <a href="artist_sanctuary.html" class="text-[10px] px-3 py-1.5 border border-[var(--sage)]/50 rounded-full text-[var(--sage)]">3D Sanctuary</a>
            <a href="quest_map.html?focus=secret_garden_lx" class="text-[10px] px-3 py-1.5 border border-cyan-500/50 rounded-full text-cyan-400">Atlas Pin</a>
            <button type="button" onclick="shareKitchen()" class="text-[10px] px-3 py-1.5 border border-[var(--gold)]/50 rounded-full text-[var(--gold)]">Share WhatsApp</button>
        </div>
        <div class="grid grid-cols-3 gap-2 mb-6" id="gallery-strip"></div>
    </section>

    <section class="px-4 pb-4">
        <h2 class="cinzel text-[var(--gold)] text-sm mb-3 tracking-widest">MENU CARD</h2>
        <div id="kitchen-menu-board" class="mb-6 p-2">
            <img id="menu-board-img" src="../Assets/kitchens/akwabalx/menu-board.jpg" alt="AkwabaLX Menu Card" loading="lazy">
        </div>
        <h2 class="cinzel text-[var(--gold)] text-sm mb-3 tracking-widest">ORDER — PICKUP AT BAR</h2>
        <div id="menu-grid" class="grid gap-3 sm:grid-cols-2"></div>
    </section>

    <section class="px-4 py-4 border-t border-white/10">
        <h2 class="cinzel text-[var(--gold)] text-sm mb-2">NAVIGATOR OFFERS</h2>
        <p id="discount-note" class="text-xs text-[var(--sage)] italic bg-white/5 border border-[var(--sage)]/30 rounded-lg p-3"></p>
    </section>

    <section class="px-4 py-6 border-t border-white/10">
        <h2 class="cinzel text-[var(--gold)] text-sm mb-3">KITCHEN QR</h2>
        <p class="text-xs text-white/50 mb-3">Scan to open menu · Share at events · Link to Secret Garden</p>
        <div class="flex flex-col items-center gap-3">
            <canvas id="kitchen-qr" class="bg-white p-2 rounded"></canvas>
            <button type="button" onclick="downloadQR()" class="text-xs px-4 py-2 border border-[var(--gold)] text-[var(--gold)] rounded">Download QR</button>
        </div>
    </section>

    <div id="cart-bar" class="hidden px-4">
        <div class="bg-black/95 border border-[var(--gold)] rounded-xl p-3 flex items-center justify-between gap-2">
            <span id="cart-summary" class="text-xs text-white/80"></span>
            <button type="button" onclick="placeOrder()" class="bg-[var(--gold)] text-black text-xs font-bold px-4 py-2 rounded">ORDER PICKUP</button>
        </div>
    </div>

    <div id="soul-ticket-modal" class="hidden fixed inset-0 z-[300] bg-black/90 flex items-center justify-center p-4">
        <div class="bg-gradient-to-b from-[#1f1f1f] to-[#0a0806] border border-[var(--gold)]/40 rounded-2xl p-6 max-w-sm w-full text-center">
            <h3 class="cinzel text-[var(--gold)] text-lg mb-1">Soul Ticket</h3>
            <p class="text-[10px] text-white/50 uppercase mb-4">Show at bar when READY</p>
            <div class="bg-white p-2 rounded-lg inline-block mb-3"><img id="guest-ticket-qr" class="w-32 h-32" alt="Ticket QR"></div>
            <p id="guest-ticket-dish" class="font-bold text-[var(--sage)] text-sm mb-2">—</p>
            <p id="guest-ticket-pin" class="font-mono text-[var(--terracotta)] text-lg mb-4">—</p>
            <button type="button" onclick="document.getElementById('soul-ticket-modal').classList.add('hidden')" class="text-xs px-4 py-2 border border-[var(--gold)] text-[var(--gold)] rounded-full">Got it →</button>
        </div>
    </div>

    <div id="flowee-agent" style="position:fixed;bottom:90px;right:12px;z-index:9998;pointer-events:auto"></div>
    <nav class="animus-global-nav">
        <button onclick="location.href='quest_map.html'" class="nav-btn" id="nav-map"><span class="icon">📍</span><span class="nav-label">MAP</span></button>
        <button onclick="location.href='quest_board.html'" class="nav-btn" id="nav-board"><span class="icon">📖</span><span class="nav-label">QUESTS</span></button>
        <button onclick="location.href='hall_of_legends.html'" class="nav-btn" id="nav-bro"><span class="icon">🏛️</span><span class="nav-label">RANK</span></button>
        <button onclick="window.Flowee?.toggleChat()" class="nav-btn" id="nav-comms"><span class="icon">💬</span><span class="nav-label">FLOWEE</span></button>
        <button onclick="location.href='dashboard.html'" class="nav-btn exit"><span class="icon">⚡</span><span class="nav-label">ORBIT</span></button>
    </nav>
    <script src="../js/agents/quest_triad.js?v=2.1" defer></script>

    <script>
        let engine;
        let introSlideTimer = null;

        function dismissKitchenReel() {
            const overlay = document.getElementById('kitchen-entry-reel');
            const vid = document.getElementById('entry-reel-video');
            if (introSlideTimer) { clearInterval(introSlideTimer); introSlideTimer = null; }
            if (vid) { vid.pause(); vid.currentTime = 0; }
            overlay?.classList.add('hidden');
            sessionStorage.setItem('cdf_akwaba_reel_seen', '1');
            initHeroMedia();
        }

        function startIntroSlideshow(images) {
            const wrap = document.getElementById('intro-slideshow');
            const vid = document.getElementById('entry-reel-video');
            if (!wrap || !images.length) return;
            vid?.classList.add('hidden');
            wrap.classList.remove('hidden');
            wrap.innerHTML = images.map((src, i) =>
                `<img src="${src}" alt="AkwabaLX" class="${i === 0 ? 'active' : ''}" loading="eager">`
            ).join('');
            const slides = wrap.querySelectorAll('img');
            let idx = 0;
            introSlideTimer = setInterval(() => {
                slides[idx]?.classList.remove('active');
                idx = (idx + 1) % slides.length;
                slides[idx]?.classList.add('active');
            }, 2800);
        }

        function initHeroMedia() {
            const reelUrl = engine?.kitchen?.reel || window.AKWABA_KITCHEN?.reel;
            const poster = engine?.kitchen?.cover || window.AKWABA_KITCHEN?.cover || '../Assets/kitchens/akwabalx/hero-1.jpg';
            const heroImg = document.getElementById('hero-poster');
            const heroVid = document.getElementById('hero-reel');
            if (!reelUrl || !heroVid) return;
            heroVid.src = reelUrl;
            heroVid.oncanplay = () => {
                heroImg?.classList.add('hidden');
                heroVid.classList.remove('hidden');
                heroVid.play().catch(() => {});
            };
            heroVid.onerror = () => {
                if (heroImg) { heroImg.src = poster; heroImg.classList.remove('hidden'); }
                heroVid.classList.add('hidden');
            };
            heroVid.load();
        }

        function playKitchenEntryReel() {
            if (sessionStorage.getItem('cdf_akwaba_reel_seen') === '1') return;
            const overlay = document.getElementById('kitchen-entry-reel');
            const vid = document.getElementById('entry-reel-video');
            if (!overlay) return;
            const gallery = engine?.kitchen?.gallery || window.AKWABA_KITCHEN?.gallery || [];
            const reelUrl = engine?.kitchen?.reel || window.AKWABA_KITCHEN?.reel;
            overlay.classList.remove('hidden');

            const showSlides = () => startIntroSlideshow(gallery.length ? gallery : [
                '../Assets/kitchens/akwabalx/hero-1.jpg',
                '../Assets/kitchens/akwabalx/hero-2.jpg',
                '../Assets/kitchens/akwabalx/hero-3.jpg',
            ]);

            if (!vid || !reelUrl) {
                showSlides();
                return;
            }

            let started = false;
            const fallbackTimer = setTimeout(() => { if (!started) showSlides(); }, 1800);

            vid.onerror = () => { clearTimeout(fallbackTimer); showSlides(); };
            vid.onplaying = () => { started = true; clearTimeout(fallbackTimer); document.getElementById('intro-slideshow')?.classList.add('hidden'); vid.classList.remove('hidden'); };
            vid.onended = () => dismissKitchenReel();

            vid.src = reelUrl;
            vid.muted = false;
            vid.currentTime = 0;
            vid.play().catch(() => {
                vid.muted = true;
                vid.play().catch(() => { clearTimeout(fallbackTimer); showSlides(); });
            });
        }

        function shareKitchen() {
            const url = 'https://circle-d-flow-web.vercel.app/pages/akwaba_kitchen';
            const text = encodeURIComponent('AkwabaLX at Secret Garden LX — taste the flow! ' + url);
            window.open('https://wa.me/?text=' + text, '_blank');
        }
        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';
            engine.menu.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'menu-card';
                card.innerHTML = `
                    ${item.image ? `<img src="${item.image}" alt="${item.name}" loading="lazy">` : ''}
                    <div class="p-3">
                        <div class="flex justify-between gap-2">
                            <strong class="text-sm">${item.name}</strong>
                            <span class="text-[var(--gold)] text-sm">€${item.price_eur.toFixed(2)}</span>
                        </div>
                        <p class="text-[10px] text-white/50 mt-1">${item.description || ''}</p>
                        <button type="button" class="mt-2 w-full text-xs py-2 border border-[var(--sage)]/60 text-[var(--sage)] rounded" data-id="${item.id}">+ ADD PICKUP</button>
                    </div>`;
                card.querySelector('button').onclick = () => engine.addToCart(item.id);
                grid.appendChild(card);
            });
        }
        function updateCart() {
            const bar = document.getElementById('cart-bar');
            if (!engine.cart.length) { bar.classList.add('hidden'); return; }
            bar.classList.remove('hidden');
            document.getElementById('cart-summary').textContent = `${engine.cart.length} item(s) · €${engine.cartTotal().toFixed(2)}`;
        }
        function showSoulTicket(order) {
            if (!order) return;
            const items = Array.isArray(order.items) ? order.items : [];
            const title = items.map((i) => i.name).join(', ') || 'Pickup';
            const pin = 'AKW-' + String(order.id || Date.now()).replace(/-/g, '').slice(0, 6).toUpperCase();
            const qr = JSON.stringify({ kitchen: 'akwabalx', order: order.id, pin });
            document.getElementById('guest-ticket-dish').textContent = title;
            document.getElementById('guest-ticket-pin').textContent = pin;
            document.getElementById('guest-ticket-qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(qr)}`;
            document.getElementById('soul-ticket-modal').classList.remove('hidden');
            localStorage.setItem('cdf_last_soul_order', JSON.stringify(order));
        }

        async function placeOrder() {
            const note = prompt('Pickup name or note (optional):') || '';
            const order = await engine.placeOrder(note);
            updateCart();
            if (order) showSoulTicket(order);
        }
        function downloadQR() {
            const c = document.getElementById('kitchen-qr');
            const link = document.createElement('a');
            link.download = 'AkwabaLX-QR.png';
            link.href = c.toDataURL('image/png');
            link.click();
            if (window.QuestEngine) window.QuestEngine.fulfillTasteQuest('LQ-T03');
        }
        window.addEventListener('KITCHEN_CART_UPDATED', updateCart);
        document.addEventListener('DOMContentLoaded', async () => {
            engine = window.KitchenEngine;
            await engine.load('akwabalx');
            const k = engine.kitchen;
            const logo = document.getElementById('kitchen-logo');
            if (logo && k.logo) logo.src = k.logo;
            const board = document.getElementById('menu-board-img');
            if (board) board.src = k.menu_board || window.AKWABA_KITCHEN.menu_board;
            document.getElementById('kitchen-tagline').textContent = k.tagline || window.AKWABA_KITCHEN.tagline;
            playKitchenEntryReel();
            initHeroMedia();
            const disc = document.getElementById('discount-note');
            if (disc) disc.textContent = k.discount_note || window.AKWABA_KITCHEN.discount_note || 'Navigator discounts coming soon — collect Akoma rune for early access.';
            const gal = document.getElementById('gallery-strip');
            (k.gallery || window.AKWABA_KITCHEN.gallery).slice(0, 6).forEach((src) => {
                const img = document.createElement('img');
                img.src = src;
                img.className = 'rounded-lg h-16 w-full object-cover border border-white/10';
                gal.appendChild(img);
            });
            renderMenu();
            updateCart();
            engine.subscribeMenuRealtime(() => { renderMenu(); if (window.Flowee) window.Flowee.talk(true, 'Menu updated live from kitchen.', 'guide'); });
            const qrUrl = 'https://circle-d-flow-web.vercel.app/pages/akwaba_kitchen';
            try {
                if (window.QRCode) QRCode.toCanvas(document.getElementById('kitchen-qr'), qrUrl, { width: 160, margin: 1 });
            } catch (e) { console.warn('[Kitchen] QR render skipped', e); }
            if (window.Flowee) window.Flowee.renderVessel();
            const runTutorial = () => {
                if (!window.QuestEngine?.profile) return;
                const tut = new URLSearchParams(location.search).get('tutorial');
                window.QuestEngine.fulfillTasteQuest('LQ-T01');
                if (tut) window.QuestEngine.acceptQuest(tut);
            };
            if (window.QuestEngine?.profile) runTutorial();
            else window.addEventListener('PROFILE_UPDATED', runTutorial, { once: true });
            if (new URLSearchParams(location.search).get('soul_ticket')) {
                try { showSoulTicket(JSON.parse(localStorage.getItem('cdf_last_soul_order'))); } catch (_) {}
            }
        });
    </script>
</body>
</html>
