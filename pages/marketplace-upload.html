<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Upload your offering to the Circle Marketplace. Share your talent with our growing community.">
    <meta property="og:title" content="Circle D Flow | Marketplace Upload">
    <meta property="og:description" content="Upload your offering to the Circle Marketplace. Share your talent with our growing community.">
    <meta property="og:type" content="website">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Listing | Circle D Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../css/styles.css">
    
    <style>
        /* ANCIENT PARCHMENT & BENIN VIBE */
        body {
            background: #08040a url('../benin_bg.png') no-repeat center center fixed;
            background-size: cover;
            color: #3E2723;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(18, 8, 24, 0.4) 0%, rgba(0, 0, 0, 0.9) 100%);
            z-index: -1;
        }

        .parchment-scroll {
            background: #f4e4bc url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.8),
                inset 0 0 100px rgba(139, 69, 19, 0.2);
            border: 20px solid transparent;
            border-image: url('https://www.transparenttextures.com/patterns/dark-matter.png') 30 round;
            position: relative;
            color: #3E2723;
            border-radius: 4px;
        }

        /* 3-COLUMN HEADER SYNC */
        .horizon-bar {
            display: grid !important;
            grid-template-columns: 1fr 2fr 1fr !important;
            align-items: center;
            padding: 0 30px;
            background: rgba(18, 8, 24, 0.95);
            border-bottom: 1px solid rgba(255, 174, 66, 0.3);
            z-index: 100;
            height: 64px;
            position: fixed; top: 0; left: 0; width: 100%;
        }
        .header-section { display: flex; align-items: center; }
        .header-left { justify-content: flex-start; }
        .header-center { justify-content: center; }
        .header-right { justify-content: flex-end; gap: 15px; }

        input, textarea, select {
            background: rgba(139, 69, 19, 0.05) !important;
            border: 1px solid rgba(139, 69, 19, 0.3) !important;
            color: #3E2723 !important;
            border-radius: 0px !important;
            border-bottom: 2px solid #8B4513 !important;
        }
        
        .profile-upload-circle {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 3px solid #8B4513;
            overflow: hidden;
            background: #D7CCC8;
            cursor: pointer;
            margin: 0 auto 20px;
            position: relative;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>

<body class="min-h-screen relative overflow-x-hidden">

    <!-- Mobile Header & Burger Menu -->
    <div class="fixed top-6 left-6 z-[100]">
        <button id="burger-btn" class="w-10 h-10 flex flex-col justify-center items-center gap-1.5 bg-black border border-[#d4af37]/50 rounded cursor-pointer z-[101]">
            <span class="w-6 h-0.5 bg-[#d4af37] transition-all duration-300"></span>
            <span class="w-6 h-0.5 bg-[#d4af37] transition-all duration-300"></span>
            <span class="w-6 h-0.5 bg-[#d4af37] transition-all duration-300"></span>
        </button>
    </div>

    <!-- Fullscreen Mobile Menu Overlay -->
    <div id="mobile-menu" class="fixed inset-0 bg-black/95 z-[90] opacity-0 pointer-events-none transition-opacity duration-300 flex flex-col items-center justify-center">
        <nav class="flex flex-col gap-6 text-center">
            <a href="../index.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition">Zum Orbit</a>
            <a href="bantaba.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition">Nach Bantaba</a>
            <a href="about.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition">About Us</a>
            <a href="portfolio_anime_reality.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition">Portfolio</a>
            <a href="heart.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition">Heart</a>
            <a href="luvo.html" class="cinzel text-2xl text-white hover:text-[#d4af37] transition">Luvo</a>
        </nav>
    </div>


    <!-- NAV (Synchronized Horizon Bar) -->
    <header class="fixed top-0 w-full z-[100] h-16 grid grid-cols-[1fr_2fr_1fr] items-center px-8 bg-black/90 border-b border-[#FFAE42]/20 backdrop-blur-md">
        <div class="flex justify-start">
            <a href="marketplace.html" class="flex items-center gap-2 text-[#FFAE42]/70 hover:text-[#FFAE42] transition-colors group">
                <span class="material-symbols-outlined text-sm group-hover:-translate-x-1 transition-transform">arrow_back</span>
                <span class="text-[10px] font-bold uppercase tracking-widest">Back to Village</span>
            </a>
        </div>

        <div class="flex justify-center">
            <h1 class="font-cinzel font-bold text-lg tracking-[0.4em] text-[#FFAE42] drop-shadow-lg">THE FORGE</h1>
        </div>

        <div class="flex justify-end gap-4 items-center">
            <a href="marketplace-stall.html" class="px-4 py-1.5 border border-[#FFAE42]/50 text-[#FFAE42] text-[10px] font-bold uppercase rounded hover:bg-[#FFAE42] hover:text-black transition-all flex items-center gap-2">
                <span class="material-symbols-outlined text-sm">storefront</span> MY STALL
            </a>
            <a href="dashboard.html" class="px-4 py-1.5 bg-[#FFAE42] text-black text-[10px] font-bold uppercase rounded hover:bg-white transition-all">ORBIT</a>
        </div>
    </header>

    <main class="w-full h-screen pt-16 flex items-center justify-center p-6 z-10 relative">
        <!-- PARCHMENT SCROLL HORIZONTAL -->
        <div class="parchment-scroll w-full max-w-7xl h-full max-h-[85vh] p-8 flex flex-col md:flex-row gap-8 overflow-y-auto md:overflow-hidden">
            
            <!-- LEFT COLUMN: Identity & Settings -->
            <div class="w-full md:w-1/4 flex flex-col border-b md:border-b-0 md:border-r border-[#8B4513]/20 pb-6 md:pb-0 md:pr-6 shrink-0">
                <h1 class="text-3xl font-cinzel font-bold mb-1 text-[#3E2723] text-center">The Forge</h1>
                <p class="text-[#3E2723]/60 mb-6 text-center font-serif italic text-xs">"Declare your offering."</p>

                <div class="text-center mb-8">
                    <div class="profile-upload-circle mx-auto mb-4 pointer-events-none" style="cursor: default; border-color: #FFAE42;">
                        <img id="profile-preview" class="w-full h-full object-cover hidden">
                        <div class="absolute inset-0 flex items-center justify-center bg-black/40">
                            <span class="material-symbols-outlined text-white/50">verified_user</span>
                        </div>
                    </div>
                    <div id="seller-name-badge" class="inline-flex items-center gap-2 px-4 py-2 bg-[#8B4513]/10 border border-[#FFAE42]/30 rounded-full mt-2 shadow-[0_0_15px_rgba(255,174,66,0.1)]">
                        <span class="material-symbols-outlined text-[#FFAE42] text-sm">workspace_premium</span>
                        <span id="seller-name-display" class="font-cinzel font-bold text-[#3E2723]">Verifying Identity...</span>
                    </div>
                    <input type="hidden" id="seller-name" value="">
                    <p class="text-[9px] uppercase tracking-widest text-[#8B4513] mt-2">Verified Merchant Identity</p>
                </div>

                <div class="flex-grow"></div>

                <!-- Type Selector Column -->
                <div class="flex flex-col gap-3">
                    <label class="text-[9px] uppercase font-bold text-[#8B4513]/50 tracking-widest mb-1">Listing Type</label>
                    <label class="cursor-pointer">
                        <input type="radio" name="listing_type" value="manual" class="peer sr-only" checked onchange="toggleLinkField()">
                        <div class="p-3 rounded bg-black/5 border border-[#8B4513]/30 peer-checked:border-[#8B4513] peer-checked:bg-[#8B4513]/10 transition-all flex items-center gap-3">
                            <span class="material-symbols-outlined text-xl text-[#8B4513]">handshake</span>
                            <span class="font-bold text-xs uppercase text-[#8B4513]">Deal</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="listing_type" value="external" class="peer sr-only" onchange="toggleLinkField()">
                        <div class="p-3 rounded bg-black/5 border border-[#8B4513]/30 peer-checked:border-[#8B4513] peer-checked:bg-[#8B4513]/10 transition-all flex items-center gap-3">
                            <span class="material-symbols-outlined text-xl text-[#8B4513]">link</span>
                            <span class="font-bold text-xs uppercase text-[#8B4513]">Link</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="listing_type" value="service" class="peer sr-only" onchange="toggleLinkField()">
                        <div class="p-3 rounded bg-black/5 border border-[#8B4513]/30 peer-checked:border-[#8B4513] peer-checked:bg-[#8B4513]/10 transition-all flex items-center gap-3">
                            <span class="material-symbols-outlined text-xl text-[#8B4513]">settings_accessibility</span>
                            <span class="font-bold text-xs uppercase text-[#8B4513]">Skill</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- CENTER & RIGHT: Artifact Form -->
            <form id="upload-form" class="w-full md:w-3/4 flex flex-col md:flex-row gap-8">
                
                <!-- CENTER COLUMN: Image Upload -->
                <div class="w-full md:w-1/2 h-64 md:h-full relative flex flex-col shrink-0">
                    <div class="w-full h-full bg-black/5 rounded border-2 border-dashed border-[#8B4513]/30 flex flex-col items-center justify-center overflow-hidden relative cursor-pointer hover:bg-black/10 transition-colors"
                         onclick="document.getElementById('image-upload').click()">
                        <img id="preview-img" class="absolute inset-0 w-full h-full object-contain bg-black/90 hidden z-10">
                        <div class="text-center p-4 z-0 bg-black/40 rounded-xl px-6 py-8 backdrop-blur-sm shadow-2xl border border-white/10" id="upload-hint">
                            <span class="material-symbols-outlined text-[#FFAE42] text-6xl mb-4 drop-shadow-[0_0_15px_rgba(255,174,66,0.6)]">add_a_photo</span>
                            <p class="text-sm uppercase font-bold text-[#FFAE42] tracking-widest drop-shadow-md">Upload Visual</p>
                        </div>
                        <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="handleImage(this)">
                    </div>
                </div>

                <!-- RIGHT COLUMN: Details & Submit -->
                <div class="w-full md:w-1/2 flex flex-col h-full space-y-5">
                    <div class="relative">
                        <label class="text-[9px] uppercase font-bold text-[#8B4513]/50 absolute -top-2 left-2 bg-[#f4e4bc] px-1">Artifact Title</label>
                        <input type="text" name="title" required placeholder="E.g. Royal Benin Bronze" class="w-full px-4 py-3 outline-none font-serif text-lg bg-transparent">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="relative">
                            <label class="text-[9px] uppercase font-bold text-[#8B4513]/50 absolute -top-2 left-2 bg-[#f4e4bc] px-1">Guild Sector</label>
                            <select name="category" class="w-full px-4 py-3 outline-none text-sm appearance-none bg-transparent">
                                <option value="Arts">Arts (Visuals)</option>
                                <option value="Sounds">Sounds (Audio)</option>
                                <option value="Skills">Skills (Services)</option>
                                <option value="Products">Products (Physical)</option>
                                <option value="Healing">Healing (Wellness)</option>
                            </select>
                        </div>
                        <div class="relative">
                            <label class="text-[9px] uppercase font-bold text-[#8B4513]/50 absolute -top-2 left-2 bg-[#f4e4bc] px-1 z-10 flex justify-between w-[calc(100%-16px)]">
                                <span>Price (FC)</span>
                                <span id="fiat-preview" class="text-green-700 font-mono">~ 0.00 €</span>
                            </label>
                            <input type="number" id="price_flow" name="price_flow" required placeholder="1000" class="w-full px-4 py-3 outline-none font-mono font-bold pt-5 bg-transparent">
                        </div>
                    </div>

                    <div class="relative flex-grow flex flex-col min-h-[150px]">
                        <label class="text-[9px] uppercase font-bold text-[#8B4513]/50 absolute -top-2 left-2 bg-[#f4e4bc] px-1">Description</label>
                        <textarea name="description" required placeholder="Describe the essence of this offering..." class="w-full px-4 py-3 outline-none font-serif italic flex-grow resize-none bg-transparent"></textarea>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full py-4 mt-auto bg-[#3E2723] hover:bg-black text-[#FFAE42] font-cinzel font-bold text-xl rounded shadow-2xl transition-all flex items-center justify-center gap-3 shrink-0 group">
                        <span class="material-symbols-outlined group-hover:scale-125 transition-transform">seal</span>
                        INSCRIBE IN LEDGER
                    </button>
                    <p class="text-center text-[8px] uppercase tracking-[0.3em] text-[#8B4513]/40 mt-1 shrink-0">The Grand Bazaar Protocol v4.5</p>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/agents/supabase_client.js?v=3.2"></script>
    
    <script>
        let currentUser = null;

        // 1. LOAD PROFILE DATA
        async function loadProfile() {
            if(!window.supabaseClient) return;
            const { data: { user } } = await window.supabaseClient.auth.getUser();
            if(!user) return;
            currentUser = user;

            const { data: profile } = await window.supabaseClient
                .from('profiles')
                .select('full_name, avatar_url')
                .eq('id', user.id)
                .single();

            if(profile) {
                document.getElementById('seller-name').value = profile.full_name || "";
                if(document.getElementById('seller-name-display')) {
                    document.getElementById('seller-name-display').innerText = profile.full_name || "Unknown Merchant";
                }
                if(profile.avatar_url) {
                    const img = document.getElementById('profile-preview');
                    img.src = profile.avatar_url;
                    img.classList.remove('hidden');
                }
            }
        }

        function handleImage(input) {
            const preview = document.getElementById('preview-img');
            const hint = document.getElementById('upload-hint');
            if(input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    if(hint) hint.classList.add('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function handleProfileImage(input) {
            if(!input.files || !input.files[0] || !currentUser) return;
            const file = input.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `avatars/${currentUser.id}_${Date.now()}.${fileExt}`;
            
            try {
                const { data, error } = await window.supabaseClient.storage
                    .from('artifact-visuals')
                    .upload(fileName, file);

                if(error) {
                    console.warn("Avatar upload blocked by RLS. Falling back to local base64.");
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        document.getElementById('profile-preview').src = e.target.result;
                        document.getElementById('profile-preview').classList.remove('hidden');
                        try {
                            await window.supabaseClient.from('profiles').update({ avatar_url: e.target.result }).eq('id', currentUser.id);
                        } catch(err) {}
                    }
                    reader.readAsDataURL(file);
                    return;
                }

                const { data: { publicUrl } } = window.supabaseClient.storage
                    .from('artifact-visuals')
                    .getPublicUrl(fileName);

                document.getElementById('profile-preview').src = publicUrl;
                document.getElementById('profile-preview').classList.remove('hidden');
                
                // Update profile immediately
                await window.supabaseClient.from('profiles')
                    .update({ avatar_url: publicUrl })
                    .eq('id', currentUser.id);

            } catch(e) { alert("Error updating avatar: " + e.message); }
        }

        // 3. FORM SUBMISSION
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = "FORGING...";
            btn.disabled = true;

            try {
                const formData = new FormData(e.target);
                const sellerName = document.getElementById('seller-name').value;
                const fileInput = document.getElementById('image-upload');
                const file = fileInput.files[0];
                let imageUrl = null;

                // A. Update Profile Name if changed
                await window.supabaseClient.from('profiles')
                    .update({ full_name: sellerName })
                    .eq('id', currentUser.id);

                // B. Upload Product Image
                if(file) {
                    const fileName = `listings/${currentUser.id}_${Date.now()}.jpg`;
                    const { data, error } = await window.supabaseClient.storage
                        .from('artifact-visuals')
                        .upload(fileName, file);
                    if(error) {
                        console.warn("Image upload blocked by RLS. Falling back to local Base64.");
                        imageUrl = document.getElementById('preview-img').src;
                    } else {
                        const { data: { publicUrl } } = window.supabaseClient.storage
                            .from('artifact-visuals')
                            .getPublicUrl(fileName);
                        imageUrl = publicUrl;
                    }
                }

                // C. Insert Artifact
                const newItem = {
                    creator_id: currentUser ? currentUser.id : 'local-test-id',
                    title: formData.get('title'),
                    description: formData.get('description'),
                    guild_category: formData.get('category'),
                    price_credits: parseInt(formData.get('price_flow')),
                    price_fiat: (parseInt(formData.get('price_flow')) / 100).toFixed(2),
                    image_url: imageUrl || document.getElementById('preview-img').src, // Use base64 if no URL
                    is_active: true
                };

                let dbError = null;
                try {
                    const { error } = await window.supabaseClient.from('market_items').insert([newItem]);
                    dbError = error;
                } catch(e) { dbError = e; }

                if(dbError) {
                    console.warn("Supabase failed, falling back to local storage.", dbError);
                    let offlineItems = JSON.parse(localStorage.getItem('cqr_offline_items') || '[]');
                    newItem.id = 'local_' + Date.now();
                    offlineItems.unshift(newItem);
                    localStorage.setItem('cqr_offline_items', JSON.stringify(offlineItems));
                }

                alert("ARTIFACT SEALED. Es liegt nun in deinem Shop!");
                window.location.href = 'marketplace.html';

            } catch(err) { 
                alert("Forge Error: " + err.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // 4. PRICE CONVERSION LOGIC
        document.getElementById('price_flow').addEventListener('input', (e) => {
            const fc = parseInt(e.target.value) || 0;
            const eur = (fc / 100).toFixed(2);
            document.getElementById('fiat-preview').innerText = `~ ${eur} €`;
        });

        window.addEventListener('load', loadProfile);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        if(window.innerWidth < 768) {
            new Swiper(".uploadSwiper", {
                slidesPerView: 1,
                spaceBetween: 30,
                pagination: { el: ".swiper-pagination", clickable: true }
            });
        }
    </script>
</body>
</html>
