<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Upload your offering to the Circle Marketplace. Share your talent with our growing community.">
    <meta property="og:title" content="Circle D Flow | Marketplace Upload">
    <meta property="og:description" content="Upload your offering to the Circle Marketplace. Share your talent with our growing community.">
    <meta property="og:type" content="website">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Listing | Circle D Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../css/styles.css">
    
    <style>
        /* PERGAMENT STYLES */
        body {
            background-color: #0F0A13; /* Void Background */
            background-image: url('https://www.transparenttextures.com/patterns/black-scales.png');
            color: white;
        }
        
        .pergament-scroll {
            background-color: #FDFBF7;
            background-image: url("https://www.transparenttextures.com/patterns/aged-paper.png");
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border-radius: 2px;
            border: 1px solid #D7CCC8;
            transform: rotate(-0.5deg);
            color: #3E2723;
        }
        
        .pergament-scroll::before, .pergament-scroll::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 24px;
            background: linear-gradient(to bottom, #8D6E63, #5D4037);
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            border-radius: 4px;
            z-index: 10;
        }
        
        .pergament-scroll::before { top: -12px; }
        .pergament-scroll::after { bottom: -12px; }

        .horizon-bar {
            /* Fallback/Local def if styles.css fails */
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 1200px;
            height: 60px;
            background: rgba(15, 10, 19, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 50;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        
        /* Form Overrides for Parchment */
        .pergament-scroll input, .pergament-scroll textarea, .pergament-scroll select {
            color: #3E2723 !important;
            border-color: #A1887F !important;
        }
        .pergament-scroll input::placeholder, .pergament-scroll textarea::placeholder {
            color: #8D6E63 !important;
        }
    </style>
</head>

<body class="bg-[#0F0A13] min-h-screen relative overflow-x-hidden selection:bg-electric selection:text-white">

    <!-- HEADER (Horizon Bar) -->
    <header class="horizon-bar">
        <div class="flex items-center gap-4">
            <a href="../index.html" class="flex items-center gap-2 group">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-gold to-amber-700 border border-gold/30 flex items-center justify-center group-hover:scale-110 transition-transform">
                    <span class="material-symbols-outlined text-black text-sm font-bold">token</span>
                </div>
                <span class="font-cinzel font-bold text-lg tracking-widest text-[#FFD700] group-hover:text-white transition-colors">GRAND BAZAAR</span>
            </a>
        </div>

        <div class="flex items-center gap-6">
            <a href="marketplace.html" class="flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-mist hover:text-white transition-colors">
                <span class="material-symbols-outlined text-base">storefront</span>
                <span>Back to Market</span>
            </a>
        </div>
    </header>

    <main class="pt-32 pb-20 px-6 max-w-2xl mx-auto z-10 relative">
        <!-- PERGAMENT SCROLL CONTAINER -->
        <div class="pergament-scroll p-8 relative">
            <div class="absolute -top-4 left-1/2 -translate-x-1/2 w-32 h-8 bg-[#8B4513] rounded shadow-lg flex items-center justify-center border-2 border-[#D2691E] z-20">
                 <span class="text-[#FFD700] font-cinzel font-bold text-xs tracking-widest">IMPERIAL DECREE</span>
            </div>

            <h1 class="text-4xl font-cinzel font-bold mb-2 text-[#3E2723] text-center mt-4">List Your Flow</h1>
            <p class="text-[#5D4037] mb-8 text-center font-serif italic">"By the seal of the Guilds, declare your offering to the Kingdom."</p>

            <form id="upload-form" class="space-y-6">

                <!-- Type Selector -->
                <div class="grid grid-cols-3 gap-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="listing_type" value="manual" class="peer sr-only" checked onchange="toggleLinkField()">
                        <div class="p-4 rounded bg-[#EFEBE9] border-2 border-[#D7CCC8] peer-checked:border-[#8B4513] peer-checked:bg-[#D7CCC8] transition-all text-center h-full flex flex-col justify-center shadow-inner hover:shadow-md">
                            <span class="material-symbols-outlined text-2xl mb-2 text-[#5D4037]">handshake</span>
                            <p class="font-bold text-sm text-[#3E2723]">Deal</p>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="listing_type" value="external" class="peer sr-only" onchange="toggleLinkField()">
                        <div class="p-4 rounded bg-[#EFEBE9] border-2 border-[#D7CCC8] peer-checked:border-[#8B4513] peer-checked:bg-[#D7CCC8] transition-all text-center h-full flex flex-col justify-center shadow-inner hover:shadow-md">
                            <span class="material-symbols-outlined text-2xl mb-2 text-[#5D4037]">link</span>
                            <p class="font-bold text-sm text-[#3E2723]">Link</p>
                        </div>
                    </label>
                    <!-- DRIVER OPTION -->
                    <label class="cursor-pointer" id="driver-option">
                        <input type="radio" name="listing_type" value="service_fleet" class="peer sr-only" onchange="toggleLinkField()">
                        <div class="p-4 rounded bg-[#EFEBE9] border-2 border-[#D7CCC8] peer-checked:border-green-700 peer-checked:bg-green-100 peer-hover:bg-[#D7CCC8] transition-all text-center h-full flex flex-col justify-center relative overflow-hidden group shadow-inner hover:shadow-md">
                            <span class="material-symbols-outlined text-2xl mb-2 text-green-700">rickshaw</span>
                            <p class="font-bold text-sm text-green-800">TukTuk</p>
                            <div class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity" id="driver-lock-overlay">
                                 <span class="material-symbols-outlined text-xs mb-1 text-white">lock</span>
                                 <span class="text-[8px] uppercase text-white">Verify First</span>
                            </div>
                        </div>
                    </label>
                </div>

                <!-- Basic Info -->
                <div class="space-y-4">
                    <input type="text" name="title" required placeholder="Item Title" class="w-full bg-[#EFEBE9] border border-[#A1887F] rounded px-4 py-3 focus:border-[#5D4037] outline-none text-[#3E2723] placeholder-[#8D6E63] shadow-inner font-serif">

                    <div class="grid grid-cols-2 gap-4" id="price-container">
                        <div class="relative">
                            <span class="absolute left-3 top-3 text-[#5D4037]">€</span>
                            <input type="number" name="price_eur" id="input-eur" placeholder="Price (EUR)" step="0.01" class="w-full bg-[#EFEBE9] border border-[#A1887F] rounded pl-8 pr-4 py-3 focus:border-[#5D4037] outline-none text-[#3E2723] placeholder-[#8D6E63] shadow-inner font-mono font-bold font-mono" oninput="calculateFlow()">
                        </div>
                        <div class="relative">
                            <span class="absolute left-3 top-3 text-[#FF6F00] text-xs pt-1 font-bold">Flow</span>
                            <input type="number" name="price" id="input-flow" required placeholder="Credits" class="w-full bg-[#EFEBE9] border border-[#A1887F] rounded pl-12 pr-4 py-3 focus:border-[#5D4037] outline-none text-[#3E2723] placeholder-[#8D6E63] shadow-inner font-mono font-bold font-mono">
                        </div>
                    </div>
                    
                     <div class="relative group">
                        <div class="w-full h-32 bg-[#D7CCC8] rounded border-2 border-dashed border-[#8D6E63] flex items-center justify-center overflow-hidden relative cursor-pointer hover:bg-[#BCAAA4] transition-colors"
                             onclick="document.getElementById('image-upload').click()">
                            <img id="preview-img" class="absolute inset-0 w-full h-full object-cover hidden">
                            <div class="text-center p-4">
                                <span class="material-symbols-outlined text-[#5D4037] text-3xl mb-1">add_a_photo</span>
                                <p class="text-xs text-[#5D4037]">Upload Artifact Visual</p>
                            </div>
                            <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="handleImage(this)">
                        </div>
                    </div>

                    <textarea name="description" rows="4" required placeholder="Description..." class="w-full bg-[#EFEBE9] border border-[#A1887F] rounded px-4 py-3 focus:border-[#5D4037] outline-none text-[#3E2723] placeholder-[#8D6E63] shadow-inner font-serif"></textarea>

                    <!-- TUKTUK SPECIFIC FIELDS -->
                    <div id="tuktuk-fields" class="hidden space-y-4 p-4 bg-green-900/10 border border-green-700/30 rounded">
                        <p class="text-xs font-bold uppercase text-green-800 tracking-widest border-b border-green-800/20 pb-1 mb-2">Fleet Operations Data</p>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-[10px] uppercase text-green-900 mb-1 block font-bold">Service Mode</label>
                                <select name="service_mode" class="w-full bg-[#EFEBE9] border border-green-700/30 rounded p-2 text-sm focus:border-green-700 outline-none text-[#3E2723]">
                                    <option value="live">Live Hail (Now)</option>
                                    <option value="calendar">Calendar Booking</option>
                                    <option value="hybrid">Hybrid (Both)</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] uppercase text-green-900 mb-1 block font-bold">Vehicle Class</label>
                                <select name="vehicle_type" class="w-full bg-[#EFEBE9] border border-green-700/30 rounded p-2 text-sm focus:border-green-700 outline-none text-[#3E2723]">
                                    <option value="classic">Classic TukTuk</option>
                                    <option value="electric">E-Tuk (Eco Boost)</option>
                                    <option value="van">Imperial Van</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="text-[10px] uppercase text-green-900 mb-1 block font-bold">Primary Zone</label>
                            <select name="zone" class="w-full bg-[#EFEBE9] border border-green-700/30 rounded p-2 text-sm focus:border-green-700 outline-none text-[#3E2723]">
                                <option value="Alfama">Alfama (The Old Quarter)</option>
                                <option value="Baixa">Baixa (The Grid)</option>
                                <option value="Bairro Alto">Bairro Alto (The Heights)</option>
                                <option value="Belem">Belem (The Harbor)</option>
                                <option value="Expo">Expo (The Future)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Dynamic Link Field -->
                <div id="external-link-field" class="hidden">
                    <input type="url" name="external_url" placeholder="https://" class="w-full bg-[#EFEBE9] border border-[#A1887F] rounded px-4 py-3 focus:border-[#5D4037] outline-none text-[#3E2723] placeholder-[#8D6E63] shadow-inner">
                </div>
                
                 <!-- Owner Info -->
                <div class="p-4 bg-[#8D6E63]/10 rounded-xl space-y-4 border border-[#8D6E63]/20">
                    <p class="text-xs font-bold uppercase text-[#8B4513] tracking-widest">Seller Requirement</p>
                    <input type="email" name="owner_email" placeholder="Your Email (for notifications)" class="w-full bg-[#EFEBE9] border border-[#A1887F] rounded px-4 py-3 focus:border-[#5D4037] outline-none text-[#3E2723] placeholder-[#8D6E63] shadow-inner font-serif">
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full py-4 bg-[#8B4513] hover:bg-[#5D4037] text-[#FFD700] font-cinzel font-bold text-lg rounded shadow-[0_4px_0_#3E2723] active:shadow-none active:translate-y-[4px] transition-all flex items-center justify-center gap-2 border border-[#3E2723]">
                    <span class="material-symbols-outlined">edit_square</span>
                    Inscribe
                </button>
                
                <p class="text-center text-[10px] uppercase tracking-widest text-[#8D6E63] mt-4">
                    Seal of the Guilds Required
                </p>

            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/compressorjs@1.2.1/dist/compressor.min.js"></script>
    <script>
        const isMuseum = window.location.search.includes('legacy=true');
        
        // FORM HANDLER
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            // Basic Logic Stub
            const msg = isMuseum ? "Artifact Inscribed." : "Listing Published.";
            alert(msg);
            
            if(window.Gamification) {
                window.Gamification.addXP(50, 'Market Listing');
            }
            
            window.location.href = isMuseum ? 'services-community.html' : 'marketplace.html';
        });

        // Price Calc
        function calculateFlow() {
            const eur = document.getElementById('input-eur').value;
            const flow = document.getElementById('input-flow');
            if (eur) flow.value = Math.round(eur * 13);
        }

        // Image Preview
        function handleImage(input) {
            const preview = document.getElementById('preview-img');
            if(input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
             setTimeout(() => {
                 if(window.FleetAgent && window.FleetAgent.isDriver()) {
                     const overlay = document.getElementById('driver-lock-overlay');
                     if(overlay) overlay.style.display = 'none';
                 }
             }, 500);
        });

        // Toggle Logic Update
        function toggleLinkField() {
            if (isMuseum) return;
            const types = document.getElementsByName('listing_type');
            let selected;
            for (const t of types) if (t.checked) selected = t.value;

            const externalField = document.getElementById('external-link-field');
            const tuktukFields = document.getElementById('tuktuk-fields');

            externalField.classList.add('hidden');
            externalField.querySelector('input').removeAttribute('required');
            tuktukFields.classList.add('hidden');

            if (selected === 'external') {
                externalField.classList.remove('hidden');
                externalField.querySelector('input').setAttribute('required', 'true');
            }

            if(selected === 'service_fleet') {
                if(window.FleetAgent && !window.FleetAgent.isDriver()) {
                    triggerVerificationFlow();
                    types[0].checked = true; 
                    return;
                }
                tuktukFields.classList.remove('hidden');
                const titleInput = document.querySelector('input[name="title"]');
                if(!titleInput.value) titleInput.value = "Imperial TukTuk Service";
                const descInput = document.querySelector('textarea[name="description"]');
                if(!descInput.value) descInput.value = "Official transport service. Available for Tours and Fast-Travel.";
            }
        }

        function triggerVerificationFlow() {
            if(confirm("🏴 IMPERIAL FLEET REGISTRY\n\nTo list as a TukTuk Driver, you must verify your vehicle with the CQR Seal.\n\nUpload Photo now?")) {
                const input = document.getElementById('image-upload');
                input.click();
                
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    if(file) {
                        alert("Analyzing Seal Pattern... Please wait.");
                        if(window.FleetAgent) await window.FleetAgent.verifyDriver(file);
                        alert("✅ VERIFICATION SUCCESSFUL\n\nWelcome to the Fleet, Captain. You may now list your services.");
                        location.reload();
                    }
                };
            }
        }
    </script>
    
    <!-- AGENTS -->
    <div id="flowee-agent" class="fixed bottom-8 left-8 z-50 flex flex-col items-center group cursor-pointer"></div>
    <script src='../js/agents/pusher.js' defer></script>
    <script src='../js/agents/helper.js' defer></script>
    <script src="../js/agents/fleet_agent.js"></script>
    <script src="../js/agents/imperial_hud.js" defer></script>
</body>
</html>
