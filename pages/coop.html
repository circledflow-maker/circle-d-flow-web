<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co-Op Terminal | Circle D Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Cinzel:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#8A2BE2", "hologram": "#00FFFF" },
                    fontFamily: {
                        "display": ["Cinzel", "serif"],
                        "body": ["Plus Jakarta Sans", "sans-serif"],
                        "mono": ["Space Mono", "monospace"]
                    }
                }
            }
        }
    </script>
    <style>
        /* Page Transition */
        body { opacity: 0; animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#050406] text-white min-h-screen font-body">

    <!-- HORIZON BAR -->
    <div id="horizon-bar-root"></div>

    <!-- BEAM MENU (Dropdown) -->
    <div id="beam-menu" class="hidden absolute top-20 right-4 z-50 bg-[#0F0A13] border border-white/10 rounded-xl shadow-2xl p-2 w-48 backdrop-blur-xl animate-fade-in-up">
        <div class="text-[10px] text-white/30 uppercase tracking-widest px-2 py-1 mb-1 font-mono">Beam To</div>
        <a href="vault_space.html" class="block px-3 py-2 rounded hover:bg-white/5 text-sm text-white/80 hover:text-white transition-colors flex items-center gap-2"><span class="material-symbols-outlined text-xs">hub</span> Vault Space</a>
        <a href="chat.html" class="block px-3 py-2 rounded hover:bg-white/5 text-sm text-white/80 hover:text-white transition-colors flex items-center gap-2"><span class="material-symbols-outlined text-xs">chat</span> The Source</a>
        <a href="dashboard.html" class="block px-3 py-2 rounded hover:bg-white/5 text-sm text-white/80 hover:text-white transition-colors flex items-center gap-2"><span class="material-symbols-outlined text-xs">dashboard</span> Dashboard</a>
        <div class="h-px bg-white/5 my-1"></div>
        <button onclick="window.history.back()" class="w-full text-left px-3 py-2 rounded hover:bg-white/5 text-sm text-white/50 hover:text-white transition-colors flex items-center gap-2"><span class="material-symbols-outlined text-xs">arrow_back</span> Return</button>
    </div>

    <!-- BEAM TRIGGER (Mobile/Desktop) -->
    <button class="fixed top-24 right-6 z-40 w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-orange-400 hover:text-orange-300 transition-colors border border-orange-500/20" onclick="document.getElementById('beam-menu').classList.toggle('hidden')">
        <span class="material-symbols-outlined">grid_view</span>
    </button>

    <main class="relative z-10 pt-32 pb-20 px-4 max-w-7xl mx-auto">
        
        <!-- HEADER -->
        <div class="text-center mb-16 relative">
            <div class="absolute inset-0 bg-orange-500/10 blur-[100px] rounded-full pointer-events-none"></div>
            <h1 class="text-4xl md:text-6xl font-display font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 via-white to-orange-400 mb-4 drop-shadow-[0_0_20px_rgba(249,115,22,0.8)]">
                KARMA EXCHANGE
            </h1>
            <p class="text-orange-300/60 font-mono text-sm tracking-widest uppercase">"Find your Flow. Serve the Circle."</p>
        </div>

        <!-- ACTIONS & TABS -->
        <div class="flex flex-col items-center gap-6 mb-12">
            
            <div class="flex gap-4">
                <a href="quest-create.html" class="px-8 py-3 bg-orange-600 hover:bg-orange-500 text-black font-bold uppercase tracking-widest rounded-lg transition-all shadow-[0_0_20px_rgba(249,115,22,0.6)] flex items-center gap-2 clip-ninja">
                    <span class="material-symbols-outlined">auto_fix</span>
                    Manifest Quest
                </a>
                <button class="px-8 py-3 bg-white/5 border border-white/10 hover:bg-white/10 text-white font-bold uppercase tracking-widest rounded-lg transition-all flex items-center gap-2" onclick="window.CoopAgent.refreshLobbies()">
                    <span class="material-symbols-outlined">refresh</span>
                    Refresh
                </button>
            </div>

            <!-- TABS -->
            <div class="flex gap-2 p-1 bg-white/5 rounded-full backdrop-blur-md border border-white/10">
                <button class="px-6 py-2 rounded-full bg-orange-500 text-black font-bold text-xs uppercase transition-colors" onclick="window.CoopAgent.switchTab('available')">Flowing</button>
                <button class="px-6 py-2 rounded-full hover:bg-white/10 text-white/50 hover:text-white font-bold text-xs uppercase transition-colors" onclick="window.CoopAgent.switchTab('mine')">My Path</button>
                <button class="px-6 py-2 rounded-full hover:bg-white/10 text-white/50 hover:text-white font-bold text-xs uppercase transition-colors" onclick="window.CoopAgent.switchTab('log')">The Archives</button>
            </div>

        </div>

        <!-- LOBBY LIST -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="lobby-grid">
            <!-- INJECTED BY AGENT -->
            <div class="col-span-full text-center py-20 border border-dashed border-white/10 rounded-2xl bg-white/5">
                <span class="material-symbols-outlined text-5xl text-white/20 mb-4 animate-spin-slow">radar</span>
                <p class="text-white/40 font-mono">Scanning for Open Frequencies...</p>
            </div>
        </div>

    </main>

    <!-- AGENTS -->
    <script src="../js/agents/imperial_hud.js"></script>
    <script src="../js/agents/pusher.js"></script>
    <script src="../js/agents/helper.js"></script>
    <script src="../js/agents/network_hub.js"></script>
    <script src="../js/agents/global_ticker.js"></script>
    
    <!-- COOP AGENT -->
    <script src="../js/agents/coop_agent.js"></script>

</body>
</html>
