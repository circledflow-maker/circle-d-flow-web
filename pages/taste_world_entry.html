<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle D Flow - Taste World Gateway</title>
    <script src="https://cdn.tailwindcss.com" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {
            background-color: #050505;
            color: #fff;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: radial-gradient(circle at center, rgba(212, 175, 55, 0.1) 0%, transparent 60%);
        }
        .cinzel { font-family: 'Cinzel', serif; }
        .text-glow { text-shadow: 0 0 15px rgba(212, 175, 55, 0.8); }
        .fade-in { animation: fadeIn 2s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .path-btn { position: relative; overflow: hidden; }
        .path-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .path-btn:hover::before { left: 100%; }
    </style>
    <script src="../js/data/taste_world_i18n.js?v=1.0" defer></script>
    <script src="../js/agents/flowee.js?v=5.0" defer></script>
    <script src="../js/agents/flowee_kitchen_tour.js?v=3.0" defer></script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 relative">

    <button onclick="window.history.back()" class="absolute top-6 left-6 text-white/50 hover:text-[#d4af37] transition flex items-center gap-2">
        <span class="material-symbols-outlined">arrow_back</span>
        <span class="text-xs uppercase tracking-widest font-bold" data-tw-i18n="tw.entry.return">Zurück</span>
    </button>
    <div id="tw-lang-switch" class="absolute top-6 right-6"></div>

    <div class="max-w-md w-full text-center fade-in opacity-0" style="animation-delay: 0.5s;">
        <div class="w-24 h-24 mx-auto mb-8 rounded-full border-2 border-[#00ffcc] shadow-[0_0_30px_rgba(0,255,204,0.4)] overflow-hidden flex items-center justify-center bg-black">
            <img src="../Assets/images/logo.png" class="w-16 h-16 rounded-full animate-pulse" alt="Flowee">
        </div>

        <h1 class="text-3xl cinzel font-bold text-[#d4af37] text-glow mb-6 uppercase tracking-widest" data-tw-i18n="tw.entry.title">Die Taste World</h1>

        <div class="bg-black/60 border border-[#00ffcc]/30 rounded-xl p-6 mb-10 text-left relative">
            <span class="material-symbols-outlined absolute -top-4 -left-4 text-3xl text-[#00ffcc] bg-black rounded-full">psychiatry</span>
            <p class="text-white/80 italic font-serif leading-relaxed text-sm md:text-base" data-tw-i18n="tw.entry.quote">
                Ich spüre das tiefe Aroma der Schöpfung…
            </p>
        </div>

        <div class="flex flex-col gap-4 w-full">
            <button onclick="window.location.href='kitchen_command.html'" class="path-btn w-full py-4 bg-gradient-to-r from-[#d4af37]/20 to-black border border-[#d4af37] rounded-lg flex items-center justify-between px-6 hover:bg-[#d4af37]/40 transition">
                <div class="text-left">
                    <h3 class="font-bold text-[#d4af37] uppercase tracking-widest text-sm" data-tw-i18n="tw.entry.creator">Der Küchen-Schöpfer</h3>
                    <p class="text-[10px] text-white/50 uppercase tracking-widest mt-1" data-tw-i18n="tw.entry.creator.sub">Creator Workspace</p>
                </div>
                <span class="material-symbols-outlined text-[#d4af37]">cookie</span>
            </button>

            <button onclick="window.location.href='taste_world_hub.html'" class="path-btn w-full py-4 bg-gradient-to-r from-[#00ffcc]/20 to-black border border-[#00ffcc] rounded-lg flex items-center justify-between px-6 hover:bg-[#00ffcc]/40 transition">
                <div class="text-left">
                    <h3 class="font-bold text-[#00ffcc] uppercase tracking-widest text-sm" data-tw-i18n="tw.entry.guest">Der Genießer</h3>
                    <p class="text-[10px] text-white/50 uppercase tracking-widest mt-1" data-tw-i18n="tw.entry.guest.sub">Gast-Erlebnis</p>
                </div>
                <span class="material-symbols-outlined text-[#00ffcc]">restaurant</span>
            </button>
        </div>
    </div>

    <script defer>
        document.addEventListener('DOMContentLoaded', () => {
            window.TasteI18n?.renderLangSwitcher('tw-lang-switch');
            window.TasteI18n?.apply();
            if (window.Flowee) window.Flowee.renderVessel?.();
        });
    </script>
</body>
</html>
