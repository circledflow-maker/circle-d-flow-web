<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architect's Command Core | Circle D Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="../css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        midnight: '#050505',
                        glass: 'rgba(20, 20, 30, 0.6)',
                        neonBlue: '#00F0FF',
                        neonPink: '#FF0055',
                        gold: '#FFD700',
                    },
                    fontFamily: {
                        palace: ['"Cinzel"', 'serif'],
                        tech: ['"Orbitron"', 'sans-serif'],
                    },
                    backgroundImage: {
                        'lisbon-skyline': "url('../Assets/images/lisbon_skyline_manga.jpg')", // Placeholder
                    }
                }
            }
        }
    </script>
    <style>
        /* Palace Aesthetics */
        body {
            background-color: #000;
            overflow-x: hidden;
        }

        /* Stained Glass Floor Effect */
        #stained-glass-floor {
            position: fixed;
            bottom: -50%;
            left: 50%;
            transform: translateX(-50%) rotateX(60deg);
            width: 200vw;
            height: 200vw;
            background: radial-gradient(circle, rgba(0,240,255,0.1) 0%, rgba(0,0,0,0.8) 70%),
                        repeating-conic-gradient(#00F0FF 0deg 10deg, transparent 10deg 20deg);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
            animation: rotateFloor 120s linear infinite;
        }

        @keyframes rotateFloor {
            from { transform: translateX(-50%) rotateX(60deg) rotateZ(0deg); }
            to { transform: translateX(-50%) rotateX(60deg) rotateZ(360deg); }
        }

        /* Dark Glass UI */
        .glass-panel {
            background: rgba(10, 10, 15, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
        }

        /* Falling Light Particles */
        .light-mote {
            position: absolute;
            background: white;
            border-radius: 50%;
            filter: blur(2px);
            animation: fall linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(100vh); opacity: 0; }
        }
        
        /* Map Customization */
        .leaflet-container {
            background: rgba(0,0,0,0.5);
            font-family: 'Orbitron', sans-serif;
        }
        .leaflet-tile {
            filter: invert(100%) hue-rotate(180deg) brightness(0.3) contrast(1.5);
        }

    </style>
</head>
<body class="text-white min-h-screen relative">

    <!-- Background Layer -->
    <div class="fixed inset-0 bg-lisbon-skyline bg-cover bg-center opacity-30 z-[-1]"></div>
    <div id="stained-glass-floor"></div>
    <div id="particle-container" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- Header / HUD -->
    <nav class="fixed top-0 w-full z-50 p-6 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-full border-2 border-gold p-1">
                <img src="../Assets/images/logo.png" class="w-full h-full object-contain">
            </div>
            <div>
                <h1 class="font-palace text-2xl font-bold text-gold tracking-widest drop-shadow-[0_0_10px_rgba(255,215,0,0.5)]">Architect's Palace</h1>
                <p class="font-tech text-[10px] text-neonBlue tracking-[0.3em]">COMMAND CORE ONLINE</p>
            </div>
        </div>
        
        <div class="flex gap-6">
            <button onclick="GrandArchitect.toggleView('clean')" class="flex items-center gap-2 px-4 py-2 border border-neonBlue/30 hover:border-neonBlue rounded bg-black/50 text-xs font-tech uppercase tracking-widest transition-all hover:shadow-[0_0_15px_rgba(0,240,255,0.4)]">
                <span class="material-symbols-outlined text-sm">monitor_heart</span> Investor Mirror
            </button>
            <a href="sanctum.html" class="flex items-center gap-2 px-4 py-2 border border-neonPink/30 hover:border-neonPink rounded bg-black/50 text-xs font-tech uppercase tracking-widest transition-all hover:shadow-[0_0_15px_rgba(255,0,85,0.4)]">
                <span class="material-symbols-outlined text-sm">sensor_door</span> Exit Palace
            </a>
        </div>
    </nav>

    <!-- Main Command Grid -->
    <main class="relative z-10 pt-32 px-12 pb-12 w-full h-screen flex gap-8">
        
        <!-- Left: Resonance Map (World View) -->
        <section class="glass-panel w-2/3 rounded-3xl overflow-hidden relative group flex flex-col">
            <div class="p-6 border-b border-white/5 flex justify-between items-center bg-black/20">
                <h2 class="font-palace text-xl text-white tracking-widest"><span class="material-symbols-outlined align-middle mr-2 text-neonBlue">public</span> Resonance Web</h2>
                <div class="flex gap-2">
                     <span class="flex h-2 w-2 rounded-full bg-neonBlue animate-pulse"></span>
                     <span class="text-[10px] font-tech text-white/50">LIVE SIGNAL</span>
                </div>
            </div>
            
            <div id="resonance-map" class="flex-1 w-full h-full z-0"></div>
            
            <!-- Map Overlay Controls -->
            <div class="absolute bottom-6 left-6 right-6 flex justify-between pointer-events-none">
                <div class="pointer-events-auto bg-black/80 backdrop-blur rounded-xl p-4 border border-white/10">
                    <h3 class="text-xs font-bold text-neonBlue mb-2">Active Nodes</h3>
                    <ul id="active-nodes-list" class="space-y-1 text-[10px] text-white/70">
                        <!-- Populated by JS -->
                    </ul>
                </div>
                <div class="pointer-events-auto">
                     <button onclick="GrandArchitect.pulse()" class="px-6 py-4 bg-neonBlue/10 hover:bg-neonBlue/20 border border-neonBlue text-neonBlue font-tech font-bold uppercase rounded-xl tracking-widest transition-all hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(0,240,255,0.2)]">
                        <span class="material-symbols-outlined text-xl mb-1 block">wifi_tethering</span>
                        Pulse Kingdom
                    </button>
                </div>
            </div>
        </section>

        <!-- Right: Service Altar & Analytics -->
        <section class="flex-1 flex flex-col gap-6">
            
            <!-- Service Altar -->
            <div class="glass-panel flex-1 rounded-3xl p-6 relative overflow-hidden">
                <div class="absolute top-0 right-0 p-4 opacity-20">
                    <span class="material-symbols-outlined text-9xl text-gold">auto_awesome</span>
                </div>
                <h2 class="font-palace text-xl text-gold tracking-widest mb-6 relative z-10"><span class="material-symbols-outlined align-middle mr-2">diamond</span> Service Altar</h2>
                
                <div class="grid grid-cols-1 gap-4 relative z-10">
                    <button onclick="GrandArchitect.summonArtist()" class="p-6 bg-gradient-to-br from-purple-900/40 to-black border border-purple-500/30 hover:border-purple-500 rounded-2xl text-left group transition-all">
                        <span class="material-symbols-outlined text-4xl text-purple-400 mb-2 group-hover:scale-110 transition-transform">person_add</span>
                        <h3 class="font-palace font-bold text-white text-lg">Cast Summon</h3>
                        <p class="text-[10px] text-white/50 font-tech mt-1">Invoke a Creator for a KYH Session</p>
                    </button>
                    
                    <button onclick="GrandArchitect.reforgeBrand()" class="p-6 bg-gradient-to-br from-neonPink/20 to-black border border-neonPink/30 hover:border-neonPink rounded-2xl text-left group transition-all">
                        <span class="material-symbols-outlined text-4xl text-neonPink mb-2 group-hover:scale-110 transition-transform">style</span>
                        <h3 class="font-palace font-bold text-white text-lg">Reforge Brand</h3>
                        <p class="text-[10px] text-white/50 font-tech mt-1">Upgrade a Partner's Visual Legacy</p>
                    </button>
                </div>
            </div>

            <!-- Synergy Radar -->
            <div class="glass-panel h-1/3 rounded-3xl p-6 flex flex-col">
                <h2 class="font-tech text-xs text-neonBlue tracking-widest mb-4">SYNERGY SCANNER</h2>
                <div class="flex-1 flex items-center justify-center relative">
                    <!-- Radar Animation -->
                    <div class="absolute inset-0 border border-green-500/20 rounded-full animate-[spin_4s_linear_infinite]"></div>
                    <div class="absolute inset-2 border border-green-500/10 rounded-full animate-[spin_3s_linear_infinite_reverse]"></div>
                    <div class="flex flex-col items-center">
                         <span class="text-2xl font-bold text-white">98%</span>
                         <span class="text-[10px] text-green-400 uppercase">Flow Efficiency</span>
                    </div>
                </div>
            </div>

        </section>

    </main>

    <!-- Flowee Overlay (The Royal Advisor) -->
    <div id="flowee-royal" class="fixed bottom-8 right-8 z-50 pointer-events-none">
        <!-- Rendered by flowee.js interactively -->
    </div>

    <!-- Scripts -->
    <script src="../js/master_dashboard.js"></script>
    <script src="../js/agents/visual_eye.js"></script>
    <script src="../js/agents/helper.js"></script>
    <script src="../js/agents/bridge_pusher.js"></script>
    <script src="../js/agents/flowee.js"></script>
    <script>
        // Particle Init
        const container = document.getElementById('particle-container');
        for(let i=0; i<50; i++) {
            const p = document.createElement('div');
            p.className = 'light-mote';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.top = -10 + 'px';
            p.style.width = Math.random() * 3 + 'px';
            p.style.height = p.style.width;
            p.style.animationDuration = (Math.random() * 5 + 5) + 's';
            p.style.animationDelay = Math.random() * 5 + 's';
            container.appendChild(p);
        }
    </script>
    <div id="flowee-agent" class="fixed bottom-8 left-8 z-50 flex flex-col items-center group cursor-pointer"></div>
</body>
</html>
