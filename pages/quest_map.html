    <style>
        /* Togo / West African Aesthetic Base */
        :root {
            --color-terracotta: #E2725B;
            --color-gold: #D4AF37;
            --color-charcoal: #1A1A1A;
            --color-sand: #E6C280;
        }
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: var(--color-charcoal);
            font-family: 'Courier New', Courier, monospace;
        }

        body.quest-map-page main#main-content {
            position: relative;
            width: 100%;
            height: 100dvh;
            height: -webkit-fill-available;
            overflow: hidden;
        }

        /* Map Container with Sepia/Terracotta Filter */
        #quest-map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            filter: sepia(60%) hue-rotate(340deg) contrast(120%);
            background: #000;
        }

        /* Floating Action Buttons (FABs) */
        .fab {
            position: absolute;
            background: rgba(26, 26, 26, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid var(--color-gold);
            color: var(--color-sand);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .fab:hover {
            background: rgba(212, 175, 55, 0.2);
            transform: scale(1.05);
        }
        
        .fab-text {
            border-radius: 8px;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 0.9em;
        }

        /* The Floating Soul Avatar */
        @keyframes floatPulse {
            0% { transform: translate(-50%, -50%) translateY(0px) scale(0.9); opacity: 0.8; box-shadow: 0 0 10px 2px var(--color-gold); }
            100% { transform: translate(-50%, -50%) translateY(-10px) scale(1.1); opacity: 1; box-shadow: 0 0 25px 8px var(--color-sand); }
        }

        .soul-orb {
            width: 24px;
            height: 24px;
            background: radial-gradient(circle, var(--color-sand) 0%, var(--color-gold) 40%, transparent 100%);
            border-radius: 50%;
            animation: floatPulse 2s infinite alternate ease-in-out;
            position: absolute;
        }

        /* Mission Marker Animations */
        @keyframes missionPulse {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; filter: drop-shadow(0 0 10px var(--color-terracotta)); }
            100% { transform: scale(1); opacity: 0.7; }
        }
        
        .mission-marker-active svg {
            animation: missionPulse 1.5s infinite;
        }

        /* Legend & Modals (Adinkra inspired borders) */
        .adinkra-panel {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid var(--color-terracotta);
            border-radius: 4px;
            color: var(--color-sand);
            box-shadow: 0 0 20px rgba(226, 114, 91, 0.2);
            /* Pseudo-elements for corners */
            position: relative;
        }
        .adinkra-panel::before, .adinkra-panel::after {
            content: ''; position: absolute; width: 10px; height: 10px; border: 2px solid var(--color-gold);
        }
        .adinkra-panel::before { top: -4px; left: -4px; border-right: none; border-bottom: none; }
        .adinkra-panel::after { bottom: -4px; right: -4px; border-left: none; border-top: none; }

        /* UI Overlays */
        #hud-top {
            position: absolute; top: 118px; left: 20px; right: 20px; z-index: 1000;
            pointer-events: none;
        }
        
        #legend-panel {
            position: absolute; top: 200px; left: 20px; z-index: 1000;
            width: 200px; padding: 15px; display: none; pointer-events: auto;
        }
        
        @media (max-width: 768px) {
            #legend-panel { top: auto; bottom: 150px; left: 10px; right: 10px; width: auto; }
            .animus-global-nav { bottom: 20px !important; transform: translateX(-50%); width: 95%; max-width: 400px; justify-content: space-between; padding: 10px 5px !important; gap: 2px !important; }
            .animus-global-nav .nav-btn { min-width: unset; font-size: 0.55em; padding: 5px; }
            .animus-global-nav .nav-btn .icon { font-size: 1.5em; margin-bottom: 4px; }
        }

        /* Map marker touch targets + screen reader labels */
        .leaflet-marker-icon.custom-soul-wrapper,
        .leaflet-marker-icon.custom-mission-wrapper,
        .leaflet-marker-icon.atlas-venue-pin,
        .leaflet-marker-icon.atlas-quest-pin {
            min-width: 44px !important;
            min-height: 44px !important;
            display: flex !important;
            align-items: center;
            justify-content: center;
        }
        /* HUD readability on map */
        #hud-top h2 { text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
        #hud-top .adinkra-panel { color: var(--color-sand); }
        #map-search-input::placeholder { color: rgba(230, 194, 128, 0.55); }
        .fab-text { color: #fff !important; text-shadow: 0 1px 3px rgba(0,0,0,0.8); font-size: 0.75em; letter-spacing: 0.04em; }
        #legend-panel { color: var(--color-sand); }
        #legend-panel li { color: var(--color-sand); }
        #map-search-input { min-height: 44px; }
        .fab { min-width: 44px; min-height: 44px; }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function initQuestMap() {
        if (!window.L) { console.error('[Atlas] Leaflet failed to load'); return; }

        function bindMapMarkerA11y(marker, label) {
            marker.on('add', function () {
                const el = this.getElement?.() || this._icon;
                if (!el) return;
                el.setAttribute('role', 'button');
                el.setAttribute('aria-label', label);
                el.setAttribute('tabindex', '0');
            });
        }

        // --- 1. CORE VARIABLES ---
        window.map = L.map('quest-map', {zoomControl: false}).setView([38.7223, -9.1393], 13);
        const map = window.map;
        
        // CartoDB Dark Matter Base (1x tiles — faster on mobile)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20,
            detectRetina: false,
            updateWhenIdle: true,
            keepBuffer: 2
        }).addTo(map);

        let userMarker = null;
        let activeMissions = []; // Holds data from DB
        let missionMarkers = {}; // Stores leaflet marker objects

        // --- 2. HAVERSINE DISTANCE CALCULATOR ---
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Earth radius in meters
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c; // Distance in meters
        }

        // --- 3. GEOLOCATION & THE FLOATING SOUL ---
        const soulIcon = L.divIcon({
            className: 'custom-soul-wrapper',
            html: '<div class="soul-orb"></div>',
            iconSize: [0, 0] // Centered perfectly on coords
        });

        // Initialize geolocation watcher
        let firstLocate = true;
        map.locate({watch: true, setView: false, enableHighAccuracy: true});

        map.on('locationfound', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            if (userMarker) {
                userMarker.setLatLng(e.latlng);
            } else {
                userMarker = L.marker(e.latlng, { icon: soulIcon, zIndexOffset: 1000 }).addTo(map);
                bindMapMarkerA11y(userMarker, 'Your navigator position on the map');
            }

            if(firstLocate) {
                map.flyTo(e.latlng, 16, {duration: 1.5});
                firstLocate = false;
            }

            // CHECK PROXIMITY TO MISSIONS
            checkMissionProximity(lat, lng);
            if (window.AtlasEngine) window.AtlasEngine.onPosition(lat, lng);
            if (window.QuestEngine) window.QuestEngine.checkActiveQuestsGPS(lat, lng);
        });

        map.on('locationerror', function(e) {
            console.warn("GPS Error:", e.message);
        });

        function centerOnUser() {
            if(userMarker) {
                map.flyTo(userMarker.getLatLng(), 16, {duration: 1.0});
            } else {
                map.locate({setView: true, maxZoom: 16});
            }
        }

        // --- 4. DYNAMIC MISSIONS & FLOW AREAS ---
        async function loadFlowAreas() {
            try {
                if(!window.supabaseClient) return;
                const { data: areas, error: areaErr } = await window.supabaseClient.from('flow_areas').select('*');
                if(areaErr) {
                    console.warn("Table flow_areas not found or RLS error. Proceeding silently.", areaErr);
                }
                
                const { data: quests, error: questErr } = await window.supabaseClient.from('user_quests').select('*');
                if(questErr) {
                    console.warn("Table user_quests not found or RLS error.", questErr);
                }

                let allMarkers = [];
                if(areas) allMarkers = allMarkers.concat(areas.filter(a => a.lat && a.lng));
                if(quests) {
                    const eventMarkers = quests.filter(q => q.latitude && q.longitude).map(q => ({
                        id: q.id,
                        name: q.title || 'Unknown Event',
                        description: q.description || '',
                        lat: q.latitude,
                        lng: q.longitude,
                        isEvent: true,
                        creator_id: q.user_id,
                        image_url: q.image_url || null
                    }));
                    allMarkers = allMarkers.concat(eventMarkers);
                }
                
                activeMissions = allMarkers;
                
                // --- AKADEMIE MANGAS INJECTION REMOVED ---
                
                // Render initial state
                activeMissions.forEach(area => {
                    // Adinkra Style Icon SVG
                    let iconHtml = '';
                    if (area.isAkademie) {
                        iconHtml = `
                            <svg width="40" height="40" viewBox="0 0 100 100" fill="none" stroke="#00f0ff" stroke-width="4" style="background:rgba(26,26,26,0.9); border-radius:10%; box-shadow:0 0 15px rgba(0,240,255,0.5);">
                                <rect x="20" y="10" width="60" height="80" rx="5" />
                                <line x1="30" y1="30" x2="70" y2="30" />
                                <line x1="30" y1="50" x2="70" y2="50" />
                                <line x1="30" y1="70" x2="50" y2="70" />
                            </svg>
                        `;
                    } else if (area.isEvent) {
                        // Event Marker (Diamond / Star shape)
                        let color = "#d4af37";
                        iconHtml = `
                            <svg width="40" height="40" viewBox="0 0 100 100" fill="none" stroke="${color}" stroke-width="4" style="background:rgba(26,26,26,0.9); border-radius:50%; box-shadow:0 0 15px ${color}80;">
                                <circle cx="50" cy="50" r="40" />
                                <polygon points="50,15 60,40 85,40 65,55 75,80 50,65 25,80 35,55 15,40 40,40" fill="${color}" />
                            </svg>
                        `;
                    } else {
                        // Default flow area icon
                        let color = "#E2725B";
                        let inner = `<circle cx="50" cy="50" r="15" fill="#D4AF37" stroke="none"/>`;
                        
                        if (area.guild_category) {
                            switch(area.guild_category) {
                                case 'arts': color = '#FF00FF'; inner = `<path d="M 30 70 L 50 30 L 70 70 Z" fill="${color}" />`; break; // Triangle
                                case 'skills': color = '#FFAE42'; inner = `<rect x="35" y="35" width="30" height="30" fill="${color}" />`; break; // Square
                                case 'sounds': color = '#00f0ff'; inner = `<path d="M 40 40 A 10 10 0 0 1 60 40 A 10 10 0 0 1 40 40 Z" fill="${color}" /><path d="M 30 60 Q 50 20 70 60" stroke="${color}" stroke-width="4" fill="none"/>`; break; // Music-ish
                                case 'healing': color = '#00FF00'; inner = `<path d="M 45 35 L 55 35 L 55 45 L 65 45 L 65 55 L 55 55 L 55 65 L 45 65 L 45 55 L 35 55 L 35 45 L 45 45 Z" fill="${color}" />`; break; // Cross
                                case 'products': color = '#FFFF00'; inner = `<polygon points="50,25 75,75 25,75" fill="${color}" />`; break;
                                case 'services': color = '#FFFFFF'; inner = `<circle cx="50" cy="50" r="15" fill="${color}" />`; break;
                                case 'taste': color = '#ff6b6b'; inner = `<path d="M 30 40 Q 50 70 70 40" stroke="${color}" stroke-width="6" fill="none"/><line x1="50" y1="70" x2="50" y2="90" stroke="${color}" stroke-width="4"/><line x1="30" y1="90" x2="70" y2="90" stroke="${color}" stroke-width="4"/>`; break; // Cup/Chalice
                            }
                        }

                        iconHtml = `
                            <svg width="40" height="40" viewBox="0 0 100 100" fill="none" stroke="${color}" stroke-width="4" style="background:rgba(26,26,26,0.9); border-radius:50%; box-shadow:0 0 15px ${color}80;">
                                <circle cx="50" cy="50" r="40" />
                                <path d="M 50 10 L 50 90 M 10 50 L 90 50" />
                                ${inner}
                            </svg>
                        `;
                    }
                    
                    const icon = L.divIcon({
                        className: 'custom-mission-wrapper',
                        html: iconHtml,
                        iconSize: [40, 40],
                        iconAnchor: [20, 20]
                    });
                    
                    const marker = L.marker([area.lat, area.lng], { icon: icon }).addTo(map);
                    bindMapMarkerA11y(marker, `Mission beacon: ${area.name || 'Unknown'}`);
                    missionMarkers[area.id] = { marker: marker, data: area };
                    
                    if (area.isAkademie) {
                        marker.bindPopup(`
                            <div class="atlas-popup-card">
                                <h3 class="atlas-popup-title" style="color:#66eeff !important">${area.name}</h3>
                                <p class="atlas-popup-desc">Pages/Files: ${area.scan_count}</p>
                                <a href="akademie.html" class="atlas-popup-btn atlas-popup-btn-primary" style="background:#00f0ff;color:#000">📖 READ IN AKADEMIE</a>
                            </div>
                        `, { className: 'atlas-popup', maxWidth: 300 });
                    } else {
                        updatePopupContent(area.id, false, 999); // Initial closed state
                    }
                });
                
            } catch(e) {
                console.error("Failed to load Flow Areas:", e);
            }
            
                  }

        function checkMissionProximity(userLat, userLng) {
            activeMissions.forEach(mission => {
                const distance = calculateDistance(userLat, userLng, mission.lat, mission.lng);
                const isNear = distance <= 50; // 50 meters trigger
                
                if (!mission.isAkademie) {
                    updatePopupContent(mission.id, isNear, distance);
                }
                
                // Toggle pulsing animation class
                const mObj = missionMarkers[mission.id];
                if(mObj && mObj.marker._icon) {
                    if(isNear) {
                        mObj.marker._icon.classList.add('mission-marker-active');
                    } else {
                        mObj.marker._icon.classList.remove('mission-marker-active');
                    }
                }
            });
        }

        function updatePopupContent(missionId, isNear, distanceMeters) {
            const mObj = missionMarkers[missionId];
            if(!mObj) return;
            
            const area = mObj.data;
            const imgHtml = area.image_url ? `<img src="${area.image_url}" style="width:100%; height:100px; object-fit:cover; margin-bottom:10px; border:1px solid var(--color-gold); border-radius:4px;">` : '';
            
            let actionHtml = '';
            if(area.isEvent) {
                actionHtml = `<a href="create_impact.html?id=${area.id}" style="display:block; padding:10px; background:var(--color-gold); color:#000; text-decoration:none; font-weight:bold; border-radius:4px; margin-top:15px; animation: floatPulse 2s infinite alternate;">🎫 GO TO EVENT IMPACT</a>`;
            } else if(isNear) {
                actionHtml = `<a href="flow_area_scan.html?id=${area.id}" style="display:block; padding:10px; background:var(--color-gold); color:#000; text-decoration:none; font-weight:bold; border-radius:4px; margin-top:15px; animation: floatPulse 2s infinite alternate;">📲 ENTER THE ZONE (SCAN QR)</a>`;
            } else {
                const distStr = distanceMeters === 999 ? 'Calculating...' : `${Math.round(distanceMeters)}m away`;
                actionHtml = `<div class="atlas-popup-distance">Too far (${distStr})</div>`;
            }

            mObj.marker.bindPopup(`
                <div class="atlas-popup-card">
                    ${imgHtml}
                    <h3 class="atlas-popup-title">${area.name}</h3>
                    <p class="atlas-popup-desc">${area.address || 'Unknown Coordinates'}</p>
                    <p class="atlas-popup-meta">Scans: ${area.scan_count || 0}</p>
                    ${actionHtml}
                </div>
            `, { className: 'atlas-popup', maxWidth: 300 });
        }

        // --- 5. UI INTERACTIONS ---
        function toggleLegend() {
            const panel = document.getElementById('legend-panel');
            panel.style.display = panel.style.display === 'none' || panel.style.display === '' ? 'block' : 'none';
        }

        // --- CREATOR MODE (PRESERVED) ---
        let creatorMode = false;
        let tempMarker = null;
        let tempCoords = {};

        function toggleCreatorMode() {
            creatorMode = !creatorMode;
            const btn = document.getElementById('creator-btn');
            const mapDiv = document.getElementById('quest-map');
            
            if(creatorMode) {
                btn.style.background = "var(--color-gold)";
                btn.style.color = "black";
                btn.innerHTML = "🛑";
                mapDiv.style.cursor = "crosshair";
                document.getElementById('sync-status').innerText = "CREATOR MODE";
                document.getElementById('sync-status').style.color = "var(--color-gold)";
            } else {
                btn.style.background = "rgba(26,26,26,0.7)";
                btn.style.color = "var(--color-sand)";
                btn.innerHTML = "📍";
                mapDiv.style.cursor = "grab";
                document.getElementById('sync-status').innerText = "ONLINE";
                document.getElementById('sync-status').style.color = "#0f0";
                if(tempMarker) map.removeLayer(tempMarker);
            }
        }

        map.on('click', function(e) {
            if(!creatorMode) return;
            if(tempMarker) map.removeLayer(tempMarker);
            
            tempMarker = L.marker(e.latlng).addTo(map);
            tempCoords = e.latlng;
            document.getElementById('create-modal').style.display = 'block';
        });

        function closeModal() {
            document.getElementById('create-modal').style.display = 'none';
        }

        async function saveBeacon() {
            if(!window.createWorldQuest) { alert("Engine Error"); return; }
            const title = document.getElementById('new-quest-title').value;
            const desc = document.getElementById('new-quest-desc').value;
            await window.createWorldQuest(title, desc, tempCoords.lat, tempCoords.lng);
            closeModal();
            toggleCreatorMode(); 
        }

        // SEARCH
        async function searchLocation() {
            const query = document.getElementById('map-search-input').value;
            if(!query) return;
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await response.json();
                if(data && data.length > 0) {
                    map.flyTo([data[0].lat, data[0].lon], 16, { duration: 1.5 });
                } else alert("Sector not found.");
            } catch(e) { console.error(e); }
        }

        // Burger Menu logic removed

        // INIT
        (async function bootAtlas() {
            if (window.AtlasEngine) window.AtlasEngine.init(map);
            loadFlowAreas();
            if (typeof window.loadMapPins === 'function') {
                try { await window.loadMapPins(map); } catch (e) { console.warn('[Atlas] loadMapPins:', e.message); }
            } else {
                let tries = 0;
                const waitPins = setInterval(async () => {
                    tries += 1;
                    if (typeof window.loadMapPins === 'function') {
                        clearInterval(waitPins);
                        try { await window.loadMapPins(map); } catch (e) { console.warn('[Atlas] loadMapPins:', e.message); }
                    } else if (tries > 15) clearInterval(waitPins);
                }, 200);
            }
            setTimeout(() => { map.invalidateSize(); }, 100);
            window.addEventListener('resize', () => map.invalidateSize());
            const params = new URLSearchParams(window.location.search);
            if (params.get('filter') === 'cinema' || params.get('cinema')) {
                setTimeout(() => {
                    document.querySelector('.atlas-filter[data-f="cinema"]')?.click();
                    window.VisionCinemaEngine?.focusFromQuery();
                }, 800);
            }
        })();

        window.toggleLegend = toggleLegend;
        window.searchLocation = searchLocation;
        window.toggleCreatorMode = toggleCreatorMode;
        window.centerOnUser = centerOnUser;
        window.saveBeacon = saveBeacon;
        window.closeModal = closeModal;

        }); /* DOMContentLoaded */
    </script>
</body>
</html>
