<!DOCTYPE html>

    <style>

        .bg-gold { background-color: #d4af37; }

            padding: 12px 30px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;

            cursor: pointer;

            display: inline-block;

<body class="min-h-screen bg-[#0a0a0a] bg-[url('../assets/branding/cqr-bg-dark.jpg')] bg-cover bg-fixed bg-center">

</html>
