<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Calypso Protocol | Circle D Flow</title>
    <link rel="stylesheet" href="css/dice.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;500;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="nav-overlay" style="position: fixed; top: 20px; left: 20px; z-index: 1000; display: flex; gap: 15px;">
        <a href="index.html" class="nav-icon-btn" title="Home" style="color: #fff; text-decoration: none; font-family: 'Inter', sans-serif; font-size: 14px; opacity: 0.7;">Home</a>
        <a href="/pages/dashboard.html" class="nav-icon-btn" title="Dashboard" style="color: #fff; text-decoration: none; font-family: 'Inter', sans-serif; font-size: 14px; opacity: 0.7;">Captain's Quarters</a>
        <a href="/pages/bantaba.html" class="nav-icon-btn" title="Bantaba" style="color: #fff; text-decoration: none; font-family: 'Inter', sans-serif; font-size: 14px; opacity: 0.7;">Bantaba</a>
    </div>

    <div id="calypso-canvas" aria-hidden="true"></div>

    <div class="container">
        <div id="lock-screen" class="screen active">
            <div class="logo-area">
                <p class="protocol-kicker">The Calypso Protocol</p>
                <h1>Identify Yourself</h1>
                <p>Enter your email to link this destiny roll to your session.</p>
                <p id="protocol-event" class="protocol-event"></p>
            </div>

            <form id="email-form">
                <input type="email" id="email-input" placeholder="captain@orbit.com" required>
                <button type="submit" class="glow-button">Connect Session</button>
            </form>
            <div id="error-message" class="error-hidden"></div>
        </div>

        <div id="dice-screen" class="screen">
            <h2 class="roll-title">Cast the Dice</h2>

            <div class="scene">
                <div class="cube" id="cube">
                    <div class="cube__face cube__face--front">1</div>
                    <div class="cube__face cube__face--back">6</div>
                    <div class="cube__face cube__face--right">3</div>
                    <div class="cube__face cube__face--left">4</div>
                    <div class="cube__face cube__face--top">2</div>
                    <div class="cube__face cube__face--bottom">5</div>
                </div>
            </div>

            <button type="button" id="cast-btn" class="glow-button cast-btn">Cast the Dice</button>

            <div id="result-popup" class="popup hidden">
                <h2 id="result-text">It's a 4!</h2>
                <p>Your contribution is <span id="result-amount">4</span>€.</p>
                <a id="checkout-btn" href="#" class="glow-button checkout-btn">Proceed to Payment</a>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/calypso_scene.js"></script>
    <script src="js/dice.js"></script>
</body>
</html>
